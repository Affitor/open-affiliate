# rate: stated two ways, so left out: "You receive from $50 to $699 for every sign-up based on the type of plan you refer to." (servebolt.com/affiliate-program/, checked 2026-10-20) vs a tier table on the same page of "10%" (Bronze, 1-5 sales) up to "25%" "per sale" (Platinum, 21+ sales) (servebolt.com/affiliate-program/, checked 2026-10-20)
# "You can earn a maximum of $699 per referral source" (servebolt.com/affiliate-program/, checked 2026-10-20)
commission:
  type: tiered
  rate: "varies"
  mode: unknown
  value: null
  duration: null
  conditions: "The page gives two pay models: a fixed $50 to $699 per sign-up depending on the plan referred, and a monthly tier table from 10% per sale (Bronze, 1 to 5 sales and $500+ MRR) through 15% (Silver), 20% (Gold) to 25% per sale plus quarterly perks (Platinum, 21+ sales and $5,000+ MRR), each requiring 100% retention over 60 days. The maximum is $699 per referral."

# "we provide tracking cookies for 60 days just to make sure you get credited for the sale." (servebolt.com/affiliate-program/, checked 2026-10-20)
cookie_days: 60

# minimum: stated two ways, so left out: "We have no minimum performance metrics or minimum earned-for payouts" (servebolt.com/affiliate-program/) vs "paid via PayPal, once a $100 minimum commission balance has been reached" (servebolt.com/affiliate-program/)
# "Commissions are processed in the first two weeks of each month and paid via PayPal" (servebolt.com/affiliate-program/, checked 2026-10-20)
# frequency: "After a brief holding period of 90 days, we pay out referral commissions within the first two week of each month." (servebolt.com/affiliate-program/, checked 2026-10-20); more than 60 days after the sale, so no structured frequency (backfill rule #1)
payout:
  methods: [paypal]
  conditions: "After a brief holding period of 90 days, we pay out referral commissions within the first two week of each month. Paid via PayPal. The page states both that there is no minimum earned-for payout and that a $100 minimum commission balance applies, with lower balances carried over."

