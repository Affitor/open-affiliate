# "Make 30% recurring commission for every customer you bring in." (supademo.com/affiliates, checked 2026-11-20)
# commission.duration: left out, the page gives an end point rather than a length: "If one of your referred customers cancels their Supademo plan, you'll receive commissions up to that customer's final billing month." and "There is a cap of $10,000 per referred customer." (supademo.com/affiliates, checked 2026-11-20)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  currency: USD
  duration: null
  conditions: "You earn 30% of each payment a referred customer makes once they move to a paid plan, on self-serve and enterprise plans alike. Commissions keep coming until the customer's last billing month if they cancel, up to $10,000 per referred customer, with no limit on how many customers you refer. Being an affiliate does not cost anything, there are no sales minimums or monthly targets, and you do not have to be a Supademo customer. After your first referral upgrades, the brand contacts you to explain how to claim your rewards. A separate influencer program pays $100 per 20,000 organic impressions on posts it approved in advance, up to $500 per post and two paid posts a month, invoiced monthly and paid by bank transfer; you cannot boost or promote that content with paid reach."

# cookie_days: not published on supademo.com/affiliates (checked 2026-11-20)
