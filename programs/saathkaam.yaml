description: "SaathKaam is a lightweight follow-up and people workspace for freelancers, consultants, agencies, accountants and service professionals. It helps users see what is pending, whose turn it is, what the next step is, when to follow up, and what happened previously.\n\nThe SaathKaam Partner Program is currently intended for eligible India-based Partners. Standard commission tiers are 10% Partner, 15% Growth Partner and 20% Pro Partner, subject to qualification and the Partner Terms. A valid active referral can give an eligible genuinely new customer a 30-day trial instead of the standard 7-day trial. Standard referral attribution is 30 days. Commission applies for up to the first 12 calendar months of a qualifying referred customer and becomes available according to completed subscription service months. The standard payout threshold is ₹1,000. Earnings are not guaranteed."

