description: >
  Pixlr is an online photo editor and design suite with Pixlr Express, Pixlr
  Editor and AI tools including an image generator, video and audio
  generators, background and object removal, image upscaling, generative fill
  and a photo collage maker.

  The affiliate program runs on Awin and pays 25% of a buyer's first purchase
  for each new Pixlr Premium or Plus subscriber. Applications are reviewed
  before approval, and affiliates get links, logos and banners. Payouts are
  made on the 20th of the month once earnings reach $50, by Payoneer or direct
  bank transfer. The program is open worldwide and a website is not required.

short_description: "Online photo editor and design suite with AI image tools"

