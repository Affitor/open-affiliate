network: rewardful
program_age: null

description: >
  Circleboom provides social media management and publishing tools,
  alongside Twitter account analytics. It helps users manage social
  accounts, plan posts and understand their audiences.

  Published rates conflict: the affiliate page and signup portal state 20%,
  while the program policy states 30%. The affiliate page separately
  advertises 25% and a $250 advance for eligible Elite affiliates.
  Commission length also conflicts: the page and policy say the first year,
  while the signup portal says the first payment within the first month.
  Confirm the applicable rate and length before promoting. The policy sets a
