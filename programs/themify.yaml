description: >
  Themify makes WordPress themes and plugins built for speed and SEO,
  including the Ultra and Shoppe themes, the Themify Builder drag-and-drop
  page builder, Builder Pro, Post Type Builder and builder addons. Themes are
  optimized for Google PageSpeed Insights.

  The affiliate program pays 40% on the initial purchase of any product,
  including memberships, plugins and addons, with a 60-day cookie. Payouts
  are made by PayPal in the first five business days of each month once
  commissions reach $100.

short_description: "Fast WordPress themes, plugins and the Themify Builder"

