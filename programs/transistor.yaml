description: >
  Transistor is a podcast hosting platform that lets you host unlimited shows
  on one account, with video podcast hosting, private podcasts for teams,
  distribution to podcast apps, AI transcription, analytics, a podcast website
  builder, an embeddable player and dynamic ad insertion.

  The affiliate program pays a 25% recurring commission every month for as
  long as a referred customer keeps paying. The cookie lasts 30 days, and
  payouts are sent monthly through PayPal once the balance reaches $200.
  Affiliates get brand assets and a dashboard with visitors, leads and
  conversions.

