description: >
  SparrowDesk is an AI-first help desk for customer support teams. It brings
  email and live chat into one inbox and adds ticketing, a help center, phone
  calls, AI agents that resolve customer queries, an AI copilot for agents,
  no-code workflows and macros, SLAs and reporting.

  The affiliate program runs on Impact and pays 25% recurring commission on
  every payment a referred team makes, renewals included, with a 90-day
  cookie. A commission unlocks after the subscription has been active for 30
  days and is paid the following month.

short_description: "AI-first help desk with ticketing, live chat and AI agents"

