description: >
  TemplateMonster is a marketplace for web design and development products,
  with website templates, WordPress themes, graphics, plugins and other
  digital items, plus related services.

  The affiliate program pays 30% of a referred user's first purchase and 10%
  of their further purchases, with a 60-day cookie and 5% from sub-affiliate
  sales. Affiliates get banners, articles, videos and other promotion tools and
  a personal affiliate manager. Paid ads are allowed except bidding on the
  brand name. Payments go out on request after identity verification, by
  PayPal, bank or wire transfer, or WebMoney.

