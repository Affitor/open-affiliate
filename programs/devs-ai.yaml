description: >
  Devs.ai is an AI platform where teams build AI-powered business
  applications and deploy custom agents on their own data, with governance
  built in from day one. It brings together an app builder, agent chat across
  leading models and an agent builder, for solo builders, small teams and
  growing organizations.

  The partner program runs on PartnerStack and pays 20% of net revenue from
  each referred customer for their first 12 months, with a 180-day
  attribution window from the first tracked click. Commissions are paid
  within 30 days after the end of the month in which Devs.ai receives
  payment, and partners get a real-time dashboard and marketing assets.

short_description: "AI platform to build business apps and custom agents"

