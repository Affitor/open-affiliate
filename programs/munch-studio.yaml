description: >
  Munch Studio is an AI social media manager for small businesses. It learns a
  business from its website, videos and photos, builds a content strategy,
  creates on-brand posts for Instagram, Facebook and LinkedIn, and lets the
  owner approve and publish them with one click while tracking results.

  The partner program has an affiliate path for communities, influencers,
  coaches and consultants that earns recurring revenue for every referral, with
  a partner dashboard and ready-to-use marketing assets. The commission rate,
  cookie length and payout terms are not published.

short_description: "AI that creates and posts social media content for small businesses"

