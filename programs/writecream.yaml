# "You will earn a healthy commission of 35% whenever a customer purchases one of our monthly plans using your referral link." (writecream.com/affiliate-program, checked 2026-10-13)
# duration: "you will get the same 35% commission every month until the referred customer is subscribed to our monthly plan" (same page)
commission:
  type: recurring
  rate: "35%"
  mode: percentage
  value: 35
  currency: USD
  duration: lifetime
  conditions: "35% of each payment on a monthly plan bought through your referral link, paid every month the referred customer stays subscribed. No approval wait: fill out a short form, register on the Reditus dashboard and submit payment details to get a referral link."

# cookie_days: not published on writecream.com/affiliate-program (checked 2026-10-13)

# "The minimum threshold for payments is $15." and "All the payouts are processed by the 7th of every month." (writecream.com/affiliate-program, checked 2026-10-13)
payout:
  minimum: 15
  currency: USD
  frequency: monthly

signup_url: https://go.writecream.com/affiliate-form

dashboard_url: null
# Tracking and payouts run on Reditus ("You will be redirected to our affiliate partner, Reditus' website"), which the network enum does not list
network: null
