# "Get paid 40% recurring commission as long as the user stays with us." (blogify.ai/partner-program, checked 2026-10-13)
commission:
  type: recurring
  rate: "40%"
  mode: percentage
  value: 40
  currency: USD
  duration: lifetime
  conditions: "Paid monthly on each referred customer's subscription for as long as the customer stays. Blogify also runs a separate referral program with a one-time reward per customer; you can join both."

# "60 days cookie period, we pay net 30 and get paid however you want, PayPal, Bank Transfer" (blogify.ai/partner-program, checked 2026-10-13)
cookie_days: 60

# "we pay net 30 and get paid however you want, PayPal, Bank Transfer" (blogify.ai/partner-program, checked 2026-10-13); payout minimum: not published on blogify.ai/partner-program (checked 2026-10-13)
payout:
  currency: USD
  frequency: net-30
  # methods: the page says "PayPal, Bank Transfer" but the FirstPromoter portal says "Net 30 Payment & 60 Days cookie." and "Wise/ Bank Transfer" (blogify.firstpromoter.com, checked 2026-10-13); only bank transfer, which both state, is kept
  methods: [bank]

