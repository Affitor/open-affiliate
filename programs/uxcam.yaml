description: >
  UXCam is a product analytics platform for mobile apps and websites with an
  integrated AI analyst. It records and analyzes how users behave in an app
  and turns millions of data points into insights for product teams, serving
  companies in more than 50 countries.

  The partner referral program pays 15% of the UXCam contract value after a
  successful referral. It is aimed at partners who help their clients make
  faster, better product decisions.

