description: >
  UXCam is a product analytics platform for mobile apps, web apps and
  websites. It records user sessions and adds heatmaps, user journey
  analytics, funnels, retention analytics, segments, dashboards and issue
  analytics so product teams can see how people use their app.

  The partner referral program pays 15% of the UXCam contract value for
  each successful referral. Partners apply through a form on the partner
  page and sign an agreement before referring clients. Commission length,
  cookie and payout terms are not published.

short_description: "Product analytics and session replay for mobile apps"

