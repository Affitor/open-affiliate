description: >
  Async, formerly Podcastle (podcastle.ai now redirects to async.com), is an
  AI video and audio editor you drive through chat. It removes filler and bad
  takes, cleans up audio, adds captions, generates B-roll, voices and music,
  and cuts long recordings into short clips for TikTok, Reels and Shorts, with
  a recording studio for podcasts and interviews.

  The affiliate program pays 25% commission on every eligible Async
  subscription bought through your link. Applicants fill in a short
  application and get a personal link once approved, plus banners, brand
  assets, a tracking dashboard and early access to new features.

