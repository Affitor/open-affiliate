description: >
  Text Blaze saves text you type often as snippets, each triggered by a
  short keyboard shortcut, and inserts it wherever you are typing.
  It offers customizable templates and automation. It runs as a
  Chrome extension and as macOS and Windows apps. Its product menu also
  lists AI Blaze for AI writing and editing and Data Blaze for tables and
  sheets.

  Affiliates apply through the program page, then share their link with
  their community through any channel. The program pays 50% of the
  payments a referred user makes in their first 12 months, with no cap
  on earnings.

short_description: "Snippets and templates that insert text from a short keyboard shortcut"

