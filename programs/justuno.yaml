description: >
  Justuno is a list growth platform for ecommerce brands. It turns site
  visitors into email and SMS subscribers with AI-powered popups, Smart
  Timing that launches popups from real-time visitor behavior, Spotlight
  visitor identification, A/B testing and done-for-you strategies.

  The affiliate program runs on PartnerStack and pays 30% of each referred
  customer's plan cost for up to one year. It is aimed at bloggers, SaaS
  reviewers, consultants and industry creators, with product training and
  an optional CRO certification for partners.

