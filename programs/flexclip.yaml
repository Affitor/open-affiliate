description: >
  FlexClip is an online video maker and editor with templates and a set of
  AI tools: AI video and image generation, text to video, auto
  subtitles, long-to-shorts, background removal, text to speech, voice
  cloning and music generation. It is built for people who want to make
  business, social media and personal videos without a learning curve.

  The affiliate program runs on Awin. Every approved affiliate gets at least
  35% commission by default, with higher rates for top partners, and sales
  are tracked with a 90-day cookie. Joining is free; bidding on FlexClip
  branded keywords in PPC is not allowed.

