description: >
  Literature & Latte develops Scrivener for organizing and drafting long-form
  writing and Scapple for exploring ideas visually. Its desktop software
  supports authors, researchers and other writers working on complex projects.

  The sales affiliate program pays 20% on qualifying software licence sales
  referred through an affiliate's website. FirstPromoter tracks referrals
  connected to the Paddle web store. Affiliates need a Wise account to receive
  payments, and fully discounted licences do not generate commission.

short_description: "Scrivener writing software with commissions on referred licence sales"

