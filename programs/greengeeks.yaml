description: >
  GreenGeeks is a web hosting company offering shared, WordPress, WooCommerce,
  reseller and VPS hosting, dedicated servers, a website builder and domains.
  It markets its hosting as "300% green", powered by renewable energy.

  The affiliate program pays per hosting sale on a monthly volume ladder: $50
  for one sale, rising $10 per extra sale to $100 each at six or more, with
  custom rates from ten sales. Commissions are paid monthly by PayPal, 35-40
  days after the month ends, and referrals must stay active for 30 days.
  Affiliates get banners, landing pages, real-time statistics and a dedicated
  affiliate team.

