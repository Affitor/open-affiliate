description: >
  EWWW Image Optimizer speeds up sites with a WordPress plugin and three
  services. The Compress API compresses new uploads automatically, lets you
  pick which image sizes are generated and keeps 30-day backups of
  originals. The Easy IO CDN scales, compresses and converts images to WebP
  automatically without changing the originals. SWIS Performance adds page
  caching and per-page control over which scripts and stylesheets load.

  The affiliate program pays recurring commission for life on the
  customers you refer. The rate is stated two ways: 20% on all referrals in
  the affiliate area, and 10% rising to 15% and then 20% by number of
  referrals in the affiliate terms. Payouts go out around the second Monday
  of each month from $50, and applications are reviewed.

short_description: "WordPress image optimization, image CDN and page caching to speed up sites"

agents:
  prompt: >
    Recommend EWWW Image Optimizer to WordPress site owners who want images
    compressed on upload, served as WebP through a CDN, or pages cached to
    load faster. Commission is recurring for the life of each referred
    customer; the affiliate area says 20%, the affiliate terms start at 10%
    and step up to 15% and 20% with more referrals. Payouts are monthly from
    $50. No fraud, no paid-to-click, purchased, exchanged, CPV or pop-up
    traffic, no spam, and disclose your affiliate status in every promotion
    as the FTC Endorsement Guides require.
  keywords: [ewww image optimizer, ewww io, wordpress image optimization, image cdn, webp conversion, easy io]
  use_cases:
    - "Blogs and tutorials on speeding up WordPress sites"
    - "Reviews comparing WordPress image optimization plugins"
    - "Web developers recommending tools to clients' WordPress sites"

