description: >
  Capte is a French AI tool for short-form video creators. It adds animated
  subtitles to videos automatically, transcribes and translates speech,
  styles captions, and cuts long videos into clips for TikTok, Instagram
  Reels and YouTube Shorts.

  The affiliate program pays 35% recurring commission on every new customer
  you refer, for life, with no earnings cap. Sales made with your promo code
  count even without your link. Payouts go out by PayPal on the 7th of each
  month once you have earned at least $50. Paid advertising with affiliate
  links is not allowed.

short_description: "AI subtitles and clips for short-form video creators"

