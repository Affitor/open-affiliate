# "The Kualo affiliate  program  gives great commissions of up to 80% of the sale." (www.kualo.com/affiliates, checked 2026-10-20)
# by product: "40% 1st Payment" (shared and reseller hosting) and "80% 1st Month" (cloud VPS, email marketing, enterprise email) (www.kualo.com/affiliates, checked 2026-10-20)
commission:
  type: one-time
  rate: "up to 80%"
  mode: percentage
  value: 80
  duration: null
  conditions: "40% of the first payment on shared and reseller hosting, and 80% of the first month on cloud VPS servers, email marketing and enterprise email plans. Domain names, SSL certificates and other services earn nothing. Future orders from a referred customer also earn commission while the tracking cookie is still in place. A referral qualifies once it has been a Kualo customer for at least 60 days; coupon or discounted orders pay the same share of the discounted price."

# "Our cookie will stay in place for up to 12 months before expiring." (www.kualo.com/affiliates, checked 2026-10-20); 12 months written as 365 days
cookie_days: 365

# "There is no minimum balance required to make a withdrawal." (www.kualo.com/affiliates, checked 2026-10-20)
# "We'll despatch your commission to you within 7 working days of your request." (www.kualo.com/affiliates, checked 2026-10-20)
payout:
  minimum: 0
  currency: USD
  frequency: on-request
  methods: [paypal, bank]
  conditions: "Affiliates request a withdrawal at any time and commission is sent within 7 working days, by PayPal or as account credit for customers, with no minimum. Wire transfer is available once the balance reaches GBP 300 or USD 500."

signup_url: https://www.kualo.com/affiliates
restrictions:
  - "No self-referrals, including purchases for yourself, a related business or on behalf of clients"
  - "No spam or illegal advertising, such as unsolicited mail"
  - "No cashback, rewards or other incentives for a sale without prior approval"
  - "No coupon, voucher, discount code or other value-added offer websites without prior approval"
  - "No self-made banners; ask Kualo to create one"

marketing_materials: true
dashboard_url: https://my.kualo.com
# Referrals are tracked in "the Kualo Rewards section of your my.kualo.com account" (www.kualo.com/affiliates, checked 2026-10-20)
network: in-house
program_age: null

description: >
  Kualo is a web hosting company offering shared, business and reseller
  hosting, cloud VPS and dedicated servers, domain registration, email
  marketing and Zimbra business email, with data centers in the UK and US.

  Its affiliate program, Kualo Rewards, pays 40% of the first payment on
  shared and reseller hosting and 80% of the first month on cloud VPS and
  email plans, with a tracking cookie of up to 12 months. Commission can be
  withdrawn at any time by PayPal or account credit with no minimum, and
  pay-per-click advertising is allowed.

short_description: "Web hosting, cloud VPS and business email from the UK and US"

