description: >
  AVS4YOU is a suite of five programs that work with audio, video and
  image files. Its Windows software includes AVS Video Editor, Video
  Converter, Video ReMaker, Audio Editor and Audio Converter, and it is
  sold as one-year or unlimited subscriptions.

  The affiliate program pays a 50% commission on each sale from the
  start, and the rate grows as you generate more sales. Joining is free.
  Commissions are paid monthly by 2Checkout, and affiliates sign up on
  the Avangate Affiliate Network, with banners, product descriptions,
  images and logos provided.

short_description: "Windows suite for editing and converting video, audio and image files"

