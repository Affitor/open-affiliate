description: >
  Spybot - Search & Destroy is the flagship product of Safer-Networking:
  anti-spyware that sits on top of award-winning anti-virus protection and
  guards against malware, spyware and other threats online. The company also
  makes Spybot Anti-Beacon, which stops telemetry, Spybot Identity Monitor,
  Spybot Track Shredder, RegAlyzer and FileAlyzer.

  The affiliate program runs through the 2Checkout affiliate network and pays
  25% on every sale you refer, with referrals credited for 120 calendar
  days. Commissions are paid monthly to a 2Checkout prepaid debit
  MasterCard, by wire transfer, by check or through PayPal.

short_description: "Anti-spyware protection against malware, plus privacy tools that stop telemetry"

