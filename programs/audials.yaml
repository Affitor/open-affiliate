description: >
  Audials makes Windows software for recording streaming video and TV,
  streaming music, radio and podcasts, and for improving videos with AI.

  The affiliate program runs on Commission Junction and pays 40% commission
  on every Audials software license sold through your channels. Audials
  says the CJ route suits blogs, websites and YouTube channels
  in particular, and affiliates do not have to run an ESD store stocked with
  software keys. Affiliates get advertising material such as texts and
  product boxes.

short_description: "Windows software to record streaming video, music, radio and podcasts"

