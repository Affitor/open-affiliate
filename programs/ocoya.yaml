description: >
  Ocoya is an AI-powered social media management tool. It plans and schedules
  posts across Facebook, Instagram, X, LinkedIn, TikTok, YouTube Shorts,
  Pinterest, Threads, Bluesky and more from one calendar, with a design studio,
  a social inbox for DMs and comments, link-in-bio pages, workflows, an API and
  an MCP server.

  The affiliate program runs on Rewardful and pays 30% recurring commission on
  each referred subscription for as long as the customer stays subscribed.
  Referred customers get 20% off at checkout, the cookie lasts 60 days, and
  payouts go out by PayPal.

