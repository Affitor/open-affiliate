description: >
  MagicLight is an AI story video platform that turns text, scripts and images
  into long-form story videos with consistent characters and art styles. It
  offers text to video, script to video, AI animation, avatars, voice cloning
  and subtitles, with models such as Sora 2, VEO 3, Kling and Seedance built
  in, on the web and on iOS and Android.

  The affiliate program pays tiered commission on cumulative sales: 30% up to
  $1,600, 40% from $1,600 to $3,200 and 50% above $3,200, plus an extra 5% on
  sales from affiliates you refer. Signup is instant with no approval step.
  Payouts go out monthly by PayPal or crypto once the balance reaches $30.

short_description: "AI story video generator for long-form animated videos"

