description: >
  PowerAdSpy is an AI-powered competitive ad intelligence platform. It
  indexes ads running on Facebook, Instagram, TikTok, YouTube, Google and
  other networks across 100+ countries so advertisers can see what
  competitors run before spending on tests.

  The affiliate program pays up to 30% revenue share for the life of each
  referred customer. Signup is free and the page says affiliates are
  approved within 24 hours and can track clicks, conversions and payouts in
  a dashboard.

