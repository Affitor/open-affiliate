commission:
  type: recurring
  rate: "up to 30%"
  mode: percentage
  value: 30
  currency: USD
  duration: 12 months
  conditions: "30% on Enterprise plans and 20% on all other plans, on the referred customer's subscription for 12 months. A valid customer is a U.S. company new to Hubstaff that registers through your link and adds an employee within 30 days. Commissions are withheld for three months per referral, then paid monthly; refunds and chargebacks are not paid. The PayPal and Wise names in the website navigation describe product integrations, not affiliate payment methods; no withdrawal rails or numeric minimum are published in the reviewed program sources."

