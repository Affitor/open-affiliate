payout:
  minimum: 50
  currency: USD
  # payout.frequency: stated two ways, so left out: "we pay you each month" (monthly) vs "You can withdraw once you have earned at least $50." (on request) (rayobyte.com/affiliates/, checked 2026-11-26), see conflicts
  conditions: "The page says Rayobyte pays affiliates monthly, and also that a withdrawal can be made once earnings reach $50."

