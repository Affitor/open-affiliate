description: >
  Social Intents is a live chat and AI chatbot platform that lets teams answer
  website chat, WhatsApp, SMS and Messenger conversations from Microsoft
  Teams, Slack, Google Chat, Zoom or Webex. AI chatbots built on ChatGPT,
  Claude or Gemini handle questions and capture leads, and hand off to a
  person when needed. Pricing has no per-agent fees.

  The affiliate program pays recurring commission on every customer you
  refer, with no caps, a 90-day cookie and monthly payouts. The affiliate
  page states the rate as both 20% and 25%, so check the current rate when you
  join.

short_description: "Live chat and AI chatbots answered from Teams, Slack or Google Chat"

