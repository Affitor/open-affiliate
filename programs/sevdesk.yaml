description: >
  sevdesk is cloud accounting and invoicing software for freelancers and small
  businesses in Germany and Austria. It creates compliant invoices and
  e-invoices, captures receipts from the app or email, prepares the income
  statement (EÜR) and files VAT returns directly with the tax office.

  The affiliate program runs on Awin and pays a fixed commission per new
  customer: up to €30 for an Invoicing plan, up to €95 for an Accounting plan
  and up to €200 for an Accounting Pro plan. Longer plan terms earn more. Awin
  provides the promotional material and your partner link.

short_description: "Accounting and invoicing software for German freelancers"

