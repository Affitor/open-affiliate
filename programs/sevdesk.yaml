description: >
  sevdesk is cloud accounting and invoicing software for self-employed people,
  freelancers and small businesses in Germany. It supports invoices, receipt
  capture, bookkeeping, banking connections and collaboration with tax advisers.

  The affiliate programme runs through Awin. The brand page and its linked
  Awin profile advertise different commission amounts; confirm the applicable
  terms before promotion. Longer plan terms affect the payment, and approved
  publishers receive marketing materials and an individual tracking link.

short_description: "Accounting and invoicing software for German freelancers"

