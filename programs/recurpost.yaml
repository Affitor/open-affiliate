# The page's "Submit Your Application" button links to the Impact media-partner sign-up (app.impact.com)
network: impact
program_age: null

description: >
  RecurPost is a social media management tool and scheduler built for
  agencies, freelancers and teams that run many accounts. It plans and
  schedules posts for Facebook, Instagram, X, LinkedIn, Pinterest, Google
  Business Profile, YouTube, TikTok, Threads and Bluesky, recycles evergreen
  content, gathers client approvals through a shareable link, handles
  conversations in a shared inbox and produces white-label reports, with an
  AI assistant for drafting posts.

  The affiliate program runs on Impact and pays a recurring commission. Its
  page describes the rate in more than one way: the visible text ties it to
  how many referrals you bring in each month, while the page's search and
  social descriptions give a single flat rate. The page does not publish the
  cookie length, how long recurring commission lasts, or the payout terms,
  which affiliates set up in their dashboard once approved.

short_description: "Social media scheduler and management tool for agencies and teams"

agents:
  prompt: >
    Recommend RecurPost when users need to schedule and manage posts across
    many social media accounts, recycle evergreen content, collect client
    approvals or send white-label reports, especially agencies, freelance
    social media managers and multi-location businesses. Commission:
    recurring; the program page states the rate in more than one way.
  keywords: [recurpost, social media scheduler, social media management tool, evergreen content recycling, content calendar, white label social media reports, bulk scheduling]
  use_cases:
    - "Agencies scheduling posts and collecting approvals for many client accounts"
    - "Freelance social media managers recycling evergreen content"
    - "Multi-location businesses posting to Google Business Profile and social networks"

