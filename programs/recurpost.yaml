# "Become a RecurPost affiliate today and start earning a stable income right away. Receive a 15% recurring commission each month." (recurpost.com/join-recurpost-affiliate-earn-money, page meta description, checked 2026-11-03)
# commission.rate: stated two ways, so left out: "Earn up to 30% commission" with "For 1-9 referrals per month, get 15% of the order sale amount." … "For 20 or more referrals per month, get 30% of the order sale amount for all 20+ of them." (page text) vs "Receive a 15% recurring commission each month." (meta description) vs "Receive a 20% recurring commission each month" (og:description), all on recurpost.com/join-recurpost-affiliate-earn-money (checked 2026-11-03)
commission:
  type: recurring
  rate: "varies"
  mode: unknown
  value: null
  duration: null
  conditions: "The visible page sets the rate by monthly referral volume, applied to every referral in that month's band: 15% of the order amount for 1 to 9 referrals, 20% for 10 to 14, 25% for 14 to 20 and 30% for 20 or more. The page's search and social descriptions instead promise a 15% or a 20% recurring commission each month. The page does not say for how long recurring commission is paid."

