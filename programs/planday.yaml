description: >
  Planday is a workforce management and employee scheduling platform for
  shift-based businesses in hospitality, retail, healthcare, hotels and
  similar trades. Managers build AI-assisted rotas, track time and
  absences, message staff and forecast staffing costs, while employees see
  their shifts and earnings in a mobile app, and hours flow into payroll.
  A 30-day free trial is available.

  The PartnerStack listing advertises up to 15% recurring commission. Its
  default offer specifies 10% revenue share for the first five years of
  customer purchases. The listing directs affiliates to their contract for
  full details, so confirm the applicable offer before promoting.

