# approval_time: left out; the program is unverified (commission type not published), and approval times are not shown for unverified programs
approval: manual
restrictions:
  - "Applicants must already use Novelcrafter with an active account, and keep an active subscription to stay an affiliate"
  - "No self-referrals: you may not create a Novelcrafter account through your own referral link"
  - "No abuse of the affiliate system or attempts to mislead, manipulate or defraud Novelcrafter or potential customers, such as posting fake discounts on coupon-sharing websites or any other activity that breaks its policies"
  - "No paid search ads (above all on branded keywords or domain names), no Facebook ads, and no other advertising that competes with Novelcrafter's marketing"
  - "Do not impersonate Novelcrafter or pretend to act on its behalf, including posing as an employee or representative"
  - "Affiliate aggregators, listicle sites and distributors are not accepted"

dashboard_url: null
