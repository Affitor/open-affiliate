# commission.duration: not published on novelcrafter.com/affiliates or novelcrafter.com/legal/affiliates (checked 2026-11-15)
commission:
  type: one-time
  rate: "20%"
  mode: percentage
  value: 20
  duration: null
  conditions: "A 20% commission rate on referrals. Affiliate links carry no discount for the buyer, since Novelcrafter keeps one price on every channel."

# cookie_days: not published on novelcrafter.com/affiliates or novelcrafter.com/legal/affiliates (checked 2026-11-15)

