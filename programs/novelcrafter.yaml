# "If we detect any self-referrals, your account will be permanently banned and any commission earned will be forfeited." (novelcrafter.com/legal/affiliates, checked 2026-11-15)
payout:
  conditions: "Self-referrals lead to a permanent ban and the loss of any commission already earned. Novelcrafter may also revoke affiliate status at any time for a breach of its affiliate terms, or if the affiliate cancels their own subscription for an extended period."

signup_url: https://www.novelcrafter.com/affiliates
