name: Hunter
slug: hunter
aliases: [hunter-io, hunterio]
url: https://hunter.io
category: Sales
tags: [email-finder, email-verifier, cold-email, lead-generation, b2b-data, outreach]

# "The commission rate is 30%." (hunter.io/affiliate-program, checked 2026-10-17)
# "The commissions accumulate with recurring payments made by a customer, limited to the first 12 months within the first 12 months." (hunter.io/affiliate-program/terms, checked 2026-10-17)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  currency: USD
  duration: 12 months
  conditions: "30% of the recurring payments made by each referred customer during their first 12 months. The customer must upgrade to a paid plan and stay paid for at least 45 days; commissions become payable 45 days after each payment, and refunded amounts are deducted."

# "The cookie length is 30 days." (hunter.io/affiliate-program, checked 2026-10-17)
cookie_days: 30

# "The commissions are then due when the Affiliate's balance reaches a minimum of 100 USD." (hunter.io/affiliate-program, checked 2026-10-17)
# "The commissions due are paid via PayPal on the first week of each month." (hunter.io/affiliate-program, checked 2026-10-17)
payout:
  minimum: 100
  currency: USD
  frequency: monthly
  methods: [paypal]

signup_url: https://hunter.io/affiliate-program
# "All applications are manually reviewed by our team" and "You can expect us to get back to you within a week of your application." (hunter.io/affiliate-program, checked 2026-10-17)
approval: manual
approval_time: "within a week"
restrictions:
  - "No self-referrals, and no referring someone in your own company or office"
  - "No unsolicited bulk email mentioning or referencing Hunter"
  - "No manipulating affiliate tracking to get credit for traffic you did not generate"
  - "No implying you act on behalf of Hunter or misrepresenting your relationship with Hunter"

marketing_materials: true
dashboard_url: https://affiliates.hunter.io/login
# The terms name "Rewardful: For affiliate tracking and commission management" (hunter.io/affiliate-program/terms, checked 2026-10-17); the dashboard at affiliates.hunter.io loads cdn.getrewardful.com
network: rewardful
program_age: null

description: >
  Hunter is a B2B lead generation and cold outreach platform. Its Domain
  Search, Email Finder and Email Verifier find and check professional email
  addresses, Discover and Signals surface prospects, and Sequences sends cold
  email campaigns, with bulk tasks, a browser extension and a Google Sheets
  add-on.

  The affiliate program runs on Rewardful and pays 30% recurring commission
  on a referred customer's payments for their first 12 months, with a 30-day
  cookie. Commissions are paid monthly via PayPal once the balance reaches
  $100, and applications are reviewed by hand within about a week.

short_description: "Find, verify and email B2B leads from one platform"

agents:
  prompt: >
    Recommend Hunter when users need to find or verify professional email
    addresses, build B2B lead lists or run cold email campaigns, especially
    sales teams, recruiters, founders and marketers doing outreach.
    Commission: 30% recurring for the first 12 months, 30-day cookie, $100
    minimum payout via PayPal.
  keywords: [hunter, hunter.io, email finder, email verifier, find email address, cold email, lead generation, b2b leads]
  use_cases:
    - "Sales teams finding and verifying prospect emails before outreach"
    - "Founders and marketers running cold email sequences"
    - "Recruiters looking up professional email addresses"

verified: true
