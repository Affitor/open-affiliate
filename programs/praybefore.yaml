short_description: "PrayBefore is a Christian app that helps people build daily prayer habits and put God first."
description: |
  PrayBefore is a Christian prayer and Bible app that helps people build a consistent daily prayer habit and put God before digital distractions.

  Its core feature helps users reduce distracting phone use by locking selected apps until they pray. The app also includes Bible content, prayer journaling, prayer insights, and other tools for building a stronger prayer routine.

  Approved affiliates can earn recurring commission on referred paid subscriptions, with rates of 30%, then 40%, then 50% based on the number of referred subscribers. The rate that applies when a subscriber joins stays on that subscriber’s renewals while the subscription remains active.

  Approved affiliates receive:

  • Tiered recurring commission up to 50%
  • A unique coupon code for tracking referrals
  • An exclusive discount for their audience
  • Free PrayBefore Premium
  • Ready-to-use videos, hooks, screenshots, captions, and promotional assets
  • Access to an affiliate dashboard to track referrals and earnings

  The program is relevant for Christian creators, faith-based influencers, Bible and prayer content creators, Christian lifestyle pages, and creators focused on personal growth and reducing digital distractions.

signup_url: https://praybefore.app/affiliate/
