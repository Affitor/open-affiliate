description: |
  PrayBefore is a Christian prayer and Bible app designed to help people build a consistent daily prayer habit and put God before digital distractions.

Its core feature, Prayer Lock, helps users reduce distracting phone use by locking selected apps until they pray. PrayBefore also includes guided prayers, Bible content, daily verses, prayer journaling, prayer insights, streaks, and other tools for building a stronger prayer routine.

Affiliate Program

Earn 30% lifetime recurring commission for every subscriber you refer. As long as your referred user remains subscribed, you continue earning commission from their subscription renewals.

Approved affiliates receive:

• 30% lifetime recurring commission
• A unique coupon code for tracking referrals
• An exclusive discount for their audience
• Free PrayBefore Premium
• Ready-to-use videos, hooks, screenshots, captions, and promotional assets
• Access to an affiliate dashboard to track referrals and earnings

PrayBefore is especially suited for Christian creators, faith-based influencers, Bible and prayer content creators, Christian lifestyle pages, and creators focused on personal growth and reducing digital distractions.

Our goal is simple: help more people pray consistently and spend less time distracted by their phones.

