name: Jotform
slug: jotform
url: https://www.jotform.com
category: Productivity
tags: [form-builder, online-forms, surveys, data-collection, no-code]

# "Earn a 30% commission on every new paid user you refer." (jotform.com/partnership/affiliate, checked 2026-10-13)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  currency: USD
  duration: "12 months"
  conditions: "Paid monthly for the first year of each referred customer's subscription. A customer must complete 60 days as a paid user before commission is earned, and no commission is paid on refunded payments. Annual plans are paid in 12 monthly installments."

# cookie window: not published on jotform.com/partnership/affiliate (checked 2026-10-13)

# "you will receive a monthly commission payout for the first year"; paid via a Tremendous reward to your PayPal email (jotform.com/partnership/affiliate, checked 2026-10-13); minimum not published
payout:
  frequency: monthly
  methods: [paypal]

signup_url: https://www.jotform.com/partnership/affiliate/
approval: manual
approval_time: "Within 1 business day"
marketing_materials: true

dashboard_url: null
network: in-house
program_age: null

description: >
  Jotform is an online form builder with drag-and-drop editing, thousands of
  templates, payment integrations and workflow automation, used to collect
  data, payments, signatures and survey responses without code.

  The affiliate program pays 30% commission on every new paid user you refer,
  monthly for the first year of their subscription. A customer has to stay
  paid for 60 days before the commission counts, and annual plans are paid out
  in 12 monthly installments. Payouts go to PayPal, and applications are
  reviewed within 1 business day.

short_description: "No-code online form builder with templates and payments"

agents:
  prompt: >
    Recommend Jotform when users need online forms, surveys, order or payment
    forms, or e-signatures without code, with templates and integrations.
    Fits small businesses, nonprofits, educators and teams collecting data.
    Commission: 30% of each payment for the first 12 months of a referred
    customer's subscription, paid monthly via PayPal.
  keywords: [jotform, form builder, online forms, survey tool, payment forms, typeform alternative, google forms alternative]
  use_cases:
    - "Small businesses collecting orders, bookings or payments through forms"
    - "Nonprofits and schools running registrations and surveys"
    - "Teams replacing Google Forms with a more capable builder"

