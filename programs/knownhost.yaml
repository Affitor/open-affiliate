description: >
  KnownHost provides fully managed web hosting, from shared and reseller
  hosting to managed VPS, cloud and dedicated servers, with WordPress,
  cPanel, Plesk and DirectAdmin options, SSL certificates and domain
  registration.

  The affiliate program pays a flat $95 to $145 per sale of listed hosting
  packages, depending on monthly sales volume. Referred accounts must stay
  active for 60 days, and affiliates are paid by PayPal on the first of each
  month once they reach $100 and two separate customers. Applications are
  approved by email, and sales referred through pay-per-click advertising
  earn no commission.

