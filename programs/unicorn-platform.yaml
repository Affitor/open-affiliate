# "For every paid client you refer to Unicorn Platform, you will be paid 33% of the recurring commission . Forever." (unicornplatform.com/earn/, checked 2026-11-04)
# "You earn 33% of all their payments." (unicornplatform.com/earn/, checked 2026-11-04)
commission:
  type: recurring
  rate: "33%"
  mode: percentage
  value: 33
  duration: lifetime
  conditions: "33% of all payments from each paid client you refer, forever. Only new customers who have not subscribed to Unicorn Platform before and complete a valid, non-fraudulent transaction count; self-referrals, fake accounts and chargebacks are fraudulent."

# cookie_days: stated two ways, so left out: "60 days cookie period" (unicornplatform.com/earn/) vs "with a 30-day cookie window from the user’s initial click" (unicornplatform.com/affiliate-program-terms/ §7), checked 2026-11-04
conflicts:
  - field: cookie_days
    quote: "unicornplatform.com/earn/: \"60 days cookie period\". unicornplatform.com/affiliate-program-terms/ §5: \"as tracked by a 30-day cookie window\" and §7: \"with a 30-day cookie window from the user’s initial click\". Checked 2026-11-04."
    values: ["60 days", "30 days"]

# "Commissions are paid monthly. Payments are processed within 15 days of the month’s end." (unicornplatform.com/affiliate-program-terms/ §5, checked 2026-11-04) — within 15 days after month end → net-30 (backfill rule #1)
# "Cash out in one click (Bank, Paypal, Wise)." (unicornplatform.com/earn/, checked 2026-11-04)
# payout.minimum: not one figure; it depends on the method: "Wise with min. payout of $200 Paypal with min. payout of $50" (unicornplatform.com/earn/, checked 2026-11-04)
payout:
  currency: USD
  frequency: net-30
  methods: [bank, paypal, wise]
  conditions: "Commissions are paid monthly, processed within 15 days of the month's end. The minimum payout depends on the method: $50 for PayPal and for bank transfers in Australia, Canada, the UK and the US; $200 for Wise, international bank and IBAN transfers."

signup_url: https://unicornplatform.com/earn/
# "Unicorn Platform reserves the right to approve or reject applications based on factors such as promotional methods, website content, or history of fraudulent activity." (unicornplatform.com/affiliate-program-terms/ §2, checked 2026-11-04)
approval: manual
# Affiliate Program Terms §2 Eligibility (disclosure under FTC guidelines), §3 Affiliate Responsibilities (ethical, lawful promotion, disclosure, no IP infringement), §4 Prohibited Activities (paid advertising; spamming; deceptive marketing; illegal, offensive or inappropriate sites; cookie dropping and forced redirects), §5 Commission Structure (self-referrals, fake accounts); §1 and §6 to §12 hold no further prohibitions (unicornplatform.com/affiliate-program-terms/, checked 2026-11-04)
restrictions:
  - "No affiliate links in any paid advertising, including Google Ads, Facebook Ads or other pay-per-click or paid media campaigns"
  - "No spamming, such as unsolicited emails to purchased lists or links posted in irrelevant forums"
  - "No deceptive marketing, such as false claims about Unicorn Platform's services"
  - "No affiliate links on websites or platforms promoting illegal, offensive or inappropriate content"
  - "No cookie dropping, forced redirects or other methods that trigger tracking without user consent"
  - "No self-referrals or fake accounts"
  - "Clearly disclose the affiliate relationship in all promotional content, following U.S. FTC guidelines"
  - "Promotions must be ethical, accurate and lawful, including GDPR and the CAN-SPAM Act, and must not infringe third-party intellectual property"

# "An essential collection of banners" (unicornplatform.com/earn/, checked 2026-11-04)
marketing_materials: true
dashboard_url: null
