description: >
  Syllaby is an AI tool for creating faceless videos and AI avatar videos for
  social media. It writes scripts, renders videos with AI avatars or faceless formats,
  and schedules posts, so creators can publish without appearing on camera.

  The affiliate program runs on FirstPromoter and pays 30% recurring commission
  on all paid subscriptions you refer, for the lifetime of the customer. The
  cookie lasts 60 days, payouts are monthly by PayPal or bank transfer once
  you reach $50, and affiliates get banners, videos, articles and a dedicated
  affiliate manager.

