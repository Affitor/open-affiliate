description: >
  Automattic is the company behind WordPress.com, WooCommerce, Jetpack,
  Pressable and other WordPress products. Its brands cover managed WordPress
  and WooCommerce hosting, domains, premium themes, WooCommerce extensions,
  Jetpack security and performance tools, the Sensei course plugin, WP Job
  Manager and a website design service.

  The Automattic Creator Program covers all of these brands in one program on
  Impact. Hosting referrals on WordPress.com, Pressable and WooCommerce earn
  100% of the first payment, up to $300 per sale; Jetpack pays 40%, themes and
  WooCommerce extensions 30% plus 10% on returning customers, and other
  products 5% to 20%. The tracking window is 30 days and applications are
  reviewed.

short_description: "WordPress.com, WooCommerce, Jetpack and Pressable in one program"

