description: >
  Appointlet is appointment-scheduling software for booking meetings and
  managing availability. It connects calendars and supports scheduling
  workflows across sales, customer service, education and other teams.

  Its affiliate program pays a recurring 20% on referred customers'
  paid subscriptions for their lifetime. It provides a 45-day referral
  window, with monthly PayPal payments from USD 50. Fraud and paid ads
  targeting the brand or its variations are prohibited.

