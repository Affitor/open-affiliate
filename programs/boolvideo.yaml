description: >
  Boolvideo is an all-in-one AI video generator. It turns ideas, scripts,
  product links, blog posts, images and clips into videos with AI-written
  scripts, voiceovers, music and visuals, matching scenes from your own media
  or a stock library. It also offers templates and AI image tools such as
  background removal and photo enhancement.

  The affiliate program pays 40% of the first purchase from every customer
  you refer, once per user. Commissions are paid monthly via Wise or PayPal,
  and affiliates get promotional assets, training manuals and support from
  the Boolvideo team.

short_description: "AI video generator that turns ideas, scripts and links into videos"

