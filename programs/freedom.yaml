description: >
  Freedom is an app and website blocker that helps people focus by blocking
  distracting sites and apps, such as YouTube, TikTok, X, Facebook and
  Instagram, on desktop and on iOS and Android. Plans include
  Freedom Premium and the lifetime Freedom Forever, plus offers for companies
  and schools.

  The affiliate and ambassador program runs on Impact and pays a 10% baseline
  commission on qualifying purchases, with a 90-day cookie. Approved
  affiliates get pre-written content, creatives and exclusive discounts. The
  page notes that a new program is coming soon.

short_description: "App and website blocker for focus and productivity"

