description: >
  NitroPack is a site speed optimization service for WordPress and other
  websites. It caches pages, optimizes images and code, and serves assets
  through a CDN to improve load times and Core Web Vitals without manual
  tuning.

  The affiliate program runs on NitroPack's own tracking system and pays a
  20% recurring commission for up to 18 months per referred subscription,
  with a 30-day cookie. Affiliates request payouts from their dashboard once
  the balance reaches $100, and applications are reviewed within about two
  business days.

short_description: "Automated site speed optimization for WordPress and the web"

