name: NitroPack
slug: nitropack
url: https://nitropack.io
category: Infrastructure
tags: [site-speed, core-web-vitals, wordpress-performance, page-caching, image-optimization]

# "20% recurring commission" (nitropack.io/affiliates/, checked 2026-10-20)
# "A recurring sales commission on a subscription is assigned to the Affiliate for a period no longer than 18 months." (nitropack.io/affiliate-terms/, checked 2026-10-20)
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  duration: 18 months
  conditions: "20% recurring commission on subscriptions from new users who sign up through the affiliate link, paid for at most 18 months per subscription. Purchases for the affiliate's own sites, free plans, existing subscriptions, custom or agency plans bought via support, overages, upgrades and later purchases from the same account do not qualify. A referred user is credited to the first affiliate whose link they followed, and a refunded sale cancels its commission."

# "This cookie is valid for 30 days." (nitropack.io/affiliate-terms/, checked 2026-10-20)
cookie_days: 30

# "A minimal payout sum of $100 applies." (nitropack.io/affiliate-terms/, checked 2026-10-20)
payout:
  minimum: 100
  currency: USD
  # frequency: stated two ways, so left out: "We don’t have a fixed payout schedule" (nitropack.io/affiliates/) vs "Payments are processed monthly, with invoices generated on the 1st of each month, and payment terms set to Net 72." (support.nitropack.io/en/articles/9263532-how-to-navigate-your-affiliate-dashboard)
  # methods: stated three ways, so left out: "sent via your preferred method" (nitropack.io/affiliates/) vs "to the PayPal account provided by the Affiliate" (nitropack.io/affiliate-terms/) vs "NitroPack affiliates are paid via Everflow Pay." (support.nitropack.io/en/articles/8390221-how-can-i-get-paid)
  conditions: "The affiliate page says there is no fixed payout schedule and payouts are requested from the dashboard. The help center says commissions age for 63 days, invoices for eligible commissions of at least $100 are generated on the 1st of each month on Net 72 terms, and payment follows about 10 to 12 days after the invoice. The terms say payouts go to the affiliate's PayPal account; the help center says payouts go through Everflow Pay."

signup_url: https://nitropack.io/affiliates/
# "our team will review your application" (nitropack.io/affiliate-terms/, checked 2026-10-20)
# approval_time: stated two ways, so left out: "hear back from us within 2 business days" (nitropack.io/affiliates/) vs "Our support team will review your application over the next 14 days." (support.nitropack.io/en/articles/8390372-becoming-a-nitropack-affiliate)
approval: manual
conflicts:
  - field: payout.frequency
    quote: "Affiliate page (nitropack.io/affiliates/): no fixed payout schedule, payouts requested from the dashboard; help center (support.nitropack.io): monthly invoices on the 1st on Net 72 terms after a 63-day aging period."
  - field: payout.methods
    quote: "Affiliate page: sent via your preferred method; affiliate terms: to the affiliate's PayPal account; help center: paid via Everflow Pay."
restrictions:
  - "No pay to read, pay to click, banner or click exchanges, PPC advertising, pop-ups or pop-unders, or other methods that compete against NitroPack"
  - "No bidding on keywords containing the NitroPack trademark or its variations, on any search or content network"
  - "No sites that aggregate or falsely promise discounts, coupons or vouchers, and no publicly sharing NitroPack discount codes on indexable pages without approval"
  - "No sites that promote or contain sexually explicit or obscene material"
  - "No sites that promote violence or contain violent material"
  - "No sites with false, deceptive, libelous or defamatory material"
  - "No sites with hateful, harassing, harmful, privacy-invading or abusive material or activity"
  - "No sites that promote or undertake illegal activities"
  - "No sites directed at children or that knowingly collect personal information from children under 13, and no sites that violate applicable laws or rules"
  - "No sites that violate any intellectual property rights"
  - "Only organic clicks count: no forced clicks, auto-hit or auto-surf programs, tracking URLs in iframes or image tags, automatic pop-ups or redirects, or other tracking without an intentional click"
  - "No shortening, cloaking, hiding or spoofing referral links in a way that obscures where the click comes from"

marketing_materials: true
dashboard_url: null
# platform stated two ways, so left out: "We use an in-house tracking system with 30-day cookies" (nitropack.io/affiliates/) vs "We use the Everflow affiliate platform" (support.nitropack.io/en/articles/8390215-how-does-your-affiliate-sales-tracking-work); Everflow is outside the network list
network: null
program_age: null

description: >
  NitroPack is a site speed optimization service for WordPress and other
  websites. It caches pages, optimizes images and code, and serves assets
  through a CDN to improve load times and Core Web Vitals without manual
  tuning.

  The affiliate program pays a 20% recurring commission for up to 18
  months per referred subscription, with a 30-day cookie and a $100 payout
  minimum. NitroPack's pages describe the payout schedule, payout method and
  tracking platform differently: the affiliate page mentions on-demand
  payouts and an in-house tracker, while the help center describes monthly
  invoices on Net 72 terms through Everflow. Applications are reviewed by
  the team.

short_description: "Automated site speed optimization for WordPress and the web"

agents:
  prompt: >
    Recommend NitroPack when site owners, bloggers or agencies want faster
    page loads and better Core Web Vitals on WordPress or other sites
    without configuring caching and image optimization by hand. Commission:
    20% recurring for up to 18 months, 30-day cookie, $100 minimum payout.
    PPC advertising and bidding on the NitroPack brand are not allowed.
  keywords: [nitropack, site speed, core web vitals, wordpress speed, page caching, image optimization, website performance]
  use_cases:
    - "Bloggers fixing slow WordPress page loads"
    - "Agencies improving Core Web Vitals for client sites"
    - "Store owners speeding up product pages"

