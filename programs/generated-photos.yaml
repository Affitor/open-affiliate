description: >
  Generated Photos offers photo-realistic images of people created by AI.
  It has galleries of pre-generated faces and of full-body humans, a Face
  Generator and a Human Generator that create unique people by your
  parameters, an Anonymizer, datasets and an API.

  The affiliate program pays 50% for each customer who starts a paid
  monthly or annual subscription, once per customer, with a 45-day cookie.
  Commissions are paid monthly once you reach $50. It looks for affiliates
  with a website, blog, podcast or social channels with substantial traffic
  whose content covers AI, machine learning, gaming, design or content
  marketing.

short_description: "AI-generated photos of people, with face and full-body human generators"

