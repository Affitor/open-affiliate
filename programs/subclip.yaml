description: >
  Subclip is an AI video tool for creators and teams. It adds styled viral
  captions, translates and dubs videos into more than 30 languages with AI
  voice cloning, clips long recordings into short videos, with a Mac app and
  an iOS app.

  The affiliate program pays 30% recurring commission on eligible purchases
  by each referred customer for their first year, with a 25-day cookie and a
  $60 payout minimum. Promo-code purchases do not earn commission, and
  competing paid ads on Subclip brand terms are not allowed.

short_description: "AI captions, translation and dubbing for creator videos"

