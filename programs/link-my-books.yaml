    ecommerce clients. The program is open to anyone and counts only new
    users. Commission: 20% recurring for the customer's lifetime, 60-day
    cookie, paid monthly via PayPal; no PPC bidding on branded terms.
  keywords: [link my books, linkmybooks, ecommerce bookkeeping, amazon seller accounting, shopify xero integration, quickbooks ecommerce]
  use_cases:
    - "Amazon and Shopify sellers automating bookkeeping in Xero or QuickBooks"
    - "Accountants and bookkeepers serving ecommerce clients"
    - "Ecommerce YouTube channels, blogs and newsletters about seller tools"

