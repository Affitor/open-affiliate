description: >
  BigSpy is an ad spy tool and ad library with more than a billion ad
  creatives across 11 ad channels, including Facebook, TikTok, Google,
  YouTube and AppLovin, in 80+ countries and 26 languages. Marketers and
  e-commerce sellers use it to track competitor ads and find creative ideas.

  The affiliate program pays at least 20% lifetime recurring commission on
  each full-price payment from referred users. The cookie lasts 60 days,
  applications are usually reviewed within a week, and last month's
  commission is paid the next month by PayPal once it reaches $50.

short_description: "Ad spy tool and ad library across 11 ad channels"

