commission:
  type: tiered
  rate: "$60 per sale for 1-2 sales a month, $110 per sale at 3 or more"
  mode: tiered
  value: 110
  currency: USD
  duration: null
  conditions: "Flat fee per paid sale based on monthly volume: $60 per sale for 1 to 2 paid sales in a month, $110 per sale for 3 or more. Each active free hosting signup earns $0.10. Commission is paid only on orders with a paid shared hosting or VPS plan bought for at least a year, not on discounted or promo-code orders, and only for referrals that stay active. Custom rates can be negotiated."

