description: >
  AwardSpace is a web hosting provider offering free hosting, shared and
  WordPress hosting, semi-dedicated and VPS hosting, plus domain names and
  SSL certificates, with 24/7 support.

  The affiliate program pays a flat fee per paid sale based on monthly
  volume: $60 per sale for 1-2 sales a month and $110 per sale at 3 or
  more, plus $0.10 per free hosting signup. Only paid
  shared or VPS plans bought for at least a year count. Payouts start at
  $100 through PayPal, Moneybookers, bank transfer or check, and accounts
  are active right after sign-up.

short_description: "Free and paid web hosting with VPS, WordPress hosting and domains"

