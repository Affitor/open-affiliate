# payout.frequency: stated two ways, so left out: "paid on net-60 day basis, between 10-15th day of the month (for instance commission for August will be paid between 10-15th of October)" (awardspace.com/web-hosting/affiliates) vs "paid on a net-60 basis, between the 20-30th day of the month [for instance a commission for January will be paid between 20-30th of March]" (awardspace.com/terms-of-services), checked 2026-10-26
payout:
  minimum: 100
  currency: USD
  methods: [paypal, bank, check]
  conditions: "Paid once the affiliate balance reaches $100, through PayPal, Moneybookers, bank transfer or paper check. Bank wire and check payouts are reduced by a $30 fee. Both pages say net-60, but the affiliate page pays between the 10th and 15th of the second month after the commission month, while the terms say between the 20th and 30th."

