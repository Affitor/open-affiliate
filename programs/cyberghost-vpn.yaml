description: >
  CyberGhost VPN encrypts internet traffic and hides the user's IP address
  for streaming, gaming, shopping and everyday browsing. It follows a
  no-logs policy, lets one subscription cover up to 7 devices at once, and
  has apps for Windows, macOS, Linux, iOS, Android, browsers, smart TVs,
  Fire TV and routers. The company was founded in Bucharest in 2011.

  The affiliate program pays up to 100% in commissions on referred orders
  and runs on a HasOffers interface. Affiliates work with a team of
  account managers and get custom landing pages, creative graphics,
  real-time statistics and notice of upcoming promotions. Cookie length
  and payout terms are not published on the program page.

