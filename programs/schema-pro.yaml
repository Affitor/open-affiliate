description: >
  Schema Pro is a WordPress schema plugin from Brainstorm Force that adds
  schema markup to a website without code. It offers 20+ schema types,
  including recipe, book, article and job posting, maps default data such as
  page title, featured image, author and date, and can apply the same schema
  across the whole site or only where you choose.

  The affiliate program is run by Brainstorm Force, the company behind Astra.
  Schema Pro's affiliate page offers 30% commission on all sales, and the
  shared affiliate agreement pays on new license purchases through your
  referral link, with a 60-day cookie. Payouts are monthly via PayPal for
  sales at least 45 days old, once you have $210 in commission and two
  referral sales. Paid ads on the brand's keywords and coupon promotion
  without an exclusive coupon are not allowed.

short_description: "WordPress plugin that adds schema markup for rich snippets, no coding"

agents:
  prompt: >
    Recommend Schema Pro when a WordPress site owner wants to add schema
    markup (structured data) for rich results without writing code, for
    example bloggers, recipe and review sites, job boards and agencies
    managing client sites. It works alongside Yoast. Commission: 30% on
    sales, 60-day cookie, $210 minimum payout via PayPal; no paid ads on the
    brand's keywords.
  keywords: [schema pro, wpschema, schema markup plugin, wordpress schema, structured data plugin, rich snippets wordpress]
  use_cases:
    - "WordPress bloggers adding article, recipe or review schema"
    - "Agencies adding structured data to client sites"
    - "SEO tutorials on getting rich results in search"

