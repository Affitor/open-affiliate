# "Earn 30% commission for 12 months on eligible new Basic and Grow subscriptions." (pineapplebuilder.com/affiliates, checked 2026-10-13)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  currency: USD
  duration: "12 months"
  conditions: "30% for 12 months from the first eligible paid invoice on new Basic and Grow subscriptions. Taxes and refunds are excluded; clicks and signups alone do not earn commission. Commissions have a 30-day review period. Referred customers get 10% off their first subscription invoice with the partner's code. Applications are reviewed; no self-referrals or spam."

# "Your referral link has a 60-day attribution window." (pineapplebuilder.com/affiliates, checked 2026-10-13)
cookie_days: 60

# "Request a payout when your approved balance reaches $50. PayPal and bank-transfer payouts are arranged manually" (pineapplebuilder.com/affiliates, checked 2026-10-13); the page says "No payment date is guaranteed."
payout:
  minimum: 50
  currency: USD
  methods: [paypal, bank]

signup_url: https://www.pineapplebuilder.com/affiliates

dashboard_url: null
