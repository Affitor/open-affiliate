network: null
program_age: null

description: >
  Pineapple Builder is an AI website builder for small businesses. It drafts
  a first version of a site with AI, lets owners update pages and copy in
  plain English, and brings forms, SEO, hosting, blogging, newsletter signups,
  analytics and memberships together in one place.

  The partner program pays 30% commission for 12 months on eligible new
  Basic and Grow subscriptions, starting from the first paid invoice.
  Referral links have a 60-day attribution window, and referred customers
  get 10% off their first invoice with the partner's code. Payouts can be
  requested from a $50 approved balance by PayPal or bank transfer.

short_description: "AI website builder for small business sites"

