description: >
  Bento is an email marketing platform that puts marketing email,
  automation, live chat and transactional email on one customer profile.
  Teams use it to send targeted email and SMS at scale and to build
  automations based on user behaviour and purchases.

  The affiliate program runs on Rewardful and pays a 10% recurring
  commission for as long as each referred customer stays a paying
  customer. Only customers new to Bento who sign up through your link
  count. Paid ads, brand bidding, self-referrals, spam and coupon sites are
  not allowed.

short_description: "Email marketing, automation, chat and transactional email on one customer profile"

agents:
