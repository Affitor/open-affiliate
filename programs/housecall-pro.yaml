  - "Demo accounts are for personal education only; do not share, copy, display or publicly provide them to third parties"
  - "Obtain necessary intellectual property permissions; do not publish infringing material"
  - "Promotional properties must not be subject to existing or threatened intellectual property infringement claims or reasons to expect such claims"
  - "No promotional properties containing or associated with sexually explicit, obscene or pornographic material"
  - "No promotional properties containing or associated with offensive, profane, hateful, threatening, harmful, defamatory, libelous, harassing or discriminatory material"
  - "No promotional properties containing or associated with graphically violent material"
  - "No promotional properties soliciting unlawful behavior"
  - "Do not claim ownership of supplied promotional materials or their intellectual property"
  - "No ads directing to your own site or through any affiliate link that compete with Housecall Pro advertising, including but not limited to branded keywords"
  - "Do not deliver referrals through mechanisms other than an intended referral, including bots, iframes or hidden frames"
  - "Do not incentivize referrals"
  - "Disclose the affiliate relationship and compensation under FTC endorsement rules"
  - "Lead exhaustion above 35% may cause termination and exhausted-lead payout clawbacks; exhausted statuses include bad contact information, do not call, not target prospect and not yet interested"
  - "Clearly tell your network that Housecall Pro supports only the United States and Canada; more than three out-of-region referrals end earning eligibility"
  - "Do not bind Housecall Pro to agreements or represent yourself as its agent"
  - "Do not misrepresent Housecall Pro or its services"
