restrictions:
  - "Refer genuine home-service businesses only in the United States or Canada, using accurate contact information and genuine intent to be contacted"
  - "Do not submit fabricated, incomplete or intentionally incorrect leads"
  - "Do not complete a lead or trial form on behalf of the identified person"
