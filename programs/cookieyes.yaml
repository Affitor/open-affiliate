description: >
  CookieYes is a consent management platform that adds a cookie consent
  banner to websites and helps them comply with GDPR, CCPA, CPRA and other
  privacy laws. It scans sites for cookies, blocks scripts until consent,
  keeps consent records, supports Google Consent Mode and IAB TCF, and runs
  on WordPress, Shopify, Wix and other platforms. It also offers cookie and
  privacy policy generators.

  The affiliate program pays 30% recurring commission on referred customers'
  subscriptions for three years from account creation, with a 60-day cookie
  and first-click attribution. Payouts are monthly once the balance reaches
  $100, by PayPal or bank transfer. Most applicants are approved instantly.

short_description: "Cookie consent and privacy compliance for websites"

