description: >
  PushEngage is a customer engagement and retention platform with web push
  notifications, app push, in-app messaging and WhatsApp messaging. Over
  75,000 businesses use it to recover abandoned carts, bring visitors back and
  grow repeat revenue.

  The affiliate program pays a 30% commission with a 60-day attribution
  window. There is no sign-up fee and no sales requirement. Payouts are
  monthly via PayPal or NEFT once the balance reaches $10.

short_description: "Web push, app push, in-app and WhatsApp messaging for retention"

