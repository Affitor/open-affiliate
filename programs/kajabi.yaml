description: >
  Kajabi is an all-in-one platform for experts to build, sell and grow a
  business: online courses, communities, newsletters, coaching, digital
  downloads, memberships and podcasts, with email marketing, a website builder,
  funnels and payments built in.

  The Kajabi Partner Program is open to Kajabi customers. New partners earn a
  one-time bounty of 100% of each referral's first month; from 5 active
  referrals the program pays 10% to 20% of every subscription payment. Payouts
  go to PayPal on the 25th of the month after a 60-day hold.

short_description: "All-in-one platform to sell courses, coaching and memberships"

