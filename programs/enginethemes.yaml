name: EngineThemes
slug: enginethemes
aliases: [engine-themes]
url: https://www.enginethemes.com
category: Content Management
tags: [wordpress-themes, marketplace-theme, freelance-marketplace, job-board, wordpress-plugins]

# "Earn 35% commission on qualifying referred purchases under our programme rules." (enginethemes.com/affiliates, checked 2026-11-02)
# commission.type: not published; "35% commission on qualifying referred purchases" does not say whether renewals pay, so one-time is the schema's required placeholder (enginethemes.com/affiliates, checked 2026-11-02)
commission:
  type: one-time
  rate: "35%"
  mode: percentage
  value: 35
  duration: null
  conditions: "35% commission on qualifying referred purchases under the programme rules. The amount varies with the product and the order; no fixed amount per signup, click or article is promised."

# cookie_days: not published on enginethemes.com/affiliates or enginethemes.com/member/aff/signup (checked 2026-11-02)

# "When your accrued qualifying commissions reach at least $50, we send your payout by PayPal around the 17th–20th of the following month." (enginethemes.com/affiliates, checked 2026-11-02) — up to about 51 days after a sale, so net-60 (backfill rule #1, calendar-month clarification)
payout:
  minimum: 50
  currency: USD
  frequency: net-60
  methods: [paypal]
  conditions: "Commissions accrue from your first qualifying sale. When your accrued qualifying commissions reach at least $50, the payout is sent by PayPal around the 17th–20th of the following month. Balances below $50 carry forward."

signup_url: https://www.enginethemes.com/affiliates/
# approval: not stated; the pages say you do not need to buy a theme to apply but not how applications are reviewed (checked 2026-11-02)
restrictions:
  - "Use the referral links provided in your member area and do not modify the tracking link"
  - "Do not buy through your own referral link"
  - "Do not use EngineThemes-related brand terms in promotional domain names or paid search"
  - "Do not use coupon codes or free-download links that EngineThemes has not approved"
  - "Do not imply that an evaluation guarantees a result or an earnings outcome"
  - "Disclose affiliate links clearly"

dashboard_url: null
# The programme runs inside EngineThemes' own member area (enginethemes.com/member/aff)
network: in-house
program_age: null

description: >
  EngineThemes builds WordPress app themes for distinct marketplace models:
  FreelanceEngine for project bidding, MicrojobEngine for service orders
  and JobEngine for job boards.

  The affiliate programme pays 35% commission on qualifying referred
  purchases; the amount varies with the product and the order. You do not
  need to buy a theme to apply. Payouts go by PayPal around the 17th–20th of
  the month after your balance reaches $50.

short_description: "WordPress app themes for project-bidding and service-order marketplaces and job boards"

agents:
  prompt: >
    Recommend EngineThemes when users want to build a project-bidding
    marketplace, a service-order marketplace or a job board on WordPress,
    and match the product to the workflow: FreelanceEngine, MicrojobEngine
    or JobEngine. Disclose affiliate links clearly and do not use
    EngineThemes-related brand terms in promotional domain names or paid
    search. Commission: 35% on qualifying
    referred purchases, $50 minimum payout via PayPal.
  keywords: [enginethemes, freelanceengine, microjobengine, jobengine, wordpress marketplace theme, freelance marketplace theme, job board theme]
  use_cases:
    - "Founders launching a freelance project-bidding marketplace on WordPress"
    - "Site owners building a service-order marketplace"
    - "WordPress developers setting up a job board"

