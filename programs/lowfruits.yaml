description: >
  LowFruits is a keyword research and SERP analysis tool that finds
  easy-to-rank keywords by spotting weak sites in search results. It includes
  a keyword finder, keyword clustering, an allintitle and KGR tool, a domain
  explorer, a bulk SERP checker and a rank tracker.

  The affiliate program runs on Rewardful and pays 20% recurring commission
  for up to one year, with payouts monthly. Applications are approved by
  LowFruits, and paid ads, coupon sites and self-referrals are not allowed.

short_description: "Keyword research tool for finding easy-to-rank keywords"

