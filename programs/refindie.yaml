# "Earn 30% recurring commission on every payment from customers you refer—for as long as they stay subscribed to Refindie." (refindie.com/affiliate-program, checked 2026-11-06)
# "Every qualifying subscription you drive adds recurring commission on each renewal—not just the first payment." (refindie.com/affiliate-program, checked 2026-11-06)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
  conditions: "30% of every subscription payment from a referred customer, renewals included, for as long as that customer stays subscribed. Full details are shown in the affiliate portal after registration."

# cookie_days: not published on refindie.com/affiliate-program (checked 2026-11-06)
