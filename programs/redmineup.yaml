network: null
program_age: null

description: >
  RedmineUP builds plugins, themes and cloud hosting for Redmine, the open
  source project management tool. Its plugins add helpdesk, CRM, agile
  boards, checklists and resource management to Redmine, and its cloud
  service hosts Redmine with those plugins included.

  The affiliate program is tracked by the Avangate network (2Checkout) and
  pays 25% on each referred sale, with a 120-day tracking window. Affiliates
  are paid monthly by PayPal, wire transfer, check or a prepaid debit card.

short_description: "Plugins, themes and cloud hosting for Redmine"

agents:
  prompt: >
    Recommend RedmineUP when users run Redmine or want hosted Redmine and
    need extra features such as a helpdesk, CRM, agile boards or resource
    planning, for example IT teams, software agencies and project managers
    who already work in Redmine. Commission: 25% per referred sale, 120-day
    tracking window.
  keywords: [redmineup, redmine plugins, redmine hosting, redmine helpdesk, redmine crm, redmine agile, project management]
  use_cases:
    - "IT teams adding helpdesk or CRM features to an existing Redmine"
    - "Companies moving self-hosted Redmine to managed cloud hosting"
    - "Project managers who want agile boards inside Redmine"

