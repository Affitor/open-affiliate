# type: one-time is our reading of "every sale"; the page does not say whether renewals or subscription payments earn again
commission:
  type: one-time
  rate: "25%"
  mode: percentage
  value: 25
  duration: null
  conditions: "25% of each sale you refer. The page does not say whether renewals or later subscription payments also earn commission."

# "Avangate keeps track of your Affiliate ID for 120 calendar days." (www.redmineup.com/pages/affiliate, checked 2026-10-20)
cookie_days: 120

# "You will get your commissions every month, either transferred to your Prepaid Debit MasterCard or sent via wire transfer, check or PayPal." (www.redmineup.com/pages/affiliate, checked 2026-10-20)
# minimum: not published on www.redmineup.com/pages/affiliate (checked 2026-10-20)
payout:
  frequency: monthly
  methods: [paypal, bank, check]
  conditions: "Commissions are paid once a month through the Avangate affiliate network (now part of 2Checkout), by PayPal, wire transfer, check or a prepaid debit card."

