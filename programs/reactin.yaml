# "No, advertising using ReactIn's brand name (e.g., in paid ads or as a keyword) is prohibited. Violations may result in revocation of your affiliate status." (reactin.io/affiliates, checked 2026-11-12)
restrictions:
  - "No ads that use the ReactIn brand name, in paid ads or as a keyword; breaking this can cost you your affiliate status"

