# "Get 30% of every payment, lifetime, for every paying subscriber you bring in." (reactin.io/affiliates, checked 2026-11-12)
# "You earn 30% recurring commission for every paying subscriber who signs up through your link." (reactin.io/affiliates, checked 2026-11-12)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
  conditions: "30% of each payment from every paying subscriber you refer, for the life of the subscription. The page also says each referral earns at least $21."

# cookie_days: not published on reactin.io/affiliates (checked 2026-11-12)

# payout.minimum: stated two ways, so left out: "You can request a payout at any time once you reach the minimum threshold of $50." (reactin.io/affiliates) vs "Earn a minimum of $21 per referral" and "Earnings per referral may vary, with a minimum guaranteed payout." (reactin.io/affiliates, checked 2026-11-12)
# payout.frequency: stated two ways, so left out: "earn 30% lifetime commission, paid monthly" (reactin.io/affiliates) vs "You can request a payout at any time once you reach the minimum threshold of $50. Payouts are processed within 48 hours." (reactin.io/affiliates, checked 2026-11-12)
# payout.methods: not published on reactin.io/affiliates (checked 2026-11-12)
payout:
  conditions: "The program page says commissions are paid monthly, while its FAQ says a payout can be requested whenever the balance is at least $50 and is processed within 48 hours. The same page also promises a guaranteed minimum of $21 earned per referral."

# The "Become a ReactIn Affiliate" button opens a sign-up form on app.getreditus.com (Reditus), which was not requested; the brand's own program page is used instead
