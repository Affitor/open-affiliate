description: >
  Any.do is a to-do list, task manager and calendar app for personal life and
  teams. It combines tasks, calendar events, a daily planner and reminders,
  and is used by people in more than 160 countries.

  The Ambassadors Program pays 20% commission on new paid subscriptions for
  the first 12 months after the initial sale. The cookie lasts 90 days and
  restarts if the user clicks again, sales are credited after the 30-day refund
  period, and payouts go out on the 13th of each month once rewards reach $50.

short_description: "To-do list, task manager and calendar app"

