  conditions: "50% commission on referred sales. The same page also describes the payout as CPAs on new sales without giving a CPA amount, so the rate is the only figure stated; whether renewals pay is not said."

# cookie_days: not published on ipvanish.com/partners (checked 2026-11-08)

