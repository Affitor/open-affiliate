description: >
  Lexware Office is the online accounting software from Lexware for
  freelancers, the self-employed and small and mid-sized businesses. It writes
  and sends invoices, including e-invoices, books receipts from a photo,
  pulls in payments from a linked bank account and lets a tax advisor work
  in the same account. Lexware has made business software since 1989 and
  serves the German-speaking market.

  The affiliate program runs on Awin and pays EUR 55 per sale, counted once
  a referred customer keeps a paid subscription past the 30-day trial
  right. The page gives two different tracking windows. Payouts go out monthly through Awin to a
  German bank account, and affiliates must be adults with full legal
  capacity. Applications are reviewed, and sites with adult, violent,
  unlawful or low-quality content are turned down.

short_description: "Online accounting, invoicing and e-invoicing software for German freelancers and small firms"

