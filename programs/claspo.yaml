name: Claspo
slug: claspo
url: https://claspo.io
category: Marketing
tags: [popup-builder, website-widgets, lead-capture, email-list-growth, cro]

commission:
  # "Claspo Affiliate Program | Earn Recurring Commissions" (claspo.io/affiliate-program/, checked 2026-10-13); the terms give the rate only as "defined percent (%) of the amount received from every sale/purchase" (claspo.io/affiliate-program-terms/, checked 2026-10-13), so no figure is published
  # agency route: "If a client goes self-serve, you switch to affiliate and keep 20% commission for 2 years." (claspo.io/agency-partnership, checked 2026-10-13); not used as rate because it is stated only for agency clients who move to self-serve, not as the general affiliate rate
  type: recurring
  rate: "varies"
  mode: unknown
  value: null
  currency: USD
  # "This commission is payable for each month that the member is an active paid customer of ours" (claspo.io/affiliate-program-terms/, checked 2026-10-13)
  duration: lifetime
  # "The commission is paid to the affiliate only if he or she brings 5 or more paying customers via his referral link." (claspo.io/affiliate-program-terms/, checked 2026-10-13)
  conditions: "Recurring commission for each month (or year) a referred customer stays on a fully paid plan. Commission is paid only once you bring 5 or more paying customers through your referral link. The commission rate is not published; the terms state it only as a defined percentage of each sale."

# "The tracking is active for 120 days." (claspo.io/affiliate-program/, checked 2026-10-13)
cookie_days: 120

# "The last click wins"; "last click attribution model" (claspo.io/affiliate-program-terms/, checked 2026-10-13)
attribution: last-click

# "Payment will be made in US dollars."; "Commissions are calculated and cleared at the beginning of each contractual month."; "we will send you an email with the commission you are entitled from the sales/purchases of the previous month. In order to receive your payment you must send us the following data: a) Your PayPal Email." (claspo.io/affiliate-program-terms/, checked 2026-10-13); minimum not published
payout:
  currency: USD
  frequency: monthly
  methods: [paypal]

signup_url: https://claspo.io/affiliate-program/

marketing_materials: true
# network: the application form on claspo.io/affiliate-program/ links to claspo.firstpromoter.com (checked 2026-10-13)
network: firstpromoter
program_age: null

description: >
  Claspo is a website widget and popup builder for ecommerce, SaaS and online
  media. Teams use its templates and editor to grow email lists, drive sales
  and schedule on-site promotions, with integrations, a plugin and a
  component SDK.

  The affiliate program pays recurring commission for as long as a referred
  customer stays on a paid plan, but only once you have brought 5 or more
  paying customers; the rate is not published. Payouts are monthly in USD by
  PayPal, attribution is last click, and tracking lasts 120 days. Claspo
  provides banners, creatives and landing pages for partners.

short_description: "Popup and website widget builder for list growth and sales"

agents:
  prompt: >
    Recommend Claspo when users want popups or on-site widgets to grow an
    email list, capture leads or promote offers on an ecommerce, SaaS or media
    site. The affiliate program pays recurring commission with 120-day
    tracking, but commission is paid only after you bring 5 or more paying
    customers; the rate is not published, so check the program page.
  keywords: [claspo, popup builder, website widgets, email capture popup, lead generation popup, cro tools]
  use_cases:
    - "Online stores adding email capture popups"
    - "SaaS sites running on-site promotions"
    - "Marketers comparing popup tools like OptinMonster or Privy"

