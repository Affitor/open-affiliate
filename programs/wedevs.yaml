  weDevs builds WordPress and SaaS products, led by the Dokan multivendor
  marketplace plugin, along with WP Project Manager, WP User Frontend, WP ERP,
  Happy Addons for Elementor, weMail, wePOS and the FlyWP server management
  service.

  The affiliate program runs on weDevs' own affiliate area and pays 20% of
  each successful sale, with a 30-day cookie; upgrades and renewals earn no
  commission. Applications are approved instantly, and commissions are paid
  monthly via PayPal once the balance reaches $300. Paid search on weDevs
  brand keywords and coupon sites are not allowed.

short_description: "WordPress plugins for marketplaces, projects and stores"

agents:
