# "We offer 20% commission from each successful sale." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
# "Sadly, we are not offering any commission for upgrades and license renewals." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
commission:
  type: one-time
  rate: "20%"
  mode: percentage
  value: 20
  currency: USD
  duration: null
  conditions: "20% of each successful sale of a weDevs product made through the affiliate link. No commission is paid on upgrades or license renewals, purchases through your own link earn nothing, and refunded or fraudulent sales are reversed. A commission must be 30 days old before it can be withdrawn."

# "Whenever a visitor clicks through your affiliate link, a 30-day cookie is set." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
cookie_days: 30

# "Minimum $300USD credit required to get paid" (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
# "All affiliate payments are made via PayPal." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
# "payments for the prior month will then be sent to your PayPal account by the end of the next month." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20) — paid within 30 days after month end → net-30 (backfill rule #1)
payout:
  minimum: 300
  currency: USD
  frequency: net-30
  methods: [paypal]
  conditions: "Each month's sales are audited by hand at month end, and valid commissions for the prior month are sent to PayPal by the end of the next month once the balance reaches $300. A completed W-9 or W-8BEN tax form is required before any payout."

signup_url: https://wedevs.com/affiliates/
# "Our short application only takes a minute to complete and you are instantly approved into our program." (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
approval: auto
restrictions:
  - "No coupon sites, and no false or misleading information about weDevs discount codes"
  - "No paid search ads on weDevs brand keywords such as weDevs, Dokan, WP Project Manager or WP User Frontend Pro, or their variations"
  - "No domain names containing weDevs brand keywords, and no masked URLs or inaccurate coupon code links"
  - "No promoting in the weDevs forums or using forum profile signatures with affiliate links"
  - "No spamming links without a meaningful conversation or in irrelevant threads, and no link farms or spamming forums or websites"
  - "No blackhat or unethical methods to manipulate search engines"
  - "No false or exaggerated information about weDevs products"
  - "No promoting direct competitors at the same time"
  - "No commission on purchases through your own affiliate link"

marketing_materials: true
dashboard_url: http://affiliates.wedevs.com/
# The terms say a cookie named affwp_ref (AffiliateWP) is set on weDevs' own site; the affiliate area is affiliates.wedevs.com (wedevs.com/affiliates/affiliate-terms-and-conditions/, checked 2026-10-20)
network: in-house
