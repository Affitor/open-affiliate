# "Your first payment arrives after 30 days, then repeats every month for as long as your referrals keep using Convertri." (convertri.com/affiliates, checked 2026-10-31)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
  conditions: "30% commission for each person you refer, paid every month for as long as the referred customer keeps using Convertri. The first payment comes after 30 days."

# cookie_days: not published on convertri.com/affiliates (checked 2026-10-31)

# "Enter your PayPal Address." (convertri.com/affiliates, checked 2026-10-31)
