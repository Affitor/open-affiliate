category: Developer Tools
tags: [wordpress, divi, plugins, themes, website-design]

# "30% commission on individual products." (diviextended.com/affiliates, checked 2026-10-20)
# "10% commission on Divi Extended Annual and Lifetime membership" (diviextended.com/affiliates, checked 2026-10-20)
commission:
  type: tiered
  rate: "10% to 30%"
  mode: percentage
  value: 30
  conditions: "The rate is 30% for individual products and 10% for annual or lifetime memberships."

# "30 days cookie lifetime" (diviextended.com/affiliates, checked 2026-10-20)
