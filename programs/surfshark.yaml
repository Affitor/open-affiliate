description: >
  Surfshark is an online security suite built around a VPN with unlimited
  device connections, plus Antivirus, Alert (data breach alerts), Search,
  Alternative ID and Incogni for removing
  personal data from data brokers. Apps cover desktop, mobile, browsers and TV.

