# "Earn 30% monthly with our Recurring Commission for every referred customer who stays subscribed" (neuraltext.com/affiliate-program/, checked 2026-11-04)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
