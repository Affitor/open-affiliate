description: >
  Pinin is an AI photo restoration service from Italy. It repairs scratches,
  tears, fading and damage, colorizes black-and-white photos, and sharpens,
  denoises and upscales low-resolution images while keeping faces and details
  as they were. The first photo is free with no credit card, and Pinin also
  offers batch processing, API access and manual restoration.

  The affiliate program pays 15% of every credit pack and subscription
  payment from referred customers, renewals included, rising automatically to
  20% after $500 in verified earnings and 30% after $2,500. The cookie lasts
  60 days on any Pinin page and the most recent click wins. Payouts go to a
  bank account through Stripe, and applications are reviewed by hand, usually
  within 2 business days.

short_description: "AI photo restoration and colorization for old and damaged photos"

