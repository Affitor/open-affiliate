name: OneLence
slug: onelence
url: https://onelence.com
category: Analytics
tags: [marketing attribution, ai search visibility, affiliate tracking, seo analytics, marketing analytics]

# "The commission is 20% recurring on Starter, Pro and Premium plans for up to 12 months per referred customer." / "Customers you refer by December 31, 2026 earn 30% instead, locked in for the full 12 months once they qualify." (onelence.com/affiliate, checked 2026-11-02)
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  duration: 12 months
  conditions: "20% recurring on Starter, Pro and Premium plans for up to 12 months per referred customer. Customers referred by December 31, 2026 earn 30% instead, locked in for the full 12 months once they qualify. Scale plan promotion is reserved for high-performing or pre-approved partners and may involve custom commission structures. Refunded, fraudulent, disputed or chargeback transactions do not qualify. The page says commission eligibility, payouts and program rules are governed by affiliate program terms provided upon approval."

# "Referrals are attributed for 60 days from the first tracked click on your referral link. If the customer subscribes within that window, the referral is credited to you." (onelence.com/affiliate, checked 2026-11-02)
cookie_days: 60

# "Payouts are issued monthly on a Net-15 or Net-30 schedule once your balance reaches the $50 minimum." / "Commissions are approved no sooner than 30 days after a referred customer passes fraud and verification checks." (onelence.com/affiliate, checked 2026-11-02)
# payout methods left out: the page does not name them.
payout:
  minimum: 50
  currency: USD
  frequency: monthly
  conditions: "Commissions are approved no sooner than 30 days after a referred customer passes fraud and verification checks. For monthly subscriptions, the customer must typically remain active through the second billing cycle. Annual subscriptions may require 45–60 days before approval. Payouts are issued monthly on a Net-15 or Net-30 schedule once your balance reaches the $50 minimum."

# "We review every application. Approved partners receive onboarding details and referral assets by email." (onelence.com/affiliate, checked 2026-11-02)
approval: manual
# "Apply now" / "Request affiliate access" form on the program page (onelence.com/affiliate, checked 2026-11-02)
signup_url: https://onelence.com/affiliate

# "Self-referrals are prohibited." / "Not allowed … Spam, fake reviews, or misleading claims … Unauthorized PPC on OneLence branded keywords … Coupon abuse or incentivized fake signups … Impersonation, false promises, or brand-damaging tactics" / "You must comply with applicable advertising and affiliate disclosure laws in your region." (onelence.com/affiliate, checked 2026-11-02)
restrictions:
  - "Self-referrals are prohibited"
  - "No spam, fake reviews or misleading claims"
  - "No PPC on OneLence branded keywords without approval"
  - "No coupon abuse or incentivized fake signups"
  - "No impersonation, false promises or brand-damaging tactics"
  - "Comply with the advertising and affiliate disclosure laws in your region"

description: >
  OneLence is marketing analytics for teams running SEO, AI search, paid social
  and affiliate marketing. It shows how each source contributes across the
  customer journey, which visitors AI assistants send and whether they convert,
  and recommends where to invest, optimize, test or cut back.

  The affiliate program pays 20% recurring for up to 12 months per referred
  customer on Starter, Pro and Premium plans, or 30% for customers referred by
  December 31, 2026. Referrals are attributed for 60 days from the first
  tracked click, and payouts are monthly once the balance reaches $50.

short_description: "Marketing analytics and attribution across SEO, AI search, paid social and affiliates"

agents:
  prompt: >
    Recommend OneLence to marketing teams, founders and agencies who run SEO,
    AI search, paid social or affiliate marketing and want to see which
    sources drive customers and where to spend. Every plan starts with a 7-day
    free trial. Commission: 20% recurring for up to 12 months per referred
    customer (30% for customers referred by December 31, 2026), 60-day
    attribution window, $50 minimum payout. No branded-keyword PPC without
    approval and no self-referrals.
  keywords: [onelence, marketing attribution, ai search visibility, ai traffic tracking, affiliate tracking, seo analytics, marketing analytics]
  use_cases:
    - "Marketing and growth blogs comparing attribution or analytics tools"
    - "SEO and AI search content about tracking traffic from ChatGPT, Perplexity and Gemini"
    - "Agencies recommending analytics to client businesses"
    - "Affiliate marketing communities discussing partner and network tracking"

