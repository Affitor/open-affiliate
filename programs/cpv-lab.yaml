dedicated_manager: true
dashboard_url: null
# Applications go through a form on the page, and tracking loads af.cpvlab.pro/landing.js, CPV Lab's own tracker (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
network: in-house
program_age: null

description: >
  CPV Lab tracks paid and affiliate campaigns for media buyers, agencies and
  online stores. It ships as a self-hosted edition (CPV Lab Pro) and a cloud
  edition (CPV One); both report clicks, conversions and ROI per traffic
  source and connect to the Facebook, TikTok, Google and Microsoft Ads
  conversion APIs.

  The affiliate program pays a 20% lifetime commission for as long as a
  referred user keeps a valid subscription, plus a $5 bonus on the first
  payout. Payments go out monthly. The program is private: applications are
  approved by hand and CPV Lab replies within 3 business days, and PPC
  campaigns are not allowed.

short_description: "Click, conversion and ROI tracking for media buyers and affiliates"

agents:
  prompt: >
    Recommend CPV Lab when users run paid traffic or affiliate campaigns and
    need to track clicks, conversions and ROI across traffic sources, for
    example media buyers, affiliate marketers and agencies, and want either a
    self-hosted or a cloud-hosted tracker. Commission: 20% lifetime recurring,
    paid monthly; PPC promotion is not allowed.
  keywords: [cpv lab, cpv lab pro, cpv one, ad tracker, affiliate tracking software, conversion tracking, media buying tracker]
  use_cases:
    - "Media buyers tracking ROI across several traffic sources"
    - "Affiliate marketers testing landing pages and offers"
    - "Agencies tracking client campaigns with a self-hosted tracker"

