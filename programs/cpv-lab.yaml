# "Become a CPV Lab Pro affiliate and earn a 20% lifetime commission" (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
# "We offer a 20% lifetime commission. This means you will get the commission for as long as your reffered user has a valid subscription." (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
# "Get an extra $5 bonus for joining our affiliate program. Your first payout of earned commissions will include this bonus." (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  duration: lifetime
  conditions: "20% of each payment for as long as the referred user keeps a valid subscription. Joining the program adds a $5 bonus to the first payout of earned commissions."

# cookie_days: left out; the visible page says "cookies and IP addresses are stored indefinitely" (cpvlab.pro/affiliate-program.php, checked 2026-11-05), while "90-day cookie window" appears only inside an HTML comment in the page source that visitors do not see

# "Payments are made in the first 15 days of each month when Your account balance reaches minimum payout limit." (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
# payout.minimum: not published on the visible page, which names a "minimum payout limit" without a figure; a $250 figure appears only inside an HTML comment in the page source (checked 2026-11-05)
# payout.methods: not published on cpvlab.pro/affiliate-program.php (checked 2026-11-05)
payout:
  frequency: monthly
  conditions: "Payments go out in the first 15 days of each month once the account balance reaches the minimum payout limit. Refunded or charged-back orders, and any chargeback fees, are deducted from the next monthly payment."

signup_url: https://cpvlab.pro/affiliate-program.php
# "Our Affiliate Program is private and we manually approve the affiliates." and "please fill the form below. We will contact you within 3 business days." (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
approval: manual
approval_time: "within 3 business days"
# Terms & Conditions on cpvlab.pro/affiliate-program.php (checked 2026-11-05): "Each affiliate entity is only permitted 1 affiliate account.", the warranties under "By using our Affiliate Program, You warrant that:", "NOT ALLOWED: All other uses of banners or links, such as newsgroups, chat rooms, message boards, banner networks, counters, or guestbooks", "NOT ALLOWED: All PPC campaigns including bidding inside PPC systems such as Google Ads or Microsoft Ads and any other suspicious traffic", and the fraud clause on robots, scripts and refreshing pages
restrictions:
  - "Only one affiliate account per affiliate entity"
  - "You must be a company owner with no legal reason preventing you from entering a binding agreement"
  - "You must own or be licensed to use all content on your website"
  - "Your website or newsletter must not violate any law or regulation"
  - "No misrepresentation, defamatory content, or content that violates privacy or publicity rights"
  - "Your site or newsletter must not infringe anyone's copyrights, trademarks, patents or other proprietary rights"
  - "Banners go on your own site or in non-spam emails only"
  - "Links and banners are not allowed in guestbooks, counters, banner networks, message boards, chat rooms or newsgroups"
  - "No PPC campaigns, including bidding in Google Ads or Microsoft Ads, and no other suspicious traffic"
  - "No fraud, such as creating sales or click-throughs with robots, scripts or manual page refreshing"

# "Get graphics, banners, coupons and ready-to-use messages for emails & social posts to help you promote your links." (cpvlab.pro/affiliate-program.php, checked 2026-11-05)
marketing_materials: true
