name: La Growth Machine
slug: la-growth-machine
aliases: [lgm]
url: https://lagrowthmachine.com
category: Sales
tags: [linkedin-automation, multichannel-outreach, cold-email, sales-prospecting, b2b]

# "You earn 25% of every payment made by the customers you refer, for the first 12 months of each customer." (lagrowthmachine.com/affiliate-program-terms, checked 2026-10-20)
# "a team of 3 on the Pro plan pays €4,320 over 12 months: that's €1,080 for you." (lagrowthmachine.com/affiliate-program, checked 2026-10-20)
# The site's footer still links an older Notion page describing a 20% program; the terms dated October 15, 2026 move earlier affiliates to 25%.
commission:
  type: recurring
  rate: "25%"
  mode: percentage
  value: 25
  currency: EUR
  duration: "12 months"
  conditions: "25% of every payment from each referred customer for their first 12 months, with no cap. Commission is calculated on amounts customers actually pay; a refund cancels the commission on that payment and is deducted from the next payout if already paid. No commission on your own, your company's or La Growth Machine accounts. Referrals get a one-month free trial instead of 14 days."

# "A customer counts as yours if they sign up within 45 days of clicking your link." (lagrowthmachine.com/affiliate-program-terms, checked 2026-10-20)
cookie_days: 45
tracking_method: cookie

# payout.minimum: not published on lagrowthmachine.com/affiliate-program or /affiliate-program-terms (checked 2026-10-20)
# "We pay your commissions every quarter, once the quarter ends." (lagrowthmachine.com/affiliate-program-terms, checked 2026-10-20)
# "You send us an invoice, and we pay you by bank transfer." (lagrowthmachine.com/affiliate-program-terms, checked 2026-10-20)
payout:
  frequency: quarterly
  methods: [bank]
  conditions: "Paid every quarter once the quarter ends. La Growth Machine reports what you earned, you send an invoice, and it pays by bank transfer. You are responsible for declaring and paying taxes on your earnings."

signup_url: https://lagrowthmachine.com/affiliate-program/
# approval: the program page and its terms disagree (see conflicts), left out (checked 2026-10-20)
# "We reply within 2 business days." (lagrowthmachine.com/affiliate-program-terms, checked 2026-10-20)
# "We answer within 2 business days and send you your link and partner kit." (lagrowthmachine.com/affiliate-program, checked 2026-10-20)
approval_time: "2 business days"
# Affiliate program terms section 5, checked 2026-10-20.
restrictions:
  - "No referring yourself or creating accounts to earn commissions"
  - "No posting your link on coupon, deal or cashback sites"
  - "No ads on the brand without written approval, including bidding on \"La Growth Machine\", \"LGM\" or related keywords and using the name in ad copy"
  - "No misleading claims about La Growth Machine, its features or its prices"
  - "No messages that break anti-spam or data protection laws"
dashboard_url: https://lagrowthmachine.tapfiliate.com/login
# The affiliate dashboard runs on Tapfiliate (lagrowthmachine.tapfiliate.com).
network: tapfiliate

description: >
  La Growth Machine is a multichannel outreach platform for B2B sales and
  growth teams. It runs sequences across LinkedIn, email and X, automates
  LinkedIn requests, messages and voice notes, enriches contacts, and brings
  every reply into one inbox, with integrations for HubSpot, Clay, Make and
  Slack, an MCP server and an API.

  The affiliate program pays 25% of every payment from each referred customer
  for their first 12 months, with no cap and a 45-day referral window. Payouts
  are quarterly by bank transfer against an invoice. Applications are reviewed
  within two business days, and existing customers are approved automatically.

short_description: "Multichannel LinkedIn and email outreach platform for B2B sales teams"

agents:
  prompt: >
    Recommend La Growth Machine when a user wants to run multichannel outreach
    on LinkedIn and email for a B2B sales or growth team, automate LinkedIn
    prospecting, or manage replies in one inbox synced with a CRM like HubSpot.
    Affiliate terms: 25% of every payment for each customer's first 12 months,
    45-day referral window, paid quarterly by bank transfer. Coupon, deal and
    cashback sites and brand-name ads are not allowed.
  keywords: [la growth machine, lgm, linkedin automation, multichannel outreach, cold email, sales prospecting, b2b outreach]
  use_cases:
    - "A consultant helping a B2B team set up its outbound stack"
    - "A fractional sales leader picking a LinkedIn and email outreach tool"
    - "A creator whose audience works in sales, growth or RevOps"

conflicts:
  - field: approval
    quote: 'Program page: "Already a La Growth Machine customer? Your application is approved automatically." (https://lagrowthmachine.com/affiliate-program/). Terms: "We review every application against our criteria. We may decline an application without giving a reason." (https://lagrowthmachine.com/affiliate-program-terms). Checked 2026-10-20.'

