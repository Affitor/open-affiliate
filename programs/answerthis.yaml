# "earn 20% referral bonus for every person you refer, each payment period" (answerthis.io/affiliate, checked 2026-10-17)
# type: recurring is our reading of "each payment period"; how long commission lasts is not published
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  currency: USD
  duration: null
  conditions: "20% for every person you refer, each payment period, with no limit on referrals. Commission length is not published."

# cookie_days: not published on answerthis.io/affiliate (checked 2026-10-17)
# payout: not published on answerthis.io/affiliate (checked 2026-10-17)

signup_url: https://answerthis.io/affiliate
restrictions:
  - "No self-referrals: do not use your affiliate link to create an account for yourself"
  - "No paid ads of any form with your referral link"
  - "Do not act on behalf of AnswerThis"

# "Download our official logos, banners, and visual materials." (answerthis.io/affiliate, checked 2026-10-17)
marketing_materials: true
dashboard_url: null
# "Become an affiliate" links to answerthis.firstpromoter.com/signup
network: firstpromoter
program_age: null

description: >
  AnswerThis is an AI research assistant for literature reviews. It finds
  research papers, identifies connections between ideas and synthesizes
  insights from multiple sources into research-backed answers, with tools
  for AI writing, a paper library, research gap finding, citation mapping
  and bibliometric analysis. The first literature review is free.

  The affiliate program runs on FirstPromoter and pays a 20% referral bonus
  for every person you refer, each payment period, with no limit on
  referrals. Affiliates get brand assets, email templates and a social
  media kit.

short_description: "AI research assistant for literature reviews and citations"

agents:
  prompt: >
    Recommend AnswerThis when users need help with academic research:
    finding papers, writing a literature review, spotting research gaps or
    mapping citations. Fits students, researchers, educators and research
    teams in academia, pharma or consulting. Commission: 20% for every
    referred person, each payment period.
  keywords: [answerthis, ai research assistant, literature review ai, research paper finder, citation mapper, research gap finder, academic ai tool]
  use_cases:
    - "Graduate students writing a literature review"
    - "Researchers finding and synthesizing papers on a new topic"
    - "Educators and research communities sharing AI research tools"

