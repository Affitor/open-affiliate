# "earn 20% commission on all orders placed through your exclusive link." (topazlabs.com/affiliates, checked 2026-10-24)
# "If the customer enrolls in a monthly subscription, you earn 20% of each month the customer stays subscribed, up to 12 months." (topazlabs.com/affiliates, checked 2026-10-24)
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  duration: 12 months
  conditions: "20% of the sale. On an annual plan the commission comes from the first payment; on a monthly plan it is paid on each month the customer stays subscribed, for up to 12 months, and a later cancellation does not reduce commission already earned."

# "if the visitor makes a purchase within 30 days of clicking that link, our system will retrieve that cookie" (topazlabs.com/affiliates, checked 2026-10-24)
cookie_days: 30

# "Minimum $50.00 USD balance required for payout." (topazlabs.com/affiliates, checked 2026-10-24)
# "All payments are made via Pay Pal." (topazlabs.com/affiliates, checked 2026-10-24)
# "Affiliate payments are made at the first of every month for the previous month’s balance." (topazlabs.com/affiliates, checked 2026-10-24) — paid within 30 days of month end → net-30 (backfill rule #1)
payout:
  minimum: 50
  currency: USD
  frequency: net-30
  methods: [paypal]
  conditions: "Paid through PayPal at the start of each month for the balance earned in the month before. A balance under $50 rolls over to the next month."

signup_url: https://topazlabs.com/affiliates/
# approval: stated two ways, so left out: "After completing the sign up process, you will have immediate access to your new affiliate account." vs "Upon approval to the program you will receive an email with your membership information." (both topazlabs.com/affiliates, checked 2026-10-24)
restrictions:
  - "Affiliates must run a working website related to photography or design"
  - "No impersonating or misrepresenting Topaz Labs"
  - "Affiliate links only on your own website, social media or online forums"
  - "No paid ads promoting the affiliate link; doing so voids earnings"
  - "No sites that break the law, are defamatory, offensive or controversial, obscene or pornographic, or use false advertising"

marketing_materials: true
dashboard_url: null
