description: >
  Topaz Labs makes AI software that enhances photos and video: Topaz Photo
  for denoising, sharpening and restoring images, Topaz Gigapixel for
  upscaling images, and Topaz Video for upscaling and enhancing footage,
  available as desktop apps and cloud tools.

  The affiliate program is run on Topaz's own site and pays 20% of sales
  made through an affiliate link, for up to 12 months on monthly
  subscriptions, with a 30-day cookie. Commissions are paid monthly through
  PayPal once the balance reaches $50, and promoting the link with paid ads
  is not allowed.

short_description: "AI software that upscales, denoises and sharpens photos and video"

agents:
