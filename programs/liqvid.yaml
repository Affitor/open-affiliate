description: >
  Liqvid is a cloud digital signage platform for putting and managing
  content on TVs and screens. It works with Xiaomi, Amazon Fire,
  Chromecast and Android TV devices.

  Its affiliate program, for owners of blogs, high-traffic websites and
  popular social media pages, pays from 20% lifetime commission on every new
  client you refer who signs up, each time they make a purchase,
  with no cap on earnings. Liqvid also runs a separate reseller program and
  a "Bring a friend" referral that gives both sides up to 2 months of free
  usage.

