# "Earn recurring account credits every time someone you refer becomes a paying Uscreen customer." (uscreen.tv/customer-referral-program/, checked 2026-10-31)
# rate table: Starter or Growth "$20/month", max "$240 (12 months)"; Custom "$100/month", max "$1,200 (12 months)" (uscreen.tv/customer-referral-program/, checked 2026-10-31)
# "Credits are capped at 12 months per referral." (uscreen.tv/customer-referral-program/, checked 2026-10-31)
commission:
  type: recurring
  rate: "$20 to $100 per month in account credits"
  mode: flat
  value: 100
  currency: USD
  duration: 12 months
  conditions: "Uscreen account credit, not cash, applied automatically to your next Uscreen invoice. You earn $20 a month (up to $240) for each referral on a Starter or Growth plan, or $100 a month (up to $1,200) for each referral on a custom plan, for at most 12 months per referral. Starter and Growth credits begin about one month after the referred customer's first full payment. Credits stop if the referral cancels; credits already applied stay yours. Only active paid Uscreen customers who use Stripe as their primary payment provider can refer."

# cookie_days: not published on uscreen.tv/customer-referral-program/ (checked 2026-10-31)
# payout: none; rewards are account credits applied to the referrer's Uscreen invoice, "No quarterly payout cycles or PayPal required." (uscreen.tv/customer-referral-program/, checked 2026-10-31)

