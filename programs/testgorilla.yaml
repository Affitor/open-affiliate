# "Earn 10% commission for the first year of every new customer!" (market.partnerstack.com/page/testgorilla, checked 2026-10-17)
# "calculated based on the initial Annual Contract Value (ACV) of the customer’s first subscription agreement" (testgorilla.com/partnerships-momentum-terms, checked 2026-10-17)
# type: one-time is our reading of the terms: commission is worked out on the first contract's ACV, and renewals and upsells are excluded
commission:
  type: one-time
  rate: "10%"
  mode: percentage
  value: 10
  currency: USD
  duration: "12 months"
  conditions: "10% for the first year of every new customer, calculated on the initial Annual Contract Value of the customer's first subscription. Upgrades, expansions, seat additions, renewals and upsells after the first contract are excluded. No commission on refunds, chargebacks, or customers who do not stay in good standing during the first year of their contract. Partners with higher referred sales may qualify for higher rates under a tiered structure."

# cookie_days: not published on market.partnerstack.com/page/testgorilla or testgorilla.com/partnerships-momentum-terms (checked 2026-10-17)
# payout.minimum: not published on testgorilla.com/partnerships-momentum-terms (checked 2026-10-17)
# "Commissions are paid monthly." (testgorilla.com/partnerships-momentum-terms, checked 2026-10-17)
# methods: "via the payment methods supported through PartnerStack" (testgorilla.com/partnerships-momentum-terms, checked 2026-10-17)
payout:
  frequency: monthly

signup_url: https://market.partnerstack.com/page/testgorilla
# "Acceptance into the Program is subject to manual review and approval by TestGorilla’s partner team." (testgorilla.com/partnerships-momentum-terms, checked 2026-10-17)
approval: manual

# "Access to sales and learning materials" (testgorilla.com/partnerships-momentum-terms, checked 2026-10-17)
