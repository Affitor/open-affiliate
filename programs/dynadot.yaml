description: >
  Dynadot is a domain registrar for registering, transferring and managing
  domain names across a wide range of TLDs. It also runs a domain
  aftermarket with expired and backorder auctions, plus a website builder,
  email hosting and SSL certificates.

  The in-house Ambassador Program pays 30% on domain registrations and
  transfers from new customers, 15% on auction sales and a flat $10 for
  Website Builder Pro and Email Pro. Tracking and payouts run inside your
  Dynadot account. Dynadot also has a separate CJ Affiliate program at 25%,
  and you can join only one of the two.

