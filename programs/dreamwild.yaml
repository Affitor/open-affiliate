  - "No paid advertising or paid traffic without written approval"
  - "No bidding on or using DreamWild trademarks as keywords or in ads"
  - "No coupon, cashback, deal or voucher sites"
  - "No buying through your own link"

# "They type one idea and DreamWild makes the finished video: narrated, captioned, Short or long-form, and uploaded to YouTube if they want." (dreamwild.ai/creators/, checked 2026-11-06)
# "Free to join · No approval wait · No follower minimum" (same page)
