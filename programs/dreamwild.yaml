# "3.1 Who can join. You can join if you are at least 18 and can make a binding contract" (dreamwild.ai/affiliate-terms, checked 2026-11-06)
# "(a) use Paid Advertising to promote your Link or DreamWild, or send paid traffic to dreamwild.ai, unless we have approved it in writing; (b) bid on, buy or use our Marks as keywords" (same page, clause 8.2)
# "(e) post your Link on a coupon, cashback, deal or voucher site, a deal aggregator or a coupon browser extension" (same page, clause 8.2)
# "(n) buy through your own Link, or have someone buy for you, to earn Commission" (same page, clause 8.2)
