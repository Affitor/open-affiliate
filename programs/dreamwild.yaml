# "5.1 Rate. We pay you Commission of 35% of the Net Revenue from each Qualifying Purchase, increasing to 40% once you qualify under clause 5.10." (dreamwild.ai/affiliate-terms, Version DW-AFFILIATE-2026-11-07b, checked 2026-11-06)
# "You stay an Active Creator by having at least one Genuine Click on your Link in every 12 months." / "A Qualifying Purchase does not include ... a payment under a custom, enterprise or separately negotiated agreement." (same page)
# "Once 10 paying customers' first payments clear their 30-day hold without a refund or chargeback, every later payment pays you 40%, including from customers you brought in earlier." (dreamwild.ai/creators/, checked 2026-11-06)
# "Commission accrues in the currency of each sale." (dreamwild.ai/affiliate-terms, clause 7.2): commission currency left out.
commission:
  type: recurring
  rate: "35%"
  mode: percentage
  value: 35
  duration: lifetime
  conditions: "35% of net revenue on every plan payment (first payment, renewals and upgrades) and extra-credit purchase, excluding tax, refunds and disputes, for life while the creator stays active and in good standing (at least one genuine click on the link every 12 months). The rate rises to 40% on every later payment, including from customers referred earlier, once 10 referred customers' first payments clear their 30-day hold with no refund or chargeback. Only customers who have never paid before count; custom or enterprise agreements are excluded. Refunded or disputed payments are clawed back."

# "The last creator link a buyer opened in the 90 days before they pay gets the credit (90-day last-click attribution)." (dreamwild.ai/affiliate-terms, checked 2026-11-06)
cookie_days: 90
# "When someone opens your Link, we record your handle and the time of the click in a first-party cookie on their device or, where they have not yet accepted cookies, in the link's page address." (dreamwild.ai/affiliate-terms, clause 4.3)
tracking_method: cookie

# "We pay monthly by PayPal, Wise or USDT once your available balance reaches US$10. Smaller balances roll into the next month." (dreamwild.ai/affiliate-terms, checked 2026-11-06)
# "On payout day we convert it to US dollars" / "We pay USDT at 1 USDT for each US$1." / "Hold Period means the 30 days after the date of each payment by a Referred Customer." (same page)
payout:
  minimum: 10
  currency: USD
  frequency: monthly
  methods: [paypal, wise, crypto]
  conditions: "Each referred payment is held for 30 days before its commission becomes available. Balances under US$10 roll into the next month. Commission is converted to US dollars on payout day; USDT is paid at 1 USDT for each US$1."

# "3.3 Your Link is live straight away. When you accept the Program Terms, we issue your Link at once, with no approval wait and no follower minimum." (dreamwild.ai/affiliate-terms, checked 2026-11-06)
approval: auto
signup_url: https://dreamwild.ai/creators/
# "Operator: Genesis Vanguard Pty Ltd ... trading as DreamWild Labs" / "Link means your link in the form dreamwild.ai/s/your-handle" / first-party cookie (clause 4.3) (dreamwild.ai/affiliate-terms, checked 2026-11-06)
