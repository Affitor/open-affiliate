description: >
  Wapio is a WhatsApp REST API for developers, agencies and SaaS teams. It
  connects a number by QR code and sends messages through the API and
  webhooks, with plans from $6 per month and no Wapio per-message markup.
  New users get a three-day trial without a credit card.

  The affiliate program pays 30% of eligible collected subscription revenue,
  including renewals, for as long as the referred customer stays subscribed.
  A referred visitor has 90 days after following the link to sign up.
  Applications are reviewed manually, and approved affiliates get a tracked
  link and a dashboard. Refunds and chargebacks reverse the commission.

