commission:
  type: recurring
  # "Earn 30% Monthly Recurring Commission" (clickfunnels.com/affiliate-program, checked 2026-10-13)
  rate: "30%"
  mode: percentage
  value: 30
  currency: USD
  # "get 30% recurring commission each month the person continues their ClickFunnels membership" (clickfunnels.com/affiliate-program, checked 2026-10-18)
  duration: lifetime
  conditions: "Paid each month the referred account stays active, on all ClickFunnels plans, monthly or annual, as long as the account remains in good status for 45 days after the sale. Paid on the 1st and 15th of each month. Commissions under $100 in a 120-day period are forfeited."

# cookie window: not published on clickfunnels.com/affiliate-program or clickfunnels.com/affiliate-agreement (checked 2026-10-13)

# "Your combined Commissions must equal or exceed One Hundred and 00/100 Dollars ($100.00) (USD) before You receive a payment" (clickfunnels.com/affiliate-agreement, checked 2026-10-13)
# "Provided that the Sold Account (as defined below) remains in good status within forty-five (45) days from the Sale, You will be paid a commission for each Sold Account that generates a payment to ClickFunnels in a month (“Commission”). Except as otherwise provided herein, Commission payments will be paid on the 1st and 15th of each month following ClickFunnels’ receipt of payment for a Sold Account, subject to the other terms of this Agreement." (www.clickfunnels.com/affiliate-agreement, checked 2026-10-19) — 45 days after the sale → net-60 (backfill rule #1)
payout:
  minimum: 100
  currency: USD
  # "Commission payments will be paid on the 1st and 15th of each month following ClickFunnels’ receipt of payment for a Sold Account" (https://www.clickfunnels.com/affiliate-agreement, checked 2026-10-18)
  frequency: net-60
  conditions: "Provided that the Sold Account (as defined below) remains in good status within forty-five (45) days from the Sale, You will be paid a commission for each Sold Account that generates a payment to ClickFunnels in a month (“Commission”). Except as otherwise provided herein, Commission payments will be paid on the 1st and 15th of each month following ClickFunnels’ receipt of payment for a Sold Account, subject to the other terms of this Agreement."

# "If Your application to become an Affiliate is approved by ClickFunnels, You will receive a unique Affiliate ID." (https://www.clickfunnels.com/affiliate-agreement, checked 2026-10-18)
approval: manual
signup_url: https://www.clickfunnels.com/affiliate-program
restrictions:
  - "No bidding on ClickFunnels trademarks or brand names in paid search"
  - "No direct linking to a ClickFunnels sales page from paid ads"
  - "No commission on your own account; no cash rebates to referrals"

marketing_materials: true
dashboard_url: null
