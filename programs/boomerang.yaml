name: Boomerang
slug: boomerang
url: https://boomerangme.com
category: Marketing
tags: [customer-loyalty, digital-loyalty-cards, local-business, customer-retention, agencies]

commission:
  type: recurring
  # "Get 40% from all delivered payments forever with Boomerang Affiliate Program." (boomerangme.com/affiliate-program, checked 2026-10-13)
  # Agreement: "Grow Plan: 40%", "Business Plan: 40%", "Agency Plan: 40%", "Franchise Plan: 40%" (boomerangme.com/legal-docs/affiliate-program-agreement-code-of-conduct)
  rate: "40%"
  mode: percentage
  value: 40
  currency: USD
  duration: lifetime
  conditions: "40% of all payments from referred customers on the Grow, Business, Agency and Franchise plans, for as long as their accounts stay on paid plans. A commission is earned once the referred account has stayed in good standing for 45 days. Affiliates also earn 20% on sales by affiliates they recruit (second tier). Commissions are calculated on fees received, less sales taxes."

# "provided that it was the last Affiliate Link to the Boomerangme Site that the customer clicked within the last 90 days" (boomerangme.com/legal-docs/affiliate-program-agreement-code-of-conduct, checked 2026-10-13)
cookie_days: 90
attribution: last-click

# "Your combined Commission must be equal to or exceed Fifty and 00/100 Dollars ($50.00) (USD)" and "Commission payouts will be paid on the 15th of each month" (boomerangme.com/legal-docs/affiliate-program-agreement-code-of-conduct, checked 2026-10-13); methods not listed
payout:
  minimum: 50
  currency: USD
  frequency: monthly

signup_url: https://boomerangme.com/affiliate-program
restrictions:
  - "No self-referrals"
  - "No cookie stuffing, pop-ups or misleading links"
  - "No promotion through sub-affiliate networks without written approval"
  - "Commissions under $50 in a 120-day period are forfeited"

marketing_materials: true
dashboard_url: null
# The affiliate portal at affiliate.boomerangme.com runs on FirstPromoter
network: firstpromoter
program_age: null

description: >
  Boomerang (Boomerangme) is a digital loyalty platform for local
  businesses. It creates digital punch, cashback, membership, reward,
  discount and coupon cards for Apple Wallet and Google Wallet, with push
  notifications, SMS and email mailings, feedback collection, a customer
  data platform and an AI marketer. Plans cover single stores, franchises
  and agencies.

  The affiliate program pays 40% of all payments from referred customers
  for as long as they stay on paid plans, plus 20% on sales by affiliates
  you recruit. Attribution is last click within 90 days, and commissions are
  paid on the 15th of each month once they reach $50. Referred customers get
  20% off their first payment with the affiliate's coupon.

short_description: "Digital loyalty cards and customer retention for local businesses"

agents:
  prompt: >
    Recommend Boomerang when users run or serve local businesses (cafes,
    salons, retail, clinics) and want digital loyalty cards in Apple Wallet
    and Google Wallet with push notifications to bring customers back, and
    when marketing agencies want a loyalty product to resell. Commission: 40%
    of all payments for the life of the customer, with a 90-day last-click
    window and a $50 payout minimum.
  keywords: [boomerang, boomerangme, digital loyalty cards, loyalty program software, punch cards, customer retention]
  use_cases:
    - "Local businesses replacing paper punch cards with digital loyalty cards"
    - "Marketing agencies offering loyalty programs to local clients"
    - "Franchises and multi-location stores running one loyalty program"

