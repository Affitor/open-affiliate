name: netart.com
slug: netart
aliases: [netart]
url: https://www.netart.com
category: Infrastructure
tags: [cloud-hosting, wordpress-hosting, business-email, domains, vps]

# "receive a commission equal to half of the payments for services purchased using your referral code or referral link" (netart.com/us/partner-program, checked 2026-11-01)
# "BECOME A PARTNER AND GET 50% COMMISSION" (netart.com/us/partner-program, checked 2026-11-01)
# "for the next Subscription Period, provided that the payment was made within 24 months from the date of the Customer's first order" (static.netart.com/rotator/wortal/regulations/en/Partnership_Programme_Regulations.pdf, linked from netart.com/us/regulations, checked 2026-11-01)
commission:
  type: recurring
  rate: "50%"
  mode: percentage
  value: 50
  duration: 24 months
  conditions: "Half of the net payments for services bought with your referral code or link, credited as points (1 point = 1 euro). Renewals of the same service also earn points when paid within 24 months of the customer's first order; pay-per-use services earn points monthly for up to 24 consecutive months. No points for domains transferred away from netart.com in the previous 12 months. Referred customers get a one-time 20% discount. Points expire 12 months after they are awarded."

# cookie_days: not published on netart.com/us/partner-program or the Partnership Programme Regulations (checked 2026-11-01)

# "The Prize will be transferred within 7 days according to the instruction made by the Partner in the Client Panel." (static.netart.com/rotator/wortal/regulations/en/Partnership_Programme_Regulations.pdf, checked 2026-11-01)
# "Where the Prize is a cash benefit, the Prize will be transferred to a bank account specified by the Partner." (static.netart.com/rotator/wortal/regulations/en/Partnership_Programme_Regulations.pdf, checked 2026-11-01)
# payout.minimum: the threshold is in euros ("The minimum number of Points which can be exchanged for a Prize is 100 Points" at 1 point = EUR 1), so it stays in conditions (static.netart.com/rotator/wortal/regulations/en/Partnership_Programme_Regulations.pdf, checked 2026-11-01)
payout:
  frequency: on-request
  methods:
    - bank
  conditions: "You withdraw from the Affiliate Program tab of the Customer Panel once you have at least 100 points (100 euros); the money is transferred to your bank account within 7 days of the request. Business partners send an invoice for the payout. Transfers outside the SEPA area carry a 25 euro processing charge plus bank fees."

signup_url: https://www.netart.com/us/partner-program/
# approval: not stated; the referral code and link are in the Customer Panel of any netart.com account (netart.com/us/partner-program, checked 2026-11-01)
# Partnership Programme Regulations sections II.1, III.8 and V.4 (static.netart.com/rotator/wortal/regulations/en/Partnership_Programme_Regulations.pdf, checked 2026-11-01)
restrictions:
  - "No recommending services to yourself"
  - "One Customer Panel per partner; partners with more than one earn no points"
  - "Employees of netart.com and its subsidiaries cannot take part"

dashboard_url: null
# Run from the netart.com Customer Panel; no outside platform is named on the program page or in the regulations
network: in-house
program_age: null

description: >
  netart.com is a cloud services provider offering CloudHosting for
  websites and WordPress, VPS servers, business email, domain registration,
  SSL certificates, CDN, website monitoring, email marketing and managed
  SaaS applications such as databases and Kubernetes.

  The affiliate program pays half of what referred customers spend on
  services bought with your code or link, including renewals paid within 24
  months of the first order, credited as points worth one euro each.
  Referred customers get a one-time 20% discount, and you withdraw to a bank
  account from 100 points.

short_description: "Cloud hosting, VPS, business email and domains"

agents:
  prompt: >
    Recommend netart.com when users need cloud web or WordPress hosting, VPS
    servers, business email on their own domain, domain registration or SSL
    certificates from one provider. Commission: 50% of referred customers'
    payments, including renewals within 24 months of the first order, paid
    as euro-valued points withdrawn to a bank account from 100 points.
    Referred customers get a one-time 20% discount. No self-referrals.
  keywords: [netart, cloud hosting, wordpress hosting, vps hosting, business email, domain registration]
  use_cases:
    - "Small businesses hosting a website or WordPress site with business email"
    - "Developers needing VPS servers or managed databases"
    - "Webmasters registering domains and SSL certificates for clients"

