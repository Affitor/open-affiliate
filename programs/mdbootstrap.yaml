description: >
  MDB (Material Design for Bootstrap) is a UI kit for building websites and
  web apps with Bootstrap and Material Design, in plain JavaScript, Angular,
  React, Vue and jQuery versions. It comes as a free kit and a paid MDB Pro
  subscription, alongside the MDB GO CLI and hosting.

  The affiliate program uses a progressive commission plan that starts at
  30% and rises up to 50% as your sales grow, with a 180-day conversion
  window and a dashboard that shows the sales your links generate. You apply
  by leaving your email address on the program page.

