# "Get up to 20% lifetime commission from every user that signs up through your affiliate link" (ranktracker.com/affiliate-program, checked 2026-10-17)
# "You get 20% commission from each affiliate customer you bring us, for as long as they stay subscribed for non-promotional plans." (ranktracker.com/affiliate-program, checked 2026-10-17)
# "You get 10% commission from each affiliate customer you bring us, for as long as they stay subscribed for promotional campaign plans" (ranktracker.com/affiliate-program, checked 2026-10-17)
# the sign-up page lists volume tiers under "Commission (%)" for every Ranktracker plan: "1 - 200" "20.00", "201 - 400" "25.00", "401 - 600" "30.00", "601 +" "35.00" (cc.payproglobal.com/AffiliateSignup/8D99EAEE314245E, linked from www.ranktracker.com/affiliate-program, checked 2026-10-17)
# rate and value: the two pages differ (up to 20% on the affiliate page, tiers up to 35% on the sign-up page), so left out
commission:
  type: recurring
  rate: "varies"
  mode: unknown
  currency: USD
  duration: lifetime
  conditions: "The affiliate page states 20% for as long as a referred customer stays subscribed on non-promotional plans and 10% on promotional campaign plans such as Black Friday and Cyber Monday. The PayPro Global sign-up page lists tiers by number of active subscribers: 20% (1-200), 25% (201-400), 30% (401-600) and 35% (601+). Commission is paid for customers who stay beyond the free trial."

# "If a user doesn’t sign up straight away, you still get commission as long as they subscribe within 90 days." (ranktracker.com/affiliate-program, checked 2026-10-17)
cookie_days: 90

# "Get paid twice a month (as long as you have accrued a minimum of $400 in commission)." (ranktracker.com/affiliate-program, checked 2026-10-17)
# frequency: twice a month, which the frequency enum does not list; methods: not published on ranktracker.com/affiliate-program (checked 2026-10-17)
payout:
  minimum: 400
  currency: USD

signup_url: https://www.ranktracker.com/affiliate-program/
# "There’s no special approval process, so you can join the affiliate program and get started in short time." (ranktracker.com/affiliate-program, checked 2026-10-17)
approval: auto
