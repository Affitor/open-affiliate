# "We pay affiliate commissions on the 15th of every month for the previous month’s commissions." (switchvpn.net/affiliates, checked 2026-11-09); 15 days after month end -> net-30 (backfill rule #1)
# "We pay our affiliate commissions through PayPal & Wire Transfer." (switchvpn.net/affiliates, checked 2026-11-09)
# payout.minimum: stated two ways, so left out: "If your commissions for a given month total below $25, they will rollover to the next month, until they reach $100." (switchvpn.net/affiliates, checked 2026-11-09)
payout:
  currency: USD
  frequency: net-30
  methods: [paypal, bank]
  conditions: "Each month's commissions are paid on the 15th of the following month. The page says a month under $25 rolls over to the next month until the total reaches $100, so the threshold is given as both $25 and $100. PayPal is the default; direct wire transfer is offered once commissions pass $1,000 a month."

