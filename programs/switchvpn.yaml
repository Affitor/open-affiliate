description: >
  SwitchVPN is a VPN service that encrypts your connection and hides your
  IP address, for private browsing, safer public Wi-Fi and streaming
  without regional restrictions. One plan covers up to 6 devices at once,
  with apps for Windows, Mac, Android, iOS and Linux, and the company says
  it keeps no activity logs.

  The affiliate program pays commissions starting at 30% of each sale and
  keeps paying on every renewal for as long as the customer stays.
  Commissions are paid monthly on the 15th for the previous month, by
  PayPal or, above $1,000 a month, by wire transfer.

short_description: "VPN service with encrypted connections and apps for up to 6 devices"

agents:
  prompt: >
