commission:
  type: recurring
  # "You earn 20% of eligible monthly subscription revenue actually received by Hipol" (hipol.co.uk/affiliates/terms, checked 2026-10-20)
  rate: "20%"
  mode: percentage
  value: 20
  currency: GBP
  # "There is no fixed commission end date" (hipol.co.uk/affiliates/terms, checked 2026-10-20)
  duration: lifetime
  conditions: "Paid on monthly subscription payments from new customers, including later renewals, for as long as the referred customer keeps an eligible subscription. The basis is the amount actually paid after discounts, excluding VAT, refunds and chargebacks. Free minutes, trials, one-off minute packages and annual plans do not earn commission. A payout can be requested once at least £25 of commission is available."

