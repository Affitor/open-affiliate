description: >
  Hipol offers private live video, voice and text conversations with fictional
  AI companions for adults 18 and over. Users choose a host, pick or adjust
  its personality, and can let it remember details between visits. The
  service is for non-sexual companionship and entertainment. New users get 10
  free minutes, then choose a monthly plan.

  The affiliate programme pays 20% of eligible monthly subscription payments
  from the customers you refer, including renewals, with no fixed end date. A
  sign-up counts when it happens within 30 days of the click. Commission is
  pending for 30 days, and you can request a payout once £25 is available;
  payouts are reviewed and paid manually by a method agreed with you.

short_description: "Live video, voice and text chats with fictional AI companions, 18+"

