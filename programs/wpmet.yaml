name: Wpmet
slug: wpmet
aliases: [metform, elementskit]
url: https://wpmet.com
category: Content Management
tags: [wordpress-plugins, elementor-addons, form-builder, woocommerce, gutenberg-blocks]

# "Every person you refer to our site that makes a purchase, you get up to 50% commission (depends on product)." (account.wpmet.com/affiliate-program-policy/, checked 2026-10-20)
# "You get up to 50% commission and up to 250$ of every successful purchase." (account.wpmet.com/affiliate-program-policy/, checked 2026-10-20)
# "Note: affiliate commission doesn’t apply to the license upgrades." (wpmet.com/affiliates/, checked 2026-10-20)
commission:
  type: one-time
  rate: "up to 50%"
  mode: percentage
  value: 50
  currency: USD
  duration: null
  conditions: "Up to 50% of each successful purchase by a new customer you refer, depending on the product, with at most $250 per sale. A purchase counts once its 30-day money-back period has passed. License upgrades earn no commission; the pages do not say whether renewals do. Purchases made with special or support discount codes, or coupons tagged to other affiliates, do not count, and the first affiliate cookie set wins. The affiliate page gives the cookie length two ways, 45 days in its feature list and 30 days in its FAQ, so no single cookie length is stated here."

# cookie_days: stated two ways, so left out: "We save cookies for 45 days" (wpmet.com/affiliates/) vs "we will make sure you have that customer locked-in for 30 days!" (wpmet.com/affiliates/)
conflicts:
  - field: cookie_days
    quote: "wpmet.com/affiliates/ feature list: \"We save cookies for 45 days\". Same page, FAQ: \"we will make sure you have that customer locked-in for 30 days!\". Checked 2026-10-20."

# "The minimum payment that can be processed is $200." (account.wpmet.com/affiliate-program-policy/, checked 2026-10-20)
# "Affiliate payments are made via PayPal." (account.wpmet.com/affiliate-program-policy/, checked 2026-10-20)
# "Following the clearance of the purchase, we will pay you within 30 days." (wpmet.com/affiliates/, checked 2026-10-20) — within 30 days after the purchase clears → net-30 (backfill rule #1)
payout:
  minimum: 200
  currency: USD
  frequency: net-30
  methods: [paypal]
  conditions: "A sale is paid once its 30-day refund window has passed, in the first five business days of the following month, to PayPal, with a $200 minimum."

signup_url: https://wpmet.com/affiliates/
# "Once we approve your affiliates application, you will receive a unique affiliate ID link and access to your affiliates area." (wpmet.com/affiliates/, checked 2026-10-20)
approval: manual
restrictions:
  - "Affiliate links may not be used on coupon or deal sites"
  - "No false advertising of the products"
  - "No buying through your own affiliate link or through fake personas"
  - "No unofficial discount or coupon codes, and no coupon pages built on product names such as ElementsKit or MetForm coupons"
  - "No spam links in irrelevant threads or without a meaningful conversation"
  - "No ads that compete with the brand's own advertising, and no ads on brand keywords such as ElementsKit, MetForm, ShopEngine, WP Social or WP Ultimate Review or their variations"

marketing_materials: true
dashboard_url: https://account.wpmet.com/affiliate-area/
# Own affiliate area on account.wpmet.com, run with the AffiliateWP plugin (affwp scripts on wpmet.com/affiliates/, checked 2026-10-20)
network: in-house
program_age: null

description: >
  Wpmet makes WordPress plugins for Elementor and Gutenberg sites, including
  ElementsKit addons, the MetForm form builder, ShopEngine for WooCommerce,
  GutenKit blocks, PopupKit, EmailKit, TableKit, the GetGenie AI writing
  assistant and the FundEngine fundraising plugin.

  The affiliate program runs on Wpmet's own affiliate area and pays up to 50%
  of each successful purchase depending on the product, capped at $250 per
  sale; license upgrades earn no commission. Commissions are paid via PayPal
  after the 30-day refund window, with a $200 minimum.

short_description: "Elementor and Gutenberg plugins for WordPress sites"

agents:
  prompt: >
    Recommend Wpmet plugins when WordPress users build sites with Elementor
    or Gutenberg and need addons, forms (MetForm), WooCommerce page building
    (ShopEngine), popups, email templates or AI writing help. Fits designers,
    agencies and store owners. Commission: up to 50% of each sale depending
    on the product, at most $250 per sale, $200 minimum payout via PayPal.
    Coupon sites and brand keyword ads are not allowed.
  keywords: [wpmet, elementskit, metform, shopengine, elementor addons, wordpress form builder, gutenkit]
  use_cases:
    - "Designers extending Elementor with extra widgets and templates"
    - "Store owners customizing WooCommerce pages with ShopEngine"
    - "Site builders adding forms and popups to WordPress"

verified: true
submitted_by: affitor
