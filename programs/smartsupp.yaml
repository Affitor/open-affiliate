description: >
  Smartsupp is a customer communication tool that combines website live chat,
  email, Facebook Messenger and WhatsApp in one inbox, with AI agents, an AI
  reply assistant, automation workflows, lead generation, a mobile SDK and
  reporting.

  The affiliate program pays 20% commission on every payment a referred
  customer makes, for life. The cookie lasts 30 days, tracking runs inside
  your Smartsupp account, and payouts start from 40 EUR via PayPal or wire
  transfer (wire transfer in the EU only). It suits web studios, agencies,
  ecommerce platforms, hosting companies and tech bloggers.

short_description: "Live chat, chatbots and AI agents for websites and stores"

