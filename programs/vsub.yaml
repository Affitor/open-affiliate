description: >
  Vsub turns a script or a voiceover into an illustrated video. It splits the
  text into scenes, narrates it and draws every frame with a template cloned
  from a video you choose. It also offers an API and an MCP server.

short_description: "AI tool that turns scripts into illustrated videos"

