description: >
  VPN.ac is a VPN service run by a team of security professionals. It
  supports several VPN protocols, including WireGuard, with elliptic curve
  cryptography, AES-GCM and obfuscation, keeps no activity logs and sets no
  speed limit. Apps cover Windows, macOS, iOS and Android, and a SecureProxy
  browser add-on comes with the service.

  The affiliate program pays 30% on every sale and every renewal for the
  whole life of the referred account. Withdrawals go out by PayPal from $50.
  Anyone can join by opening a free account and enabling an affiliate link;
  links may not go into spam, black-hat SEO or low-quality sites, and
  reviews must come from real testing.

short_description: "Privacy-focused VPN service with WireGuard, obfuscation and a SecureProxy add-on"

