description: >
  LogoAI is an AI logo maker and brand identity platform. Type a business name
  and it generates logo designs, then builds a brand kit with colors, fonts,
  social assets, animated logo intros and a website. Its design studio gives
  access to image and video models pre-loaded with the brand kit, and logos
  export as SVG, PNG and PDF.

