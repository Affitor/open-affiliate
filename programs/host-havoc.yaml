description: >
  Host Havoc is a game server hosting provider with Minecraft server
  hosting, servers for games such as Rust, DayZ, Arma 3 and 7 Days to Die,
  plus web hosting, Ryzen VPS hosting and dedicated servers.

  The affiliate program pays a 12% recurring commission on new
  subscriptions you refer, for as long as the service stays active, with no
  caps. Accounts are activated instantly, earnings can be withdrawn from a
  $40 balance via PayPal and are paid within 48 hours, and new affiliates
  get a $5 starting deposit. A special program for content creators asks
  for an active Twitch or YouTube following of 5,000+ followers or
  subscribers and active promotion of the brand.

