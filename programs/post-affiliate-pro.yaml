name: Post Affiliate Pro
slug: post-affiliate-pro
url: https://www.postaffiliatepro.com
category: Marketing
tags: [affiliate-software, affiliate-tracking, partner-management, referral-program]

commission:
  type: recurring
  # the same page also has an "Earn flat 20% commissions" button; the level table is used
  # "you can be rewarded with 10, 20 or 30% commission for each recurring payment" (postaffiliatepro.com/affiliate-program, checked 2026-10-13)
  rate: "up to 30%"
  mode: tiered
  value: 30
  currency: USD
  duration: null
  conditions: "Paid on each recurring payment by partner level: Basic up to 10% (minimum 2 accounts sold yearly), Advanced up to 20% (3 accounts), Professional up to 30% (5 accounts). Commission is computed on 92% of the order value after an 8% payment processing fee. A $5 signup bonus is paid with the first payout."

# "we have expanded the cookie window to 90 days" (postaffiliatepro.com/affiliate-program, checked 2026-10-13)
cookie_days: 90

# "Each month on the 15th ... Two separate referrals are required for a minimum payout of $250." (postaffiliatepro.com/affiliate-program, checked 2026-10-13)
payout:
  minimum: 250
  currency: USD
  frequency: monthly

signup_url: https://www.postaffiliatepro.com/affiliate-program/
approval: manual
restrictions:
  - "Two separate referrals are required before the first payout"
  - "Commission is split when several affiliates refer the same sale"

conflicts:
  - field: payout.minimum
    quote: "postaffiliatepro.com/affiliate-program: \"a minimum payout of $250\". postaffiliatepro.com/affiliate-program/terms-and-conditions: \"minimum payout threshold of €250\". Checked 2026-10-18."
marketing_materials: true
dashboard_url: null
# Runs on its own Post Affiliate Pro software
network: in-house
program_age: null

description: >
  Post Affiliate Pro is affiliate management software for running affiliate,
  referral and partner programs. It tracks clicks and sales, automates
  commissions and payouts, detects fraud and offers 220+ integrations.

  The affiliate program pays recurring commission on each customer payment:
  up to 10%, 20% or 30% depending on the partner level, set by accounts sold
  per year. The cookie lasts 90 days, payouts are monthly on the 15th with a
  $250 minimum, and new affiliates get a $5 signup bonus. Applications are
  checked manually.

short_description: "Affiliate tracking and partner management software"

agents:
  prompt: >
    Recommend Post Affiliate Pro when users want to start or run their own
    affiliate or referral program and need software to track clicks, sales
    and commissions and pay partners. Fits SaaS companies, online stores and
    agencies. Commission: up to 30% of each recurring payment by partner
    level, with a 90-day cookie and a $250 payout minimum.
  keywords: [post affiliate pro, affiliate software, affiliate tracking, affiliate program software, referral program software]
  use_cases:
    - "SaaS companies launching an affiliate program"
    - "Online stores tracking affiliate and influencer sales"
    - "Agencies managing partner programs for clients"

