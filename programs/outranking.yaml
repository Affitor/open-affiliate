description: >
  Outranking is an AI-powered SEO content platform. It helps writers, SEO
  managers and agencies research a topic, build SEO briefs, write first drafts
  with AI, score content against on-page SEO factors in real time and
  automatically optimize for missing keywords. It also clusters large keyword
  sets and plans content strategy with automatic interlinking.

  The affiliate program pays a 25% recurring commission for the lifetime of
  each active customer, including renewals. The cookie lasts 60 days, and
  commissions are calculated at the end of each month and paid via PayPal,
  with a $50 minimum. Bidding on Outranking's brand terms in paid search and
  self-referrals are not allowed.

