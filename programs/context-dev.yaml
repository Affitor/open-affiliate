description: >
  Context.dev is a web data API for AI agents and LLM apps. One API scrapes
  any URL to clean Markdown or HTML, crawls whole sites, searches the live
  web, maps domains, takes screenshots and pulls brand data such as logos,
  colors and fonts, with SDKs for TypeScript, Python, Ruby and Go and a free
  tier.

  The affiliate program runs on Dub and pays 25% of every sale on any paid
  plan a referred customer buys. The program page states the earning period
  both as 3 years and as 1 year, so check the current terms when applying.
  Referred new users get 25% off for 6 months.

