description: >
  vidIQ is a YouTube growth tool with keyword research, an AI coach, daily
  video ideas, an AI thumbnail maker, video performance audits and a browser extension
  that shows video and channel stats on YouTube.

  The affiliate program pays 15% commission at 0-10 sales, 20% at 11-50 and
  25% from 51 sales, calculated on net receipts. The cookie lasts 90 days from
  the last click, and payouts are made in US dollars about 60 days after the
  end of each month by PayPal, electronic funds transfer or check. Higher
  levels add perks such as a custom vidIQ URL and free vidIQ Boost.

short_description: "YouTube growth tool for keyword research, ideas and channel analytics"

