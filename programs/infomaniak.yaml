description: >
  Infomaniak is a Swiss hosting and cloud company. It offers web and WordPress
  hosting, domains, email, the kDrive cloud storage and kSuite collaboration
  tools, public cloud, VPS and Kubernetes, AI services, newsletters, ticketing
  and streaming.

  The affiliate program pays a commission that grows with your cumulative
  earnings, from 25% up to 50%, on all products except domain names, Housing
  and Very High Availability hosting. Commissions are in Swiss francs and are
  paid at the end of each month via PayPal or an Infomaniak prepaid account
  once they reach CHF 50.

short_description: "Swiss web hosting, cloud storage and collaboration tools"

