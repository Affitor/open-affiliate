description: >
  StrongVPN is a personal VPN service with apps for computers and phones
  and support for routers and streaming devices such as Fire TV and Kodi.
  It says it keeps no logs and does not block or throttle traffic,
  torrents included.

  The affiliate program runs on StrongVPN's own portal and advertises
  commissions of up to 200% per sale, with referrals tracked for 30 days
  after the click through cookies plus a fingerprint fallback. Payouts go
  out monthly by PayPal once the balance reaches $100.

short_description: "Personal VPN with a no-logs policy, apps and router support"

