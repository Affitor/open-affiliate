  the first sale to a new customer, at rates set in the affiliate portal.
  Referrals must order within 30 days of the click and stay customers for at
  least 60 days. Payouts are monthly once the balance passes $50, and a key
  account manager assigns your offers, including offers for 8 IONOS markets.

