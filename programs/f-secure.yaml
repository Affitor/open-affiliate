# "benefit from our 30% commission rate. No minimum payout, easy sign-up process" (f-secure.com/en/partners/affiliate-program, checked 2026-11-08)
# commission.type: not published; "Earn up to 30% commission from sales" does not say whether renewals pay, so one-time is the schema's required placeholder (f-secure.com/en/partners/affiliate-program, checked 2026-11-08)
commission:
  type: one-time
  rate: "up to 30%"
  mode: percentage
  value: 30
  duration: null
  conditions: "The affiliate page offers a commission of up to 30% on successful sales of F-Secure's security and privacy products. Commission length and renewal terms are not published on F-Secure's own pages."

# cookie_days: not published on f-secure.com/en/partners/affiliate-program (checked 2026-11-08)

