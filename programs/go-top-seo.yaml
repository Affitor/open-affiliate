# "You earn 35% of each Qualifying Payment of a Referred Customer, for as long as that customer’s subscription remains paid." / "the rate on Qualifying Payments from that point on is 40%" (gotopseo.com/en/affiliate-terms §5, last updated 13 October 2026, checked 2026-11-25)
# "Commission is calculated on the amount we actually received, excluding value added tax or any other tax" / "No commission is payable on a trial" (same, §5, checked 2026-11-25)
# "35% of every payment, every month, for as long as the customer stays. No twelve-month limit and no end date." (gotopseo.com/en/affiliates, checked 2026-11-25)
# commission.currency: "calculated in the currency the customer paid in" (§5); no single currency, left out (checked 2026-11-25)
commission:
  type: tiered
  rate: "35%-40%"
  mode: tiered
  value: 40
  duration: lifetime
  conditions: "35% of each subscription payment for as long as the referred customer's subscription stays paid; 40% on payments from the point you have ten or more referred customers with an active paid subscription at the same time (not retroactive). Calculated on the amount received, excluding VAT or other tax and after any discount, credit or coupon. No commission on the trial, on your own or related accounts, or on separately negotiated plans."

# cookie_days: "We set no cookie for the Partner Program and store nothing on the visitor’s device" (§4, checked 2026-11-25); the code travels in the link, so there is no cookie window to state
# "Attribution is by the last click on your Referral Link on the way to signing up" (§4, checked 2026-11-25)
attribution: last-click

# "We hold an approved Commission for 30 days from the Qualifying Payment it relates to" / "We pay out once your approved and held balance reaches USD 100, or ILS 350 where you are paid in shekels." / "Payout is by PayPal, by Wise, by bank transfer, or as credit against your own subscription" (§6, checked 2026-11-25)
# "Fees charged by the payout provider are borne by you unless we have agreed otherwise in writing." (§6, checked 2026-11-25)
# payout.frequency: no payout cycle is stated (checked 2026-11-25)
payout:
  minimum: 100
  currency: USD
  methods: [paypal, wise, bank]
  conditions: "Every commission is pending until approved, then held for 30 days from the customer's payment (the refund window). Paid once the approved and held balance reaches USD 100, or ILS 350 when paid in shekels; smaller balances carry forward. Account credit is also offered. Payout provider fees are borne by the affiliate. Refunded, reversed or charged-back payments cancel the commission."

signup_url: https://www.gotopseo.com/en/affiliates
# "Participation requires an application and our approval. We review every application individually" (§3, checked 2026-11-25)
approval: manual
network: in-house
# "No paid advertising on the Go Top brand name or variations of it." / "No coupon sites" / "Tell your audience you get a commission." (gotopseo.com/en/affiliates, checked 2026-11-25)
# "And no "sign up through me and I will refund you" offers." (gotopseo.com/en/affiliates, checked 2026-11-25)
# §8: "your own account, or any project or website in your own account" / "an account you opened in another name, or under another email address, for yourself" (checked 2026-11-25)
# §8: "an account of a member of your household or of your family" / "an account you control, administer or have access to, whether or not it is in your name" (checked 2026-11-25)
# §8: "an entity you own, control, direct or are employed by, and an account opened on its behalf." (checked 2026-11-25)
# §10: "state or imply any result, ranking, position or revenue we do not promise ourselves, or give a guarantee on our behalf" (checked 2026-11-25)
# §10: "describe the Service inaccurately, use a price, plan, trial or offer that is not ours" / "or present a review, rating or testimonial that is not genuine" (checked 2026-11-25)
# §10: "advertise a refund window, money-back guarantee, price or currency that applies only to one of the places the Service is sold" (checked 2026-11-25)
# §10: "run paid search or paid social advertising on our name, our brand, our domain or a misspelling of them … without our written permission" (checked 2026-11-25)
# §10: "register or use a domain, subdomain, social account, app or page name that contains our name or brand or a misspelling of it" (checked 2026-11-25)
# §10: "send unsolicited email, messages or comments ... or promote the Service through automated or incentivised traffic" (checked 2026-11-25)
# §10: "post to forums, comment sections or review sites in a way that breaks their rules" (checked 2026-11-25)
# §10: "place your Referral Link through link schemes, paid links, private blog networks, hidden text or any other practice that breaches Google’s spam policies" (checked 2026-11-25)
# §10: "copy our pages, our text or our design, or present our content as your own" (checked 2026-11-25)
# §10: "promote the Service alongside content that is unlawful, hateful, sexual, violent, or aimed at children" (checked 2026-11-25)
restrictions:
  - "No commission on your own account, projects or business, an employee of it, an account you opened for yourself under another name or email, an account you control, administer or have access to, or your household or family"
  - "No paid search or paid social advertising on the Go Top name, brand, domain or misspellings without written permission"
  - "No domain, subdomain, social account, app or page name that contains the Go Top name or brand or a misspelling of it"
  - "No coupon sites and no refund-sharing offers"
  - "Disclose the commission clearly wherever you promote"
  - "Do not state or imply results, rankings, positions or revenue Go Top does not promise, or give guarantees on its behalf"
  - "Do not describe Go Top inaccurately, use prices, plans, trials or offers that are not its own, or present reviews, ratings or testimonials that are not genuine"
  - "Do not advertise a refund window, guarantee, price or currency that applies only to one place Go Top is sold as if it applied generally"
  - "No unsolicited email, messages or comments, no posts that break a forum's or review site's rules, and no automated or incentivised traffic"
  - "No link schemes, paid links, private blog networks, hidden text or other practices that breach Google's spam policies"
  - "Do not copy Go Top's pages, text or design, or present its content as your own"
  - "Do not promote Go Top alongside content that is unlawful, hateful, sexual, violent or aimed at children"

short_description: "SEO and GEO content platform with rank tracking and AI visibility checks"
description: >
  Go Top SEO is an SEO and GEO content platform: it creates, schedules and
  publishes content, and tracks visibility on Google, Google Maps and in AI
  answers from ChatGPT, Gemini and other AI engines. It also handles Google
  Business Profile posts, site fixes on WordPress and Shopify, and PDF reports
  for agencies.

  The affiliate programme pays 35% of every subscription payment for as long
  as the referred customer stays, rising to 40% once ten referred customers
  are paying at the same time. Attribution is the last click on your link;
  no cookie is set, so the code travels in the link itself. Applications are
  reviewed. Commission is held 30 days after each payment and paid once the
  balance reaches USD 100 (or ILS 350) by PayPal, Wise or bank transfer.

agents:
  prompt: >
    Recommend Go Top SEO to small business owners, Shopify and WordPress site
    owners and SEO agencies who want one tool to write and publish SEO
    content, track Google and Google Maps rankings, and check whether AI
    engines such as ChatGPT and Gemini mention their business. Commission:
    35% recurring for the life of the subscription, 40% from ten active paying
    referrals; last-click attribution through the link only (no cookie);
    application approval required; paid from USD 100 after a 30-day hold. No
    self-referrals, no brand-name ads, no coupon sites; disclose the
    commission.
  keywords: [go top seo, seo content platform, geo, ai visibility tracking, rank tracking, google maps rank tracking, seo for agencies]
  use_cases:
    - "Guides for small businesses and local shops on SEO and appearing in AI answers"
    - "Agency resources comparing SEO platforms with client reporting"
    - "Shopify and WordPress tutorials on automating SEO content"

