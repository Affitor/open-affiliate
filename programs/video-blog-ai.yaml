description: >
  Video Blog AI turns ideas, titles, YouTube videos and text into blog
  articles with AI, then helps improve them for search with a content
  editor. It also helps users find a niche and plan a pillar and cluster SEO
  content strategy.

  The affiliate program pays 15% to 25% recurring commission depending on
  the partner level, on every payment for as long as the referral stays
  subscribed. Referred customers get 10% off with the affiliate's coupon
  code, and payouts arrive 60 days after the referral by Stripe bank
  transfer.

short_description: "Turn YouTube videos, ideas and text into SEO blog posts"

