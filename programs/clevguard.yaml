description: >
  ClevGuard makes parental control and monitoring software, including
  KidsGuard Pro (with iOS and iCloud versions), KidsGuard apps for
  WhatsApp, Facebook, Snapchat, TikTok and LINE, and MoniVisor for
  computer monitoring. ClevGuard states its software is intended for legal use
  only.

  The affiliate program advertises up to 40% of each sale, with 30% as
  the default monthly rate and 40% from 100+ sales a month, and a
  30-day cookie. You join through Impact or through an iCart
  application hosted on imyfone.com.

short_description: "Parental control and phone monitoring apps such as KidsGuard Pro"

