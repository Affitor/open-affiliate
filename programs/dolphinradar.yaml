description: >
  DolphinRadar is an all-in-one Instagram tracker and analyzer for marketers
  and individuals. It automatically analyzes publicly available Instagram
  data, with a toolkit that includes a story viewer, hashtag generator,
  shadowban checker, unfollower tracker and follower export. It is not
  affiliated with Instagram.

  The affiliate program runs on Rewardful and pays 30% of what each referred
  paying customer pays in their first 3 months. Anyone can join and get a
  referral link instantly; commissions are paid after a 30-day hold via
  PayPal, Wise or another method.

short_description: "Instagram tracker and analyzer for public account data"

