# "Earn 60% of the first subscription sale for each user you refer." (www.marketingminer.com/en/affiliate, checked 2026-10-20)
commission:
  type: one-time
  rate: "60%"
  mode: percentage
  value: 60
  duration: null
  conditions: "60% of the first subscription sale for each new user you refer. A commission becomes eligible only when the referred user subscribes to a paid plan for the first time within the 100-day cookie period, does not cancel, withdraw or ask for a refund, and the subscription period it is paid on has elapsed. The program is for businesses only, not consumers."

# "Our affiliate cookies are valid for a period of 100 days." (www.marketingminer.com/en/affiliate, checked 2026-10-20)
cookie_days: 100

# "You can request a payout as soon as you reach the minimum threshold of $90." (www.marketingminer.com/en/affiliate, checked 2026-10-20)
# "Eligible Commissions can be paid via PayPal or Wise." (affiliate.marketingminer.com/registrace, linked from www.marketingminer.com/en/affiliate, checked 2026-10-20)
payout:
  minimum: 90
  currency: USD
  frequency: on-request
  methods: [paypal, wise]
  conditions: "Affiliates withdraw by sending an invoice for eligible commission of at least $90 that comes from at least two different new users; the invoice must meet legal requirements and be due in no less than 15 days. Commission must be withdrawn within one year of being earned or it can be written off. Chargeback fees are deducted from earned commission. Payment is by PayPal or Wise."

signup_url: https://www.marketingminer.com/en/affiliate
# "There is no approval process for the sign ups." (www.marketingminer.com/en/affiliate, checked 2026-10-20)
approval: auto
restrictions:
  - "No promotion in violation of the law, including data protection, unfair competition, advertising and consumer protection, and anti-spam rules"
  - "No fraudulent promotion using robots, frames, iframes, scripts or manual page refreshing to create commissions"
  - "No forcing new users to store the referral cookie or setting it fraudulently"
  - "No promotion on websites with illegal content or that violate third-party rights"
  - "No promotion on gambling websites"
  - "No promotion on coupon websites"
  - "No promotion on websites with adult, hate, violent, defamatory or other inappropriate or offensive content"
  - "No Marketing Miner brand, trademarks, logos or other assets, including misspellings, in your domain names"
  - "No Marketing Miner brand, trademarks, logos or other assets, including misspellings, your referral link or direct links to the service in PPC advertising"
  - "No aggressive or harassing advertising practices"
  - "Newsletters only in line with applicable rules and with properly obtained consent"
  - "No sharing your commission with your employees or any third party, including new users"
  - "No modifying or altering promotion materials without prior consent, and no sublicensing them"

marketing_materials: true
dashboard_url: https://affiliate.marketingminer.com
# "Affiliate Program is provided through third party SaaS solution - AffilBox" (affiliate.marketingminer.com/registrace, linked from www.marketingminer.com/en/affiliate, checked 2026-10-20); AffilBox is not in the network enum
network: null
