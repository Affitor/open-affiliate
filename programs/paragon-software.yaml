description: >
  Paragon Software builds tools for hard drive and storage management and
  for data protection, best known for NTFS for Mac and Partition Manager.
  The company is based in Freiburg, Germany.

  The Paragon affiliate program runs on CJ and pays commission in stages
  from 8% to 50%, with each product's own rate listed in the CJ account.
  Joining does not cost anything and carries no obligations. Affiliates get featured
  downloads, promotional materials, exclusive customer discounts and
  coupons, and special bonuses. Payment goes out through CJ on the 20th of
  each month for the previous month, by check or wire transfer, with a 50
  USD minimum.

