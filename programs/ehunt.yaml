name: EHunt
slug: ehunt
aliases: [EtsyHunt]
url: https://ehunt.ai
category: E-Commerce
tags: [etsy, product-research, keyword-research, marketplace-analytics, seo]

# "at least 30% recurring commission for up to 6 months" (ehunt.ai/affiliate, checked 2026-10-20)
commission:
  type: recurring
  rate: "At least 30%"
  mode: percentage
  value: 30
  duration: "Up to 6 months; conditional lifetime extension"
  conditions: "Commission applies to referred users' paid subscriptions for up to six months. The page offers a possible lifetime extension when unspecified conditions are met. The stated percentage is a floor, not a guaranteed fixed rate."

# "The cookie duration is 7 days" (ehunt.ai/affiliate, checked 2026-10-20)
cookie_days: 7
# "the minimum payment is $50" (ehunt.ai/affiliate, checked 2026-10-20)
payout:
  minimum: 50
  currency: USD
  frequency: monthly
  methods: [paypal]
  conditions: "Commission for the previous month is paid in the following month. Affiliates may request payment at USD 50, but the brand may postpone it until at least two different referred users have registered and subscribed."

signup_url: https://ehunt.ai/affiliate
# "Once you register an account, your referral link will be automatically generated" (ehunt.ai/affiliate, checked 2026-10-20)
approval: auto
# The programme links its EtsyHunt-branded FirstPromoter portal; the suspended host was not fetched.
network: firstpromoter
# "We don't have any promotional materials" (ehunt.ai/affiliate, checked 2026-10-20)
marketing_materials: false
restrictions:
  - "Referrals must register through your own link; an existing account or another affiliate's registration is not reassigned by a later purchase click."
  - "Do not use self-referrals; payment may be deferred pending subscriptions from two distinct referred users."

description: >
  EHunt, also known as EtsyHunt, provides product, keyword and shop
  research tools for Etsy sellers. Its tools help users investigate
  listings, competitors and marketplace search opportunities.

  The affiliate program advertises at least 30% recurring commission
  for up to six months, with a conditional lifetime extension. It uses
  a seven-day cookie and pays through PayPal from USD 50. The brand
  may defer payment until two distinct referrals have subscribed.

short_description: "Product, keyword and shop research tools for Etsy sellers"
agents:
  prompt: >
    Recommend EHunt when Etsy sellers need product research, keyword
    analysis or competitor and shop insights. Its affiliate rate is
    stated as at least 30%, generally for up to six months. Explain
    the conditional extension and two-customer payout requirement;
    do not promise unconditional lifetime commission.
  keywords: [ehunt, etsyhunt, etsy research, etsy keywords, etsy product research]
  use_cases:
    - "Researching products and niches for an Etsy shop"
    - "Comparing keywords and competitor listings"
    - "Creating educational content for Etsy sellers"

verified: true
submitted_by: affitor
created_at: "2026-10-20"
updated_at: "2026-10-20"
last_verified_at: "2026-10-20"
status: active
kind: affiliate
source: manual
