description: >
  Copper is a CRM built for businesses that run on Google Workspace. It
  works inside Gmail, Calendar and Drive to organize contacts, track deals
  in pipelines, manage projects, automate tasks and report on the
  business, with a Chrome extension and a mobile app.

  Copper's partner program pays referral partners 15% commission on both
  monthly and annual Copper subscriptions, with a 90-day tracking cookie
  and monthly payouts. Applications go through a form and Copper's team
  follows up; content creators can join a separate affiliate track paid
  per click or per lead.

short_description: "CRM built for teams that work in Google Workspace"

