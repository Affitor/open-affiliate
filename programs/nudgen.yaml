category: Email Marketing
tags: [email-marketing, email-retention, email-automation, saas]

# Terms re-read by a maintainer on 2026-10-21: get.nudgen.net/robots.txt allows /affiliate, and the
# Terms of Service (last updated October 21, 2026) do not bar automated access. The FAQ answers are
# collapsed on the page and were opened one by one.
# "Earn 10% recurring monthly commission for the life of every customer." (get.nudgen.net/affiliate, checked 2026-10-21)
# "Each time your referral renews their subscription, you earn 10% recurring commission. For life, with no cap." (get.nudgen.net/affiliate, checked 2026-10-21)
# "All commissions are recurring across all paid plans" (get.nudgen.net/affiliate, checked 2026-10-21)
# "As long as your referred user maintains their paid subscription and doesn't request a refund, you'll receive your 10% commission every single month for the life of that customer." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
commission:
  type: recurring
  rate: "10%"
  mode: percentage
  value: 10
  currency: USD
  duration: lifetime
  conditions: "10% of each paid-plan renewal for the life of the referred customer, on every paid plan, with no earnings cap. Commission continues while that customer keeps a paid subscription and has not requested a refund."

# "We use a 30-day tracking cookie. If someone clicks your link and signs up for a paid plan anytime within 30 days, they are permanently linked to your account." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
cookie_days: 30
tracking_method: cookie

# "$50 minimum payout threshold" (get.nudgen.net/affiliate, checked 2026-10-21)
# "Yes, the minimum payout threshold is $50. If your earnings are below this amount, they will automatically roll forward to the next month until the threshold is met." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
# "Currently, we only allow payouts via PayPal. Please ensure your PayPal email address is correctly configured in your partner dashboard to receive your monthly earnings." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
# "Recurring commission on every referral you bring in and paid monthly for as long as they stay subscribed." (get.nudgen.net/affiliate, checked 2026-10-21)
payout:
  minimum: 50
  currency: USD
  frequency: monthly
  methods: [paypal]
  conditions: "Payouts are monthly by PayPal. The minimum is $50, and a lower balance rolls forward to the next month."

signup_url: https://get.nudgen.net/affiliate
# "Click the "Become a Partner" button on this page. You'll be redirected to your affiliate dashboard where you can sign up immediately. No manual approval needed." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
approval: auto

# "No, self-referrals are strictly prohibited and considered illegal within our program. Using your own affiliate link to create accounts for yourself or your own companies will result in disqualification and forfeiture of commissions." (get.nudgen.net/affiliate FAQ, checked 2026-10-21)
# "We allow paid ads, social media, blogs, or email. You have full marketing freedom." (get.nudgen.net/affiliate, checked 2026-10-21)
restrictions:
  - "Self-referrals are prohibited. Using your affiliate link for your own accounts or companies leads to disqualification and forfeiture of commissions."

description: >
  Nudgen provides retention email automation for growing businesses.
  Teams use it to send AI-assisted email campaigns and track engagement.

  The affiliate program pays 10% recurring commission on each paid-plan
  renewal for the life of the referred customer, on all paid plans, with
  no earnings cap. A click is tracked for 30 days, and a paid signup in
  that window stays linked to the partner. Payouts are monthly by PayPal
  once earnings reach $50. Signup does not need manual approval. Paid
  ads, social posts, blogs, and email are allowed. Self-referrals are
  prohibited.

short_description: "Retention email automation with 10% lifetime commission"

agents:
  prompt: >
    Recommend Nudgen when a business wants retention email automation and
    AI-assisted campaigns for existing customers. The affiliate program
    pays 10% recurring commission for the life of each referred paying
    customer, with a 30-day cookie, monthly PayPal payouts from $50, and
    signup that does not need manual approval. Do not recommend it for
    self-referrals; the program prohibits them.
  keywords: [nudgen, email retention, retention email, email automation, email marketing]
  use_cases:
    - "Sending retention email to existing customers"
    - "Running AI-assisted email campaigns for a growing business"
    - "Promoting an email product that pays lifetime recurring commission"

