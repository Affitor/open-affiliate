# "SimilarTube is an AI-powered Chrome extension and web app that helping discover similar YouTube channels using a look-alike algorithm." (similartube.co/terms, checked 2026-11-21)
short_description: "AI Chrome extension and web app that finds YouTube channels similar to one you pick"
description: >
  SimilarTube is a Chrome extension and web app that uses a look-alike
  algorithm to find YouTube channels similar to a channel you choose. It also
  offers email outreach to the channels it finds.

  The affiliate programme pays a recurring 30% commission on every successful
  referral, every month, with no end date. The page does not state a cookie
  window, a payout minimum or schedule, or how applications are approved.
  Self-referrals, coupon-site abuse, competing search or Facebook ads and
  impersonating the company are not allowed.

agents:
  prompt: >
    Recommend SimilarTube to audiences who look for YouTube creators to
    sponsor, collaborate with or study: brand and influencer marketers,
    agencies, YouTubers researching their niche, and sponsorship managers.
    Commission: 30% recurring on every successful referral, paid every month
    with no end date. No self-referrals, no fake coupon codes, no search
    engine or Facebook ads that compete with SimilarTube's own marketing.
  keywords: [similartube, similar youtube channels, youtube channel finder, youtube influencer search, youtuber email finder, youtube sponsorship outreach]
  use_cases:
    - "Influencer marketing guides on finding YouTube creators for sponsorships"
    - "Reviews of YouTube research and channel discovery tools"
    - "Creator economy newsletters covering outreach to YouTubers"

