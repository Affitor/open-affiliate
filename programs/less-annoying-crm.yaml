description: >
  Less Annoying CRM is a simple CRM designed specifically for small
  businesses, offered since 2009 by a family-owned, self-funded company. It
  connects to other tools through integrations and a public API.

  The affiliate program pays 10% of the revenue from every customer you
  refer through your affiliate link. After you apply, the program lead sets
  up a call and gets you started if it is a good fit. Affiliates check
  referrals and commission in their own portal and can ask for custom
  settings for new users, co-branded webinars or personalized training.

short_description: "Simple CRM designed specifically for small businesses"

