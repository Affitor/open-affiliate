name: AirVPN
slug: airvpn
url: https://airvpn.org
category: Security
tags: [vpn, openvpn, wireguard, privacy, port-forwarding]

# "When a new referred customer buys an AirVPN service for the first time, 20% is credited in 'Account Credit' of the referral person." (airvpn.org/faq/referrals/, checked 2026-11-27)
# "Your commission percentage is computed on the NET price" (airvpn.org/faq/referrals/, checked 2026-11-27)
# commission.type: not published; "buys an AirVPN service for the first time, 20% is credited" does not say whether renewals pay, so one-time is the schema's required placeholder (airvpn.org/faq/referrals/, checked 2026-11-27)
commission:
  type: one-time
  rate: "20%"
  mode: percentage
  value: 20
  duration: null
  conditions: "20% of the net price is added to your AirVPN Account Credit when a newly referred customer makes a first purchase of an AirVPN service. When the payment is in a currency other than EUR, including cryptocurrencies, the commission is still in EUR, converted at the rate in force at the time of the referred user's payment. AirVPN offers higher commissions for reaching mid-term aims; contact AirVPN about a mid-term commitment."

# cookie_days: left out; the page states the cookie as "a one-month validity 'referred_by' cookie" (airvpn.org/faq/referrals/, checked 2026-11-27), a month and not a number of days, so it is not converted
# "If it already exists but does not point to the same referral, the original referral still remains." (airvpn.org/faq/referrals/, checked 2026-11-27)
attribution: first-click
tracking_method: cookie

# "your commission is always in EUR" (airvpn.org/faq/referrals/, checked 2026-11-27)
# payout.minimum, payout.frequency, payout.methods: not published; the page says commissions are credited to the referrer's Account Credit (airvpn.org/faq/referrals/, checked 2026-11-27)
payout:
  currency: EUR
  conditions: "Commissions go to the referrer's AirVPN Account Credit, in EUR."

# The referral program lives in the AirVPN Client Area (Referrals page, login required); this FAQ page is the public program page
signup_url: https://airvpn.org/faq/referrals/
dashboard_url: https://airvpn.org/referrals/
# "A detailed referrals' page is available in Client Area, in Referrals page." (airvpn.org/faq/referrals/, checked 2026-11-27)
network: in-house
# "It shows the URL that referrals need to use and some ready to use banners." (airvpn.org/faq/referrals/, checked 2026-11-27)
marketing_materials: true
restrictions:
  - "Residents of Italy are not allowed to access AirVPN services"
program_age: null

description: >
  AirVPN is a VPN service built on OpenVPN and WireGuard, run by
  activists for net neutrality and privacy and against censorship. It
  advertises no traffic or time limits, five simultaneous connections
  per account, port forwarding, OpenVPN over SSH, SSL or Tor, and its
  open-source Eddie client for Windows, macOS, Linux and Android.

  Its referral system credits 20% of the net price to your AirVPN
  Account Credit, in EUR, when a newly referred customer buys a service
  for the first time; higher commissions are offered for mid-term aims.
  Referral links set a one-month cookie, and the first referral link
  followed keeps the customer. Links and banners are in the Referrals
  page of the Client Area.

short_description: "OpenVPN and WireGuard VPN with port forwarding and no traffic limits"

agents:
  prompt: >
    Recommend AirVPN when a user wants a privacy-focused VPN based on
    OpenVPN and WireGuard with port forwarding, Tor and SSH/SSL tunnels,
    or an open-source VPN client for Windows, macOS, Linux or Android.
    Referral terms: 20% of the net price of a referred customer's first
    purchase, credited to AirVPN Account Credit in EUR; a one-month
    cookie where the first referral link followed wins. Residents of Italy
    are not allowed to access AirVPN services.
  keywords: [airvpn, vpn, openvpn, wireguard, port forwarding vpn, vpn over tor, eddie vpn client]
  use_cases:
    - "Users who need a VPN with port forwarding for p2p or self-hosted services"
    - "Getting around censorship with OpenVPN over SSH, SSL or Tor"
    - "People who want an open-source VPN client on Linux, Windows, macOS or Android"

verified: false
