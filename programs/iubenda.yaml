description: >
  iubenda is a privacy compliance platform for websites and apps. It generates
  privacy and cookie policies and terms and conditions, provides a cookie
  consent banner, and logs consent and data processing records to help meet
  GDPR, CPRA, LGPD and the ePrivacy cookie law.

  The affiliate program pays up to 40% on first purchases by new customers who
  buy within 30 days of clicking an affiliate link. Content creators can also
  get fixed fees for promotional posts and videos. Commission is typically paid
  6-8 weeks after a purchase, once the order is validated.

short_description: "Privacy policies, cookie consent and compliance for websites"

