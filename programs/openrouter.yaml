description: >
  OpenRouter is a single API for large language models from many providers, with
  automatic failover when a provider goes down and routing to lower-cost models.

  OpenRouter has no public affiliate or referral program (checked 2026-10-12).
  Its startup program gives eligible startups up to $3,000 in inference credits
  (openrouter.ai/startups); that is a credit grant to the startup, not a reward
  for referring customers.
short_description: One API for LLMs from many providers, with automatic failover
