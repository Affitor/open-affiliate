# "75% Commission For the first 3 customers you refer" "35% Ongoing Commission For all additional customers" (marketsy.ai/affiliate-program, checked 2026-10-13)
commission:
  type: tiered
  rate: "up to 75%"
  mode: tiered
  value: 75
  currency: USD
  duration: lifetime
  conditions: "75% on the first 3 customers you refer, then 35% on every customer after that. The rate applies to the first subscription payment, all later recurring payments, upsells and upgrades, for as long as the customer stays. A referral stays tagged to your account for life."

