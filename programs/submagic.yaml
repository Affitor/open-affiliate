  captions, B-roll, transitions and sound effects automatically, and
  turns long videos into multiple short clips for TikTok, Reels and YouTube
  Shorts. It is built for creators, teams and businesses.

  The affiliate program pays 30% recurring commission for the lifetime of
  every new customer referred, and promo code sales are credited too. Payouts
  go out through PayPal on the 7th of each month once the balance reaches $50.
  Paid ads are not allowed.

