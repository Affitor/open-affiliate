description: >
  Metricool is a social media management tool for creators, brands and
  agencies. It plans and schedules posts across Instagram, TikTok, YouTube,
  LinkedIn, Facebook, Pinterest, Threads, X, Bluesky and more, with analytics,
  competitor tracking, ads reporting, an inbox, approvals and AI assistance.

  The affiliate program pays recurring commission on referrals who upgrade to
  Metricool Premium: 25% of subscriptions up to $100 per user at Tier 1, and 50%
  up to $300 per user once you reach 200 paid registrations. Every Metricool
  user is enrolled automatically, affiliate cookies never expire, and payouts
  are monthly once earnings reach $200.

