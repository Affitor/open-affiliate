description: >
  Vmake Labs is an AI social video studio that helps small businesses
  generate, enhance and optimize videos. It includes a UGC video generator,
  AI avatar videos, a video enhancer and upscaler, and background and
  watermark removal, and is optimized for TikTok, Instagram Reels, YouTube
  Shorts, Shopify and Amazon Inspire.

  The affiliate program pays a 25% commission for every new customer who
  upgrades to Pro with the affiliate's referral code. Anyone can apply by
  emailing business@vmake.ai with their social channels and audience
  profile; Vmake reviews each application and sends a referral code once
  approved.

