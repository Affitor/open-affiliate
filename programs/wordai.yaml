description: >
  WordAi is an AI text rewriter that rewrites any text the way a human would,
  for content writers and SEO work. It can create up to 1,000 unique
  rewrites of one article, fixes spelling and grammar as it goes, and adds
  related keywords to help each rewrite rank.

  The affiliate program pays 20% lifetime recurring commission on every
  subscription payment from customers you refer, whether it is their first
  or 100th. You get your affiliate link when you create an account, along
  with PPC ads, banners, email swipes and a dashboard to track progress.

short_description: "AI text rewriter for content writers and SEO"

