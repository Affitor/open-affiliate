description: >
  Elementor is a drag-and-drop website builder for WordPress, powering over 22
  million sites. Elementor One bundles the Editor Pro builder with AI for copy,
  code and images, image optimization, transactional email and accessibility
  tools, while Elementor Host is managed WordPress hosting on Google Cloud and
  Cloudflare.

  The affiliate program pays 55% on a first purchase of Elementor One during
  its launch phase and 45% on Editor Pro or Elementor Host. The cookie lasts
  45 days, the minimum payout is $200, and payment goes to PayPal or another
  agreed method. Affiliates get a dashboard, marketing assets and an affiliate
  manager; PPC ads and coupon sites are not allowed.

short_description: "Drag-and-drop WordPress website builder and hosting"

