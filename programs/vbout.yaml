description: >
  VBOUT is an AI-enabled marketing platform for agencies and marketers. It
  brings more than 12 marketing tools together, including email marketing,
  marketing automation, social media and e-commerce tracking, with built-in
  AI features.

  The affiliate program is free to join and pays 20% commission on referred
  paying accounts, rising to 30% for affiliates who refer enough paying
  customers within six months or publish a video overview of the platform.
  Referrals and commissions are tracked in a referral partner account.

short_description: "AI-enabled marketing automation platform for agencies"

