description: >
  Mindstamp is interactive video software for training, marketing, sales,
  education and support. Teams add questions, branching, buttons and lead
  capture to videos and get a report of what each viewer watched, answered
  and did.

  The affiliate program runs on Rewardful and pays 30% of each paid referral
  for the first 12 months. Referrals have 60 days to become paying customers,
  and commissions are paid monthly through PayPal with a $50 minimum. Paid
  advertising and self-referrals are not allowed.

short_description: "Interactive video software with per-viewer reporting"

