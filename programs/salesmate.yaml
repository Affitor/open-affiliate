description: >
  Salesmate is an AI-powered customer platform for mid-market and
  enterprise teams. It combines CRM, marketing automation, customer
  support, communication tools and workflows in one place, with AI
  assistants that help teams work their pipeline.

  The affiliate program pays a 20% recurring commission on subscriptions
  bought through your referral link during their first 12 months.
  Approved affiliates get referral links, creatives and a dashboard to
  track referrals and withdraw commissions.

short_description: "AI-powered CRM and customer platform for growing teams"

