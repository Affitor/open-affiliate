commission:
  type: one-time
  rate: "30%"
  mode: percentage
  value: 30
  duration: null
  conditions: "The starting commission is 30% by default on orders other than All-In-One orders; DVDFab says it could raise your rate as your sales status improves, and DVDFab reserves the final explanation of the commission rate. Orders completed on DVDFab's website in any language earn commission, tracked through purchase links carrying your unique Affiliate ID."

# cookie_days: not published on www.dvdfab.cn/webmaster.htm; the page says orders are tracked through your Affiliate ID links (checked 2026-11-26)
# payout.frequency: not published as a fixed schedule; "If an affiliate partner submits a settlement request during a particular month, it is generally reviewed by the end of that month." and "the settlement funds will be disbursed at the beginning of the following month" give no day, and "the specific settlement time may vary depending on the partner’s location and the chosen settlement method" (www.dvdfab.cn/webmaster.htm, checked 2026-11-26)
# payout.minimum, payout.methods: not published on www.dvdfab.cn/webmaster.htm (checked 2026-11-26)
payout:
  conditions: "Settlement runs monthly: a settlement request you submit during a month is generally reviewed by that month's end, and once the review is complete the funds go out at the start of the next month. Timing can vary with your location and the settlement method you choose, and DVDFab sends you the settlement details afterwards. If DVDFab ends the agreement for a breach, it owes no commissions from the date of the breach on; pending balances are not paid when an account is terminated for unacceptable advertising or solicitation; and unpaid accrued commissions are forfeited for cybersquatting or typosquatting."

