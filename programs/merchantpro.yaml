description: >
  MerchantPro is an eCommerce platform for building an online shop, a
  marketplace or several stores, selling worldwide and running B2B
  eCommerce. It offers responsive templates, SEO-optimized shop structure,
  online payment methods, order processing, CRM modules and an API.

  The affiliate program is aimed at advertising, SEO and influencer
  marketing agencies and people with a large social media following. It
  pays a monthly commission of 20% on the service plans referred customers
  buy, for 2 years. Affiliates get a dashboard with promotional materials
  and performance tracking, plus a dedicated account manager.

short_description: "eCommerce platform for online shops, marketplaces and B2B stores"

