# commission.rate: stated two ways, so left out: "Online Purchases: Earn 50% of the Annual Contract Value (ACV) in points" and "Non-Online Purchases: Earn 20% of the Annual Contract Value (ACV) in points" (www.splashtop.com/referral) vs "points in an amount equal to fifty percent (50%) of the dollar value of the first online payment" and "twenty percent (20%) of the dollar value of the first invoiced payment" (www.splashtop.com/legal/referral-terms-and-conditions), checked 2026-11-24
# commission.type: not published; the terms base the award on "the first online payment" but no page says renewals earn nothing, so one-time is the schema's required placeholder (www.splashtop.com/legal/referral-terms-and-conditions, checked 2026-11-24)
commission:
  type: one-time
  rate: "varies"
  mode: unknown
  value: null
  duration: null
  conditions: "Rewards are points loaded onto your Splashtop Account and redeemed for gift cards, not cash. For a qualifying subscription purchase made online, the program page FAQ gives 50% of ACV (the Annual Contract Value) as points, and 20% of ACV for qualifying purchases made offline; the Referral Terms instead give 50% of the dollar value of the referral's first online payment and 20% of the first invoiced payment. Each successful referral is capped at $2,500 on the program page and at 2,500 points per valid Confirmed Referral in the Referral Terms, and the FAQ sets no cap on how many eligible referrals you can make in a calendar year. When a customer uses a valid referral link to buy a qualifying Splashtop subscription, they get an exclusive 10% discount code by email."

# cookie_days: not published on www.splashtop.com/referral or www.splashtop.com/legal/referral-terms-and-conditions; the terms set a 21-day Qualifying Period from the start of the referral's free trial instead (checked 2026-11-24)

# payout.frequency: absent under rule #1 (longest delay 90 days > 60): "You will receive your award approximately 45 days from the date the referee subscribes using the link you provided. In some cases, it may be up to 90 days." (www.splashtop.com/referral) and "between forty-five (45) and up to ninety (90) days from the date a Confirmed Referral is verified by Splashtop" (www.splashtop.com/legal/referral-terms-and-conditions), checked 2026-11-24
# payout.methods: gift cards through the Reward Exchange platform; no enum value (checked 2026-11-24)
# payout.minimum: not published on either page (checked 2026-11-24)
payout:
  conditions: "Points reach your Splashtop Account about 45 days after the referred customer subscribes through your link, and in some cases up to 90 days, per the FAQ; the Referral Terms count 45 to 90 days from the date Splashtop verifies the Confirmed Referral. The wait lets Splashtop audit qualifying purchases for fraud and credit card chargebacks. Points are redeemed for gift cards on a third-party platform, Reward Exchange."

signup_url: https://www.splashtop.com/referral
# "Anyone who is eligible to participate in the program can simply register and get a personalized link to start referring and earning rewards." (www.splashtop.com/referral, checked 2026-11-24)
