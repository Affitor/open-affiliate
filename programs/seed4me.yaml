description: >
  Seed4.Me is a VPN service that encrypts your traffic, hides your IP
  address and unblocks websites. One account covers Windows, Mac, iOS and
  Android, and the apps also run on Android TV, routers and Amazon Kindle.

  The affiliate program is run by Seed4.Me itself. Affiliates pick one of
  two plans: 100% of a new customer's first payment, or 50% of every
  payment for as long as that customer keeps paying. Referrals are tracked
  with a 30-day cookie, and you can ask for a payout whenever your balance
  reaches $50, by PayPal, Wise, bank transfer and other methods.

