short_description: "AI agent with its own cloud computer that does browser and desktop jobs for you"
description: >
  MyClawn is an AI agent with its own cloud computer: you describe a job in
  plain words and it does the clicking, typing and reading on its own machine.
  It works in the browser and from ChatGPT or Claude. New accounts can try it
  on a free 24-hour computer; plans run from $19 to $159 a month.

  The partner program pays 30% of every subscription payment for each
  referred customer's first 12 months, with a 60-day window where the most
  recent link counts. Joining is free and the link works right away.
  Commission becomes payable 30 days after each payment and is paid monthly
  by PayPal or bank transfer once it reaches $50. Visitors in the EU/EEA, the
  UK and Switzerland are not tracked.

