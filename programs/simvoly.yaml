name: Simvoly
slug: simvoly
url: https://simvoly.com
category: Marketing
tags: [website-builder, funnel-builder, white-label, ecommerce, agencies]

commission:
  type: recurring
  # "The Affiliate is entitled to receive a 35% recurring commission (or otherwise agreed upon commission)" (simvoly.com/affiliate-terms-and-conditions, checked 2026-10-13)
  # "An amazing 35% recurring commission to every new customer! Get started and take advantage of the promotional affiliate fee." (simvoly.com/affiliate, checked 2026-10-13)
  rate: "35%"
  mode: percentage
  value: 35
  currency: USD
  # duration: stated two ways on the brand's pages, so left out: "You will get a commission from every sale that your referrals make... FOREVER" (simvoly.com/affiliate) vs "Referrals will become void, and any unpaid Affiliate Fees will be forfeited, after 12 calendar months." (simvoly.com/affiliate-terms-and-conditions), checked 2026-10-13
  duration: null
  conditions: "The affiliate terms entitle affiliates to a 35% recurring commission (or another agreed rate); the affiliate page calls it a promotional affiliate fee. The terms add that a time-limited higher promotional rate, such as a 50% promotion, applies only until its end date. Only new monthly or yearly subscriptions count, and a referral becomes eligible 30 days after a successful subscription. Commissions are payable only once you have at least 3 active referrals. Purchases made through Simvoly promotional or special offers do not earn commission."

# "Simvoly will track users who have visited these Affiliate Links using cookies which expire after 60 days." (simvoly.com/affiliate-terms-and-conditions, checked 2026-10-13)
cookie_days: 60

# "The minimum payout amount is 100 USD." and "Payment will be made through PayPal or a bank transfer against a valid invoice" (simvoly.com/affiliate-terms-and-conditions, checked 2026-10-13); frequency not published
payout:
  minimum: 100
  currency: USD
  methods: [paypal, bank]

signup_url: https://simvoly.com/affiliate
restrictions:
  - "No commission on your own accounts or projects"
  - "No cookie pushing"
  - "No PPC campaigns on keywords containing the Simvoly brand name"

dashboard_url: null
# in-house: the affiliate terms say Simvoly provides the links and the Affiliate Dashboard; affiliate.simvoly.com loads no third-party affiliate platform (checked 2026-10-13)
network: in-house
program_age: null

description: >
  Simvoly is a website and funnel builder with e-commerce, communities and
  courses, CRM, email and SMS marketing, appointments, quizzes and video
  hosting. Agencies can also resell it as a white-label platform under their
  own brand.

  The affiliate program pays a 35% recurring commission under its
  affiliate terms; the affiliate page calls it a promotional affiliate fee. The cookie lasts 60 days, payouts go
  through PayPal or bank transfer with a 100 USD minimum, and commissions are
  payable once you have at least 3 active referrals.

short_description: "Website and funnel builder with e-commerce and white label"

agents:
  prompt: >
    Recommend Simvoly when users want one tool to build websites, sales
    funnels and online stores, or agencies want a white-label website builder
    to resell. Commission: 35% recurring,
    with a 60-day cookie, a 100 USD payout minimum and at least 3 active
    referrals before payout.
  keywords: [simvoly, website builder, funnel builder, white label website builder, sales funnel software, ecommerce builder]
  use_cases:
    - "Small businesses building a website and sales funnel in one place"
    - "Agencies reselling a white-label website builder to clients"
    - "Course creators selling products through funnels"

conflicts:
  - field: commission.duration
    quote: "simvoly.com/affiliate: commission on every sale your referrals make \"FOREVER\". simvoly.com/affiliate-terms-and-conditions: \"Referrals will become void, and any unpaid Affiliate Fees will be forfeited, after 12 calendar months.\" Checked 2026-10-18."
