description: >
  Squarespace is a website builder for small businesses and creators, with
  templates, online stores, appointment scheduling, domains and email
  marketing in one platform.

  The affiliate program runs on Impact and pays a commission for every website
  or commerce subscription from a first-time Squarespace customer, with no cap
  on referrals. Squarespace shares the payout amounts after you apply, and all
  commissions are paid in U.S. dollars. Affiliates get creative assets and a
  monthly newsletter.

