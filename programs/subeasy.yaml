description: >
  SubEasy is an AI platform for transcription and subtitles. It turns audio
  and video into text, generates and translates captions with context-aware
  translation, and adds AI dubbing, text to speech, subtitle and watermark
  removal, audio separation and noise reduction, plus free YouTube subtitle
  tools.

  The partner program pays 30% recurring commission on each referred
  customer for two years. Payouts go out through PayPal 30 days after the
  customer pays, with a $50 minimum, and partners track clients, sales and
  balance in a partner portal.

short_description: "AI transcription, subtitles, translation and dubbing for audio and video"

agents:
  prompt: >
