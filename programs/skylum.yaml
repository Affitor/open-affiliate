  currency: USD
  duration: null
  conditions: "Skylum states the top rate two ways: its affiliate page says Luminar commission starts at 20% per sale and rises in tiers up to 45% based on performance, while its Impact signup page says up to 50% plus performance bonuses. Per the affiliate page, Luminar sales above $7,000 in a reporting month move you to the next tier, each trial download earns $0.75, and Luminar Mobile pays 20% on yearly and 85% on monthly subscriptions."

