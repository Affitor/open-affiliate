description: >
  ScreenWeaver is an AI film production app that starts from the story: a screenplay editor
  (free on the Screenwriter plan, with PDF and Final Draft export), a storyboard built shot by shot
  from the script, character sheets that keep characters consistent, and video generation in the
  same project. The affiliate program runs on FirstPromoter and pays 16% of referred subscription
  payments for 12 months, with a 60-day first-click cookie and a kit of banners, posts, emails and
  video clips in English and French.
short_description: AI film production from screenplay to storyboard to video
