    employees and laptops across locations. Commission: $600 when a referral
    reaches a sales qualified opportunity plus $1,000 when it becomes a
    customer, $1,600 in total, paid once per new customer.
  keywords: [rippling, hr software, payroll software, hris, employee benefits, it device management, expense management, peo]
  use_cases:
    - "Growing companies moving payroll, HR and benefits into one system"
    - "IT teams managing employee devices and app access alongside HR data"
    - "Finance teams handling expenses and spend in the same platform as payroll"

