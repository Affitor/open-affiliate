description: >
  HEED offers managed U.S. B2B contact lists researched against buyer criteria
  and public Instagram and TikTok profile research. Its partner program pays
  20% on eligible one-time purchases attributed to a partner's referral.
  Commissions require manual review. Starting December 4, 2026, HEED pays
  approved balances of $50 or more every 14 days on alternate Fridays via
  PayPal in USD. When a visitor allows affiliate tracking, HEED can store the
  latest referral for up to 30 days and attach it to checkout. Partners get
  their own referral link through Affonso via the HEED partner page.

