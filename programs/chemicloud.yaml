commission:
  type: one-time
  rate: "$50 to $200"
  mode: tiered
  value: 200
  currency: USD
  duration: null
  conditions: "One-time commission per new hosting customer, by the number of referrals within a calendar month and order maturation: $50 per sale for 1 to 5, $100 for 6 to 10, $150 for 11 to 20 and $200 for 21 or more. New accounts only; no commission on renewals, domain registrations and transfers, or add-ons. A commission qualifies once the new account stays in good standing for 45 days (for the $1 first-month Managed WordPress trial plans, 45 days counted from the start of the second month, 75 days in total), and ChemiCloud may extend this maturation period by up to 90 days for review. Instead of declining a commission, ChemiCloud may offer an alternative CPA, currently $25 per sale."

