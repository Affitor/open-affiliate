description: >
  ChemiCloud is a web hosting provider offering shared hosting, WordPress
  and managed WordPress hosting, reseller hosting, cloud VPS hosting, email
  hosting and domain registration and transfers.

  The affiliate program pays a one-time commission per new hosting customer,
  from $50 to $200 per sale by referral level (1 to 5, 6 to 10, 11 to 20, 21
  or more), with a 90-day cookie. A commission qualifies after the new
  account stays in good standing for 45 days (75 days on the $1 first-month
  Managed WordPress trial plans), renewals and domain
  registrations and transfers earn nothing, and payment needs a $250
  balance. A dedicated affiliate manager answers affiliates' questions.

