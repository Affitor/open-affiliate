# payout.frequency: stated two ways, so left out: "We pay affiliate commissions once per month" (chemicloud.com/affiliate) vs "Payment is issued on-request. … All payout requests will be processed on the 1st of the following month after the request is made." (chemicloud.com/affiliates-terms-of-service §4.4)
payout:
  minimum: 250
  currency: USD
  methods: [paypal, bank]
  conditions: "Commissions are paid once the balance reaches $250. The affiliate page offers direct wire transfer for commissions exceeding $1,000 monthly; the affiliate terms set a $1,000 USD minimum for wire transfer or ACH, with its fees borne by the affiliate. The affiliate page says commissions are paid once per month through PayPal; the affiliate terms say payment is issued on request from the affiliate portal and processed on the 1st of the month after the request, and also allow account credit for affiliates who are hosting customers. A payable commission not requested within one year is forfeited."

