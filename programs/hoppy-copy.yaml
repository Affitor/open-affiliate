# rate: the page states it two ways, so it is left as "varies":
#   "you'll receive 30% recurring commissions for a year." and "30% recurring revenue share on paid Hoppy Copy subscriptions." (hoppycopy.co/partners, checked 2026-10-13)
#   "Earn 50% commissions for 12 months." (same page)
# duration: "for a year" and "for 12 months" (same page)
commission:
  type: recurring
  rate: "varies"
  mode: unknown
  value: null
  currency: USD
  duration: "12 months"
  conditions: "Recurring commission on paid Hoppy Copy subscriptions from customers you refer, for 12 months. The partner page states both 30% and 50%, so the rate is not given here; confirm it when you sign up."

# "You'll receive a commission for anyone who converts into a customer within 60 days of having sent them to our website." (hoppycopy.co/partners, checked 2026-10-13)
cookie_days: 60

# payout minimum, frequency and methods: not published on hoppycopy.co/partners (checked 2026-10-13)

