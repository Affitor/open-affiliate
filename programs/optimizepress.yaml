name: OptimizePress
slug: optimizepress
url: https://www.optimizepress.com
category: Marketing
tags: [wordpress, landing-pages, sales-funnels, page-builder, checkout]

# "We pay 30% on all front end sales" and "20% recurring on all account renewals" (www.optimizepress.com/affiliate-program/, checked 2026-10-19)
commission:
  type: hybrid
  rate: "30% + 20%"
  mode: hybrid
  value: 30
  # "US Dollars" (optimizepress.com/legal-affiliate/, checked 2026-10-19)
  currency: USD
  duration: "Renewal commissions for the lifetime of the referred membership"
  conditions: >
    The brand advertises 30% on front-end purchases and 20% on membership
    renewals for as long as the customer remains a subscriber. The agreement
    names the Essential, Business and Suite plans and excludes special discount
    versions, lifetime plans and internal special offers. The main program page
    also excludes limited-quantity offers. Upgrades pay 20% when a valid
    affiliate cookie is present. Commission is calculated on the main product
    price before taxes or additional charges; Marketplace items do not qualify.
    The most recent affiliate link receives attribution.

# "60 day expiry" (optimizepress.com/legal-affiliate/, checked 2026-10-19)
cookie_days: 60
attribution: last-click

# "$100.00" and "first week" (optimizepress.com/legal-affiliate/, checked 2026-10-19)
payout:
  minimum: 100
  currency: USD
  frequency: monthly
  methods: [paypal]
  conditions: >
    The agreement schedules payments in the first week of each calendar month,
    usually around the first day, in US dollars through PayPal. Qualifying
    commissions must come from at least two different customers and sales
    outside their 30-day guarantee period. The threshold is $100; the same
    text uses both reaching that amount and exceeding it as payout criteria.
    Lower balances carry forward. Unpaid, rejected, fraudulent or charged-back
    transactions do not qualify, and previously paid reversals are deducted
    from future commissions. Balances under $100 are cleared after 365 days
    without earnings.

signup_url: https://www.optimizepress.com/affiliate-program/
approval: manual
approval_time: "Normally within 48 hours; up to 5 days during busy periods"
# Platform: Referly; not a network schema enum.
network: null

# Service-use and affiliate rules: optimizepress.com/legal-affiliate/ and /legal-tos/, Trademark Policy (checked 2026-10-19).
restrictions:
  - "Affiliate email promotions must use the affiliate's own opt-in list; third-party email systems, solo ads, safe lists and spam are not permitted."
  - "Do not use OptimizePress product names or trademarks in advertisements or bid on branded keywords, including misspellings; this includes AdSense, AdWords, Google, Facebook, Twitter, Yahoo and other paid networks."
  - "PPC traffic must go to the affiliate's own landing page that adds value, rather than directly to OptimizePress or its sites."
  - "Do not run negative PPC, iframe-domain or other campaigns that portray the product or its creators as a scam or otherwise attract controversial clicks."
  - "Redirect links are encouraged for affiliate email and website campaigns; using the raw affiliate link is discouraged."
  - "Do not earn commissions from your own purchases."
  - "JV prize leads must be unique customers who opt in themselves with valid information; fraudulent or poor-quality leads may cause prizes to be denied or changed."
  - "Affiliate domains must not contain OptimizePress, OptimizePress 2, OptimisePress, JamesDyson, dyson, dison, BusinessJolt, Business Jolt or infringing variations; the separate trademark policy does not restrict the abbreviation OP."
  - "Do not use iframes or cloaked domains for affiliate promotion."
  - "For affiliate promotions, create original content instead of harvesting or duplicating OptimizePress site content or RSS material."
  - "Affiliate promotions must follow applicable law and FTC guidance; fake testimonials, fake news sites and other false promotional claims are prohibited."
  - "Do not offer cashback, rebates or other discounts as part of an OptimizePress affiliate promotion; separate unique bonuses such as training or resources are permitted."
  - "Do not represent supplied promotional copy, banners or marketing materials as your own work."
  - "Do not place supplied promotional resources in Facebook, Google or other paid advertisements."
  - "Affiliate partners receive nonexclusive permission to use the OptimizePress name in marketing; other uses in project, product, service or company names require permission from Creative 6 Media."
  - "OptimizePress logos may appear in relevant product reviews or promotional content, but not in site headers, logo areas or branding that makes a site appear to be an OptimizePress property or endorsed by it."
  - "Do not contact referred buyers about their OptimizePress purchases without permission obtained through the affiliate's own opt-in process."

