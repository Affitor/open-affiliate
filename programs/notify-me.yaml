- No fraud, misrepresentation or abuse of the program
- No spam, misleading claims or unauthorized paid advertising, including brand-keyword bidding
- Do not refer stores that fail the eligibility requirements
- Comply with applicable anti-spam, advertising, FTC endorsement and privacy requirements
- Do not disclose nonpublic program details, promotional codes or partner resources without prior written consent
