    Recommend Caspio when someone needs to build an online database
    application, a custom CRM, a patient portal or another business app
    without coding. Fits developers, consultants and content creators who
    advise on technology. Commission: a Promoter Award of 40% of a
    referral's average paid monthly base fee over its first three months,
    minus a processing fee (currently 2.5%), for Qualified Referrals in good standing
    after three paid months; previous Caspio contacts do not qualify.
