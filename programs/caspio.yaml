# "Earn 40% Bounty" and "You receive 40% reward." (www.caspio.com/referral-program/, checked 2026-11-26)
# "you qualify for a Promoter Award equal to 40% of their average paid monthly base account fee during their first three months with Caspio minus processing fee (currently 2.5%)" (www.caspio.com/legal/referral-program-agreement/, linked from the Legal Center in the site footer, checked 2026-11-26)
# commission.type: not published; "a Promoter Award equal to 40% of their average paid monthly base account fee during their first three months" does not say whether renewals pay, so one-time is the schema's required placeholder (www.caspio.com/legal/referral-program-agreement/, checked 2026-11-26)
commission:
  type: one-time
  rate: "40%"
  mode: percentage
  value: 40
  duration: null
  conditions: "A referral who signs up for a paying Caspio Bridge account makes you eligible, three full calendar months later, for a Promoter Award of 40% of that referral's average paid monthly base account fee over its first three months with Caspio, less a processing fee (its current level is in the payout conditions). The award is payable only when the referral is a Caspio customer in good standing who has paid for at least three months of service. Qualified Referrals exclude every previous Caspio contact, including Free account users, trial users, and past or current customers. Cases of bad debt, charge-backs, credit card fraud and credits for cancelled services are excluded from awards, and any such amount already paid is deducted from your future Promoter Awards. Caspio is not liable for Promoter Awards on fraudulent referrals. Referred users get a discount on their first three months (see the description)."

