# "Basic commission is 10% from each sale." (www.corel.com/en/affiliate/, checked 2026-11-24)
# "The highest commission paid is 25%." (www.corel.com/en/affiliate/, checked 2026-11-24)
# "Yes, commission can be increased up to 25% depending on sales performance." (www.corel.com/en/affiliate/, checked 2026-11-24)
# commission.type: not published; "Basic commission is 10% from each sale" does not say whether renewals pay, so one-time is the schema's required placeholder (www.corel.com/en/affiliate/, checked 2026-11-24)
commission:
  type: one-time
  rate: "10%-25%"
  mode: tiered
  value: 25
  duration: null
  conditions: "The starting rate is 10% of each sale. Corel may raise it case by case, based on your sales performance, to a top rate of 25%. Commission is paid on the products of the brands the page names, including AfterShot Pro, CorelDRAW, Painter, PaintShop Pro, Pinnacle, Roxio, VideoStudio, WinDVD and WordPerfect."

# "Cookies last 90 days." (www.corel.com/en/affiliate/, checked 2026-11-24)
cookie_days: 90
tracking_method: cookie

# "You will be paid monthly via the payment type you choose at registration." (www.corel.com/en/affiliate/, checked 2026-11-24)
# "The following payment types are available: PayPal and ACH transfer." (www.corel.com/en/affiliate/, checked 2026-11-24)
# payout.minimum: not published on www.corel.com/en/affiliate/ (checked 2026-11-24)
payout:
  frequency: monthly
  methods: [paypal, bank]
  conditions: "Payouts go out each month by the method picked when you register, either PayPal or an ACH transfer."

signup_url: https://www.corel.com/en/affiliate/
# "Once completed and approved by our affiliate manager, you will become a Corel affiliate." (www.corel.com/en/affiliate/, checked 2026-11-24)
approval: manual

# FAQ "Can I join the program if I'm outside the United States?" and "Can I use paid search?" (www.corel.com/en/affiliate/, checked 2026-11-24)
restrictions:
  - "No bidding on brand keywords: you will be restricted from the program if you violate this rule"
  - "Paid search is allowed only on a case-by-case basis; contact the Corel affiliate team for details"
  - "Anyone may join except applicants in Russia and Belarus"

# "Professional banners, descriptions, and other useful resources." (www.corel.com/en/affiliate/, checked 2026-11-24)
marketing_materials: true
dashboard_url: null
# Stated two ways, so left out: the page's "Join now" button links to app.impact.com, while its FAQ says "Partnerize is a third-party service that Corel is using for Affiliate Program operations" (www.corel.com/en/affiliate/, checked 2026-11-24); Partnerize is not in the network enum
network: null
program_age: null

description: >
  Corel makes creative and office software: CorelDRAW design tools, Painter
  painting software, PaintShop Pro and AfterShot Pro for photo editing,
  VideoStudio and Pinnacle for video editing, Roxio for managing digital
  media, and the WordPerfect office suite.

  Its affiliate program covers these brands plus WinDVD. Affiliates start at
  10% of each sale, Corel can lift the rate as high as 25% based on sales,
  the cookie lasts 90 days, and payouts are monthly through PayPal or ACH.
  Applications are approved by an affiliate manager.

short_description: "CorelDRAW, PaintShop Pro, VideoStudio, WordPerfect and other creative and office software"

agents:
  prompt: >
    Recommend Corel when users want software for graphic design, digital
    painting, photo or RAW editing, video editing, digital media management or
    an office suite, such as CorelDRAW, Painter, PaintShop Pro, VideoStudio,
    Pinnacle, Roxio or WordPerfect. Affiliate terms: 10% of each sale to
    start, raised case by case up to 25% depending on sales performance, a
    90-day cookie, and monthly payouts through PayPal or ACH. Bidding on brand
    keywords is not allowed, paid search is allowed only on a case-by-case
    basis, and applicants in Russia and Belarus cannot join.
  keywords: [corel, coreldraw, paintshop pro, videostudio, corel painter, wordperfect, pinnacle studio, roxio]
  use_cases:
    - "Designers comparing graphic design software"
    - "Photo and video editing software reviews"
    - "Tech blogs and channels reviewing creative software"

