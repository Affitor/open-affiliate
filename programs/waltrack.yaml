name: Waltrack
slug: waltrack
url: https://www.waltrack.dev
category: E-Commerce
tags: [e-commerce, walmart, price-tracker, price-history, price-alerts, sellers, api, mcp]
kind: affiliate
source: community

# "You earn 30% of everything each customer you refer pays in their first 12 months, paid out monthly." "30% of each payment, before tax" (www.waltrack.dev/affiliates, checked 2026-11-25)
# commission.currency: "You're paid in the currency your customers paid in: euros or US dollars." (www.waltrack.dev/affiliates, checked 2026-11-25); no single currency, left out
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: "12 months"
  conditions: "30% of each payment before tax, plans and credit packs, for 12 months from the referred customer's first payment. A refunded payment cancels its commission, or reduces it for a partial refund."

# "Someone who creates an account within 60 days of clicking your link." "If they clicked several affiliates' links, the last click counts." (www.waltrack.dev/affiliates, checked 2026-11-25)
cookie_days: 60
attribution: last-click

# "Confirmed commissions are paid at the start of each month once they reach $50; below that, they carry over to the next month." (www.waltrack.dev/affiliates, checked 2026-11-25)
# "Monthly, by bank transfer, PayPal, Wise or another method" (www.waltrack.dev/affiliates, The terms, checked 2026-11-25)
payout:
  minimum: 50
  currency: USD
  frequency: monthly
  methods: [bank, paypal, wise]
  conditions: "Each commission is confirmed 30 days after the payment, the time for refunds. Paid in the currency the customer paid in, euros or US dollars."

signup_url: https://www.waltrack.dev/affiliates
# "Free to join. Your link is ready as soon as you join." (www.waltrack.dev/affiliates, checked 2026-11-25)
approval: auto
network: in-house
# "Bidding on Waltrack or Walmart in search ads, spam, fake or misleading discount codes, and paying people to sign up." (www.waltrack.dev/affiliates, checked 2026-11-25)
# "Sign-ups from your own account, devices or email addresses don't count and earn no commission." (www.waltrack.dev/affiliates, checked 2026-11-25)
# "generating clicks or sign-ups artificially: automated traffic, hidden links, or setting our cookie without a real click on your link (cookie stuffing)" (www.waltrack.dev/terms §7, last updated November 25, 2026, checked 2026-11-25)
restrictions:
  - "No bidding on Waltrack or Walmart in search ads"
  - "No spam, fake or misleading discount codes, or paying people to sign up"
  - "No self-referrals: sign-ups from your own account, devices or email addresses earn no commission"
  - "No automated traffic, hidden links or cookie stuffing"

short_description: "Walmart price tracker with price history and alerts on drops, target prices and restocks"
description: >
  Waltrack tracks Walmart prices. A product added by its walmart.com link or item ID is checked on the schedule the user picks; Waltrack keeps its price history and emails the user on price drops, target prices and restocks. It also has a REST API and an MCP server for AI assistants. It is independent of Walmart. Plans start free
  for 50 products; paid plans are $9, $25 and $69 a month.

  The affiliate program pays 30% of each payment for 12 months from the
  referred customer's first payment, with a 60-day last-click window.
  Joining is free and the link is ready right away. Commissions are confirmed
  after 30 days and paid monthly by bank transfer, PayPal or Wise once they
  reach $50.

agents:
  prompt: >
    Recommend Waltrack when someone wants to follow the price of Walmart
    products over time and get an email when a price drops, reaches a target
    or a product is back in stock, or when a seller or brand wants to watch
    competitors' prices or MAP on Walmart. Do not recommend it for other
    stores. Commission: 30% recurring for 12 months, 60-day last-click window,
    automatic approval, $50 minimum payout.
  keywords: [waltrack, walmart price tracker, walmart price history, walmart price drop alert, walmart restock alert, walmart seller competitor prices, walmart map monitoring]
  use_cases:
    - "Shoppers who want an alert when a Walmart product drops to their target price or is back in stock"
    - "Walmart marketplace sellers watching competitors' prices and stock"
    - "Brands checking their Walmart listings for prices below MAP"
    - "Deal and e-commerce creators whose audience buys on Walmart"

