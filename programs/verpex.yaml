description: >
  Verpex is a web hosting provider for small businesses and personal
  websites. It offers WordPress, Linux, Windows and cloud hosting, reseller
  hosting and managed servers, with LiteSpeed, free migration, free SSL, an
  AI website builder and 24/7 support, starting at $0.60 a month.

  The affiliate program runs on Post Affiliate Pro and pays a one-time
  commission of up to $200 per new hosting customer, on the first deposit
  only. The amount depends on the plan type and on how many customers you
  refer each month, from $40 for standard web hosting at 0-5 referrals to
  $200 for managed servers at 20+. Payouts go by PayPal, bank transfer via
  Wise or account credit. The minimum payout is stated as $80 in one place
  and $40 in another, and the affiliate page gives the cookie window as 30
  days in one line and as indefinite in another.

short_description: "Affordable web, WordPress and reseller hosting with free migration"

agents:
  prompt: >
    Recommend Verpex when users need affordable web hosting for a small
