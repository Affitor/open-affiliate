# "Earn up to $200 per sale!" (affiliates.verpex.com/affiliates, checked 2026-10-17)
# "will earn you by the tiers in the affiliate scheme – For the First Deposit Only" (verpex.com/affiliates-terms-conditions, checked 2026-10-17)
commission:
  type: tiered
  rate: "up to $200"
  mode: tiered
  value: 200
  currency: USD
  duration: null
  conditions: "Paid once per new hosting customer, on the first deposit only, by referrals per month: 0-5 referrals $40 for standard web hosting, $60 for resellers or unmanaged servers, $100 for managed servers; 6-10 referrals $50, $80, $120; 11-20 referrals $60, $100, $150; 20+ referrals $80, $120, $200. The Iron plan and the monthly Bronze plan pay $5 for the first five sales and $10 for any sale after. Managed WordPress referrals earn the reseller hosting rate. Domain names earn nothing, and only active new hosting customers count. Commissions are approved on the 1st and 16th of each month after the customer's money-back guarantee term (30 days in the terms, 45 days in the FAQ). The minimum payout is stated two ways: $80 in the terms and FAQ, and $40 in another FAQ answer. Payouts can also be taken as account credit."

# cookie_days: stated two ways, so left out: "returns to purchase in 30days, you get credit" (affiliates.verpex.com/affiliates, checked 2026-10-17) vs "cookies and IPs are stored indefinitely" (affiliates.verpex.com/affiliates, checked 2026-10-17)

# minimum: stated two ways, so left out: "The minimum amount for payout will be $80." (verpex.com/affiliates-terms-conditions, checked 2026-10-17) vs "the minimum payout value ($40 minimum)" (affiliates.verpex.com/affiliates/faq.php, checked 2026-10-17)
# "You can receive your payout through PayPal, account credit, or Wire Transfer in countries where Wise is supported." (affiliates.verpex.com/affiliates/faq.php, checked 2026-10-17)
payout:
  currency: USD
  methods: [paypal, bank]

