description: >
  Decodo, formerly Smartproxy, sells proxies and web data tools: residential,
  ISP, mobile and datacenter proxies across 195+ locations, a site unblocker,
  and a Web Data API to scrape, search, map and crawl websites. It also offers
  scraping templates, an MCP server, SDKs and a CLI for AI agents.

  The affiliate program pays up to 50% commission, up to $2,500 per new
  customer, with a 60-day cookie. You join through Impact and applications are
  reviewed. Paid ads are allowed as long as you do not bid on Decodo brand
  keywords or send ads to a Decodo URL.

short_description: "Proxies and web scraping API for data collection"

