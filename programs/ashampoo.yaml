description: >
  Ashampoo makes software for image and video editing, backups, security
  and Windows optimization, disc burning, office and CAD work, and privacy
  protection, plus PC games and apps for Android and iOS.

  The affiliate program is aimed at website operators and email marketers
  and pays a 30% standard commission on each sale, with special conditions
  negotiable on request. Ashampoo looks for partners whose sites already
  offer the latest software, have at least 5,000 visitors a day and can reach
  an extensive clientele by email. Partners register through Ashampoo's shop
  or through CJ.

