name: Instatus
slug: instatus
url: https://instatus.com
category: Developer Tools
tags: [status-page, uptime-monitoring, incident-management, devops, saas]

# "earn a recurring 30% commission on all sales." (instatus.com/referrals, checked 2026-10-24)
# "Your revenue goes on as long as they’re still active." (instatus.com/referrals, checked 2026-10-24)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
  conditions: "30% of the payments of each customer you refer, for as long as that customer stays active."

# "90 day cookie If your referrals come back within 3 months and upgrade" (instatus.com/referrals, checked 2026-10-24)
