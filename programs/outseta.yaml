# "Partners earn a 25% commission on all referrals— forever." (outseta.com/partners, checked 2026-10-20)
commission:
  type: recurring
  rate: "25%"
  mode: percentage
  value: 25
  duration: lifetime
  conditions: "25% commission on all referrals, paid for the life of the customer and based on both Outseta's subscription fees and its payment processing revenue."

