short_description: "Design App Store and Google Play screenshots once, then export every size the stores ask for"
description: >
  Storepanes, by Best Latest Apps, is a screenshot tool for mobile app
  makers: design App Store and Google Play screenshots once, then export
  every size the stores ask for, with templates, localization and device
  frames.

  The affiliate programme pays 50% of each payment from a referred customer,
  including renewals, for 12 months counted from the first click. Referrals
  are tracked by a 60-day cookie and the first affiliate link opened counts.
  It runs on Affitor: commissions are held 15 days, then the affiliate can
  request a withdrawal of $20 or more by Wise or bank transfer in US dollars.

