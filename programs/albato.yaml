  mode: tiered
  value: 50
  currency: USD
  # "Be commissioned as long as the referred accounts stay active on paid plans." (albato.com/affiliates, checked 2026-10-13)
  duration: lifetime
  conditions: "Paid monthly on the total amount paid by all referred users on Albato's recurring plans. Bronze 30% for up to 10 active accounts, Silver 40% for 11 to 30, Gold 50% for 30+. These are shown as raised rates over regular 10% / 15% / 25% and are labelled a Boost campaign on content.albato.com/affiliates. Sales of Albato lifetime-deal plans pay a separate 10% / 15% / 20%. Affiliates can offer their audience 20% off the first payment on any plan with an exclusive coupon."

