description: >
  PracticePanther is legal practice management software for law firms. It
  covers case management, legal billing and payments, trust accounting,
  calendaring, document management, eSignature and a legal CRM.

  The referral program pays 10% for a referral who subscribes to an annual
  plan and 5% for a monthly plan, submitted through a referral form.
  Partners with three referrals who became customers in the past year can
  apply to the Certified Preferred Partner Program for 12% and 7%, a
  co-branded landing page and a free user account.

short_description: "Practice management software for law firms"

