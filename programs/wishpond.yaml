# "You get paid again every time... the client’s subscription is renewed (monthly or annually)" (wishpond.com/affiliates/, checked 2026-10-20)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: lifetime
  conditions: "30% of each subscription bought by a customer who came through your referral link, on that visit or a later one, and 30% again each time the subscription renews, monthly or annually."

