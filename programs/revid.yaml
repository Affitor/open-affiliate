description: >
  Revid is an AI video tool for short-form content. It turns a prompt into a
  video, remixes viral TikToks and Reels, makes UGC-style ads with AI
  creators, music videos, avatars and captions, and can run an autopilot
  channel that writes, renders and posts videos daily. Videos publish straight
  to TikTok, YouTube, Instagram and X, and an API and MCP server let AI agents
  make videos.

  The affiliate program runs inside your Revid account and pays 20% of every
  payment for as long as the customer stays, including credit packs. Clicks
  count for 60 days, and affiliates can create personal codes that give their
  audience 20% off the first month. Payouts are monthly through Wise or bank
  transfer once the approved balance reaches $100.

short_description: "AI video generator for short-form social content and UGC ads"

