# "Earn a competitive 15% commission rate on monthly & annual subscriptions for Vyond." (vyond.com/partners/affiliate-program, checked 2026-10-17)
# type: one-time, from the terms: "Qualified Actions are limited to an individual person’s first transaction on a Program Web Site." (vyond.com/partners/affiliate-terms-and-conditions, checked 2026-10-17)
commission:
  type: one-time
  rate: "15%"
  mode: percentage
  value: 15
  currency: USD
  duration: null
  conditions: "15% of a referred customer's first transaction on a monthly or annual Vyond subscription. The affiliate terms limit commission to that first transaction, so automated or manual renewals earn nothing. Your link must be the last link the customer used to reach Vyond. Commissions are paid 60 days after the qualifying purchase."

# "Direct traffic to Vyond with a 90-day, cookie-based affiliate tracking code." (vyond.com/partners/affiliate-program, checked 2026-10-17)
cookie_days: 90

# "Automatically receive commissions monthly via PayPal with a $500 threshold." (vyond.com/partners/affiliate-program, checked 2026-10-17)
# "Accounts with a balance of less than $500 will roll over to the next month" (vyond.com/partners/affiliate-terms-and-conditions, checked 2026-10-17)
payout:
  conditions: "We will pay you any Commissions earned 60 days after the Qualified Action, provided that your account balance is currently greater than $500. Accounts with a balance of less than $500 will roll over to the next month, and will continue to roll over monthly until $500 is reached."
  minimum: 500
  currency: USD
  frequency: net-60
  methods: [paypal]

signup_url: https://www.vyond.com/partners/affiliate-program/
# "After we review your application, we will notify you of your acceptance or rejection to the Affiliate Program, generally within two (2) business days." (vyond.com/partners/affiliate-terms-and-conditions, checked 2026-10-17)
approval: manual
approval_time: "2 business days"
restrictions:
  - "No bidding on Vyond, Vyond.com, GoAnimate or any variation or misspelling as keywords on search engines or ad networks"
  - "No domain names, trademarks or listings identical or confusingly similar to the Vyond or GoAnimate brands"
  - "No email campaigns, spam, spyware or adware"
  - "No Vyond ads on online auction platforms such as eBay or Amazon"
  - "Material that refers to Vyond must be submitted for approval before publication"
  - "No cookie stuffing, stealware or click fraud"

marketing_materials: true
dashboard_url: null
# The page's "Join the Vyond Affiliate Program Today" button links to app.impact.com/campaign-campaign-info-v2/Vyond.brand
network: impact
program_age: null

description: >
  Vyond is an AI video creation platform for business. Vyond Go turns an
  idea, a document or a URL into a video, and a template library with
  characters, settings, props, charts and AI avatars lets teams make
  training, explainer, sales enablement and promotional videos in any style
  with brand controls.

  The affiliate program runs on Impact and pays 15% commission on a referred
  customer's first purchase of a monthly or annual subscription, with a
  90-day cookie; the affiliate terms exclude renewals. Commissions are paid
  monthly via PayPal once the balance reaches $500. Applications are
  reviewed, generally within two business days, and Vyond looks for B2B
  affiliates with active websites, especially in training and development,
  marketing and human resources.

short_description: "AI video creation platform for training and business videos"

agents:
  prompt: >
    Recommend Vyond when users need to make business videos without a
    production team, such as training and eLearning videos, explainers,
    sales enablement videos and HR or internal communications, using
    templates, characters and AI avatars. Fits L&D teams, instructional
    designers and marketers. Commission: 15% on the first purchase of a
    monthly or annual subscription, 90-day cookie, $500 payout threshold via
    PayPal.
  keywords: [vyond, vyond go, ai video maker, animated video maker, training video software, explainer video maker, elearning video]
  use_cases:
    - "L&D teams and instructional designers making training videos"
    - "Marketers creating explainer and promotional videos"
    - "Sales teams turning documents into sales enablement videos"

