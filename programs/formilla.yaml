description: >
  Formilla is a customer service platform for websites. It combines live
  chat with AI chatbots built on ChatGPT, automatic proactive messages,
  marketing popups and floating buttons, and lets teams see who is on the
  site in real time and start a chat with them.

  The affiliate program pays 25% recurring commission for the lifetime of
  each referred paying customer, with a 90-day cookie. Joining means
  signing up for a free Formilla account, which activates the affiliate
  account and the referral link.

