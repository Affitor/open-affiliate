description: >
  Krystal is a UK web hosting company offering domain names, web, business,
  reseller and managed WordPress hosting, a website builder, VPS, managed
  solutions, a CDN and cloud services including virtual machines, block and
  object storage and GPUs. Its data centres run on 100% renewable power and
  the company is a Certified B Corp.

  The affiliate program runs on AWIN and pays a flat amount per sale by
  monthly volume: £30 per sale for 1 to 5 sales, £50 for 6 to 10 and £65 for
  11 to 20, with a custom rate from 21 sales. Sales count once the customer
  stays past the 60-day money-back guarantee, and the cookie lasts 90 days.
  Joining is instant, and affiliates get three months of free hosting.

