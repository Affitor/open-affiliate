# "20% of each one-time payment for Lifetime plans" and "20% of each monthly or annual payment for subscription plans" (pcloud.com/affiliate, checked 2026-10-13)
commission:
  type: hybrid
  rate: "20%"
  mode: percentage
  value: 20
  currency: USD
  duration: null
  conditions: "Choose per referral: 20% of the one-time payment on Lifetime plans, or 20% of each monthly or annual payment on Personal and Business subscriptions. The page advertises up to 300 USD per sale. Bank transfer payouts need at least 500 USD."

