description: >
  accessiBe is a web accessibility platform that combines AI automation,
  developer tools and expert services to help businesses support ADA and EAA
  compliance in line with WCAG. Its products include accessWidget,
  accessScan, accessFlow for developing accessible code, and expert testing
  with custom accessibility fixes.

  The referral partner program runs on PartnerStack and pays recurring
  commission on new business and renewals for the life of the client,
  starting at 20% and rising to 30% as the active ARR you refer grows, plus a
  separate commission on one-time services. Joining is free, commissions are
  paid quarterly, and partners get a free accessWidget license for their own
  domain plus marketing collateral and training.

short_description: "Web accessibility platform for WCAG, ADA and EAA compliance"

