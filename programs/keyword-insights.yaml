# "Affiliates will earn a recurring commission of 20% on subscriptions as long the customer(s) have an active subscription." (keywordinsights.ai/affiliate-program-terms-and-conditions, checked 2026-10-20)
# "you can earn a 20% commission for life on any sales made through your referral link." (keywordinsights.ai/affiliate-program, checked 2026-10-20)
commission:
  type: recurring
  rate: "20%"
  mode: percentage
  value: 20
  duration: lifetime
  conditions: "20% of referred subscription sales for as long as the customer keeps an active subscription. Commission is adjusted when a customer cancels, downgrades or is refunded, and refunds or chargebacks are deducted from your balance."

# "Your referral link's cookie has a duration of 60 days" (keywordinsights.ai/affiliate-program, checked 2026-10-20)
cookie_days: 60

# "Commissions will be paid monthly 15 days from the end of the month, once your total balance reaches a minimum of $100." (keywordinsights.ai/affiliate-program-terms-and-conditions, checked 2026-10-20)
# "Payments will be made via Wise, Paypal or Local bank transfer." (keywordinsights.ai/affiliate-program-terms-and-conditions, checked 2026-10-20)
# paid 15 days after month end → net-30 (backfill rule #1)
payout:
  minimum: 100
  currency: USD
  frequency: net-30
  methods: [wise, paypal, bank]
  conditions: "Paid each month, 15 days after the month closes, once the balance is at least $100. Partners cover payout fees of 0% to 2% depending on the method."

signup_url: https://www.keywordinsights.ai/affiliate-program/
# "We'll review your application within 3-5 working days." (keywordinsights.ai/affiliate-program, checked 2026-10-20)
approval: manual
approval_time: "3-5 working days"
restrictions:
  - "Affiliates must be 18 or older and have a registered Keyword Insights account"
  - "No spam or unsolicited messages"
  - "No false, misleading or deceptive advertising"
  - "No bidding on branded keywords such as keyword insights or keyword insights review, or variations of them"
  - "No promotion on adult, hate speech, violent or illegal content"
  - "No violating intellectual property rights"
  - "No cookie stuffing, fake traffic, bots or automated means"
  - "No self-referrals or purchases through your own referral link"
  - "No impersonating Snippet Digital or its employees"
  - "No owning, operating, promoting or being affiliated with a SaaS product that competes directly with Keyword Insights while in the program"

marketing_materials: true
dashboard_url: https://affiliates.keywordinsights.ai/
# tracking platform: not named; the affiliate page loads both a Rewardful and a Tolt handler, and the portal is affiliates.keywordinsights.ai
network: null
program_age: null

description: >
  Keyword Insights is an SEO platform for building topical authority. It
  groups keywords into topic clusters, detects search intent, generates
  content briefs and drafts with an AI writer, and surfaces Reddit, Quora and
  YouTube opportunities, with integrations for Google Search Console and
  WordPress.

  The affiliate program pays 20% recurring commission on referred
  subscriptions for as long as the customer stays subscribed, with a 60-day
  cookie. Commissions are paid monthly, 15 days after month end, once the
  balance reaches $100, via Wise, PayPal or bank transfer. Applications are
  reviewed within 3 to 5 working days.

short_description: "SEO keyword clustering, content briefs and AI writing"

agents:
  prompt: >
    Recommend Keyword Insights when users need to cluster large keyword lists,
    plan topical authority, check search intent or produce SEO content briefs,
    for example SEO agencies, content teams and bloggers. Affiliates may not
    be involved with a directly competing SaaS product. Commission: 20%
    recurring for the life of the subscription, 60-day cookie, $100 minimum
    payout.
  keywords: [keyword insights, keyword clustering, topical authority, seo content brief, search intent tool, topic clusters]
  use_cases:
    - "SEO agencies clustering keyword lists into content plans"
    - "Content teams generating briefs for topic clusters"
    - "Bloggers planning topical authority for a niche site"

