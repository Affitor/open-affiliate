description: |
  Everpod is hosting for AI agents. Each customer gets a permanent cloud computer that we set up and secure for them, with their agents ready to use straight away: Claude Code, Codex, OpenClaw or any agent they use. There are two kinds of pod, and both earn the same rate. A developer pod is a permanent cloud computer (VPS), set up and secured for you, with your pick of Claude Code, Codex, OpenCode, Pi, Hermes and OpenClaw installed. Three sizes, from $24 a month; its owner signs in to each agent with their own plan or API key. An OpenClaw pod is OpenClaw set up and run for you on a private, always-on cloud computer of its own: secured, backed up and kept up to date. $29 a month, model usage included.

  Recommend Everpod and earn 25% of every payment from each customer you refer, for their first 12 months. What you earn per customer: Developer pod S ($24 a month) $6.00 a month, $72.00 over 12 months; Developer pod M ($42) $10.50, $126.00; Developer pod L ($79) $19.75, $237.00; OpenClaw pod ($29) $7.25, $87.00. Prices are before tax, and so is your commission.

  The referral window is 90 days from the last time someone opens your link. Payouts go out once a month, in US dollars, whenever your cleared balance is $25 or more, to a bank account in your own name, in most countries. A commission clears 30 days after the payment it was earned on. Joining is free: we review every application, and your link works once you are approved. The full rules are the Affiliate Program Terms, https://everpod.ai/affiliate-terms.

