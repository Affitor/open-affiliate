short_description: Photo and video records for goods, property, repairs, field work and service teams.
description: >-
  CodaScan helps teams connect work photos, videos and metadata to the order, item, job or location
  they document. Operators scan a barcode or QR code, or type a reference, then capture evidence on
  a phone. Records can be organized in SharePoint, Shopify, WooCommerce, Dropbox or Google Drive.
  Once configured, capture works offline and uploads resume when connectivity returns.


  WHO COULD USE CODASCAN


  The affiliate opportunity starts with a recurring task: a team takes photos, someone needs to find
  them later, and the pictures need a reliable connection to a reference. Partners can explore these
  workflows with professionals they already know:


  Goods, production and dispatch: Warehouse managers and freight coordinators; ecommerce, wholesale
  and retail operators; production supervisors and quality technicians; printers, sign makers and
  custom-fabrication workshops. Discuss pallet condition, packing and returns, batch defects, or the
  finish of a customer job.


  Buildings, trades and property: Construction and renovation contractors; electricians, plumbers
  and HVAC installers; property managers and letting agents; facilities managers and maintenance
  contractors. Discuss progress by work area, installation photos, property handovers and completed
  repairs, linked to a job, unit or asset.


  Assets, repairs and field services: Mechanics, body shops and fleet supervisors; equipment and
  tool-rental teams; electronics-repair technicians and IT field-service providers; utilities, solar
  and energy-maintenance teams. Discuss intake and return condition, parts and serial labels,
  previous service visits and completed work.


  Agriculture, food and outdoor work: Farmers, growers and nursery managers; cellar teams, wineries
  and wine distributors; food-production and catering teams; landscapers, groundskeepers, arborists
  and forestry crews. Discuss crop observations, lot and packaging photos, prepared orders and
  before-and-after site work.


  Hospitality, events and local services: Hotel and holiday-rental operators; cleaning and
  property-restoration contractors; event producers, exhibition installers and venue managers;
  removals, storage and specialist-transport teams. Discuss room readiness, service visits, event
  setup and the condition of belongings at handover.


  Institutions, collections and community services: School, university and research-facility teams;
  non-clinical healthcare facilities and equipment-service teams; museum, gallery and collections
  staff; municipal maintenance, recycling and waste-operation teams. Discuss authorized photos of
  equipment, rooms, objects, sites and completed service jobs.


  These are prospective workflows to evaluate, not claims of deployments in every industry. Confirm
  the reference, capture steps, metadata, destination and retrieval process in a small trial.
  Healthcare examples concern non-clinical facilities and equipment, excluding patient images and
  information. Connections to specialist ERP, maintenance or booking systems need to be assessed
  with CodaScan before they are promised.


  WHY AFFILIATES MAY WANT TO RECOMMEND IT


  The program suits Microsoft 365 and SharePoint consultants, ecommerce and 3PL advisers, operations
  consultants, trainers, educators, publishers and creators who explain practical business tools. A
  partner can demonstrate a task the buyer recognizes: photograph a job, file it against the right
  reference and retrieve it in the team’s existing system.


  Affiliates have a public sales masterclass with discovery questions, audience-specific pitches, a
  five-minute demonstration, objection responses, content ideas and a first-week action plan. A
  separate guide provides 24 industry ideas with the professionals to approach, sample references
  and opening questions. An earnings calculator explains illustrative scenarios, and the affiliate
  dashboard tracks attributed customers, eligible payments and commission status. Joining is free
  and no CodaScan purchase is required. The CodaScan homepage (https://getcodascan.com/) advertises
  a two-week free trial with no credit card required, giving prospective customers a way to evaluate
  a real workflow.


  Partners can also introduce free CodaScan workflow customization and additional storage
  integrations. Bring the customer’s requirements to CodaScan: the team confirms feasibility, scope
  and timing, then handles agreed development without an additional development fee. The customer
  pays for licenses and the affiliate earns on eligible subscriptions. Partners can discuss an
  adaptation without having a development team of their own; they should confirm the work with
  CodaScan before promising a feature or delivery date.


  COMMISSION AND PAYOUTS


  Affiliates earn 30% of eligible subscription revenue collected through CodaScan’s website billing,
  after discounts and excluding VAT or other sales taxes. Payment-processing fees are not deducted
  from that basis. Each referred customer has one 12-calendar-month earning window from their first
  successful collected subscription payment. Eligible added licenses, upgrades and annual payments
  can qualify within that same window; adding licenses does not restart it.


  For Shopify referrals, focus on 3PL mode: logistics providers manage multiple shops using licenses
  purchased on the CodaScan website, and eligible payments can qualify. Single-shop Merchant mode
  purchased through the Shopify app is excluded. Other integration-billed purchases are also
  excluded unless agreed otherwise in writing.


  Attribution must be established when a new customer registers. The last valid referral link before
  signup applies for up to 90 days, with an explicit signup code taking precedence. Existing
  accounts and self-referrals are ineligible. Trials and signups alone earn no commission.


  After the 30-day commission hold, an approved fiscal profile and at least €50 in available
  commission are required to request a payout in euros. Smaller balances carry forward without
  expiring. Complete, valid requests are reviewed and processed in one monthly batch, with a target
  of payment within 30 days after all required information is complete. Earlier no-minimum
  agreements remain applicable until the affiliate expressly accepts the new terms. Refunds and
  disputes can adjust or hold commissions.


