description: >
  Gumlet is a video hosting and streaming platform that also optimizes
  images. Teams use it to host, customize and protect videos with
  multi-DRM, domain and geo blocking, dynamic watermarks and expiring
  access tokens, play them in a branded player, and serve images and
  videos in compressed formats over a global CDN.

  Affiliates earn up to 30% of referral payments in the first year and 15%
  recurring after that, with a 60-day cookie and monthly PayPal payouts
  with no minimum.

