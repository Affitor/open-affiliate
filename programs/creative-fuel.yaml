description: >
  Creative Fuel is an ideation toolbox for YouTube creators, built by the
  original founders of TubeBuddy. Its idea engines generate video concepts,
  AI workshop tools turn ideas into content, and a browser extension fills in
  the YouTube upload screen from a workshopped idea. It has a free forever
  plan and paid plans.

  The affiliate program pays 50% of every payment from each referred customer
  for as long as they remain a customer. A commission counts once the license
  has been active for 30 days. Payouts are monthly by PayPal from $10, and
  Creative Fuel builds dedicated landing pages for affiliates who promote it
  seriously.

short_description: "Video idea and title toolbox for YouTube creators"

