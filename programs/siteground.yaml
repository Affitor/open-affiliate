description: >
  SiteGround is a web hosting company for WordPress, WooCommerce and other
  websites, running on Google Cloud with a global CDN. Plans include free SSL,
  daily backups, an AI-powered firewall, 24/7 support, an AI agent for
  WordPress, and access to AI models through SiteGround AI Studio. SiteGround
  also sells a website builder, Coderick AI, email marketing and domains.

  The affiliate program pays $50 per hosting sale at 1-5 sales a month, $75 at
  6-10 and up to $100 at 11-20, with custom deals from 21 sales. Referrals who
  buy another SiteGround service earn 60% of its first-year revenue. The cookie
  lasts 60 days, payouts are weekly with no minimum, and affiliates get a
  dedicated account manager.

