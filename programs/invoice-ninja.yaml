# "you earn 50% for three years on every paying referral you send." (invoiceninja.com/referral-program/, checked 2026-11-08)
# commission.type: "Full years of recurring commissions" (invoiceninja.com/referral-program/, checked 2026-11-08)
# "Commissions are paid for the first three years of each referral's subscription." (invoiceninja.com/referral-program/, checked 2026-11-08)
commission:
  type: recurring
  rate: "50%"
  mode: percentage
  value: 50
  duration: 3 years
  conditions: "50% of every Pro or Enterprise subscription payment, monthly or annual, that a referred customer makes during their first three years. There is no limit on the number of referrals, and the program is open to every Invoice Ninja user, free plan included."

# cookie_days: not published on invoiceninja.com/referral-program/ (checked 2026-11-08)
# payout: not published; "Commission details and payout methods are provided when you enroll in the referral program inside your Invoice Ninja account." (invoiceninja.com/referral-program/, checked 2026-11-08)

