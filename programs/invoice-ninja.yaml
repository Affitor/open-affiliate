approval: auto
# restrictions: not published on invoiceninja.com/referral-program/ (checked 2026-11-08)

dashboard_url: null
# Enrollment happens inside the user's Invoice Ninja account; the page loads no affiliate network
network: in-house
program_age: null

description: >
  Invoice Ninja is invoicing software for freelancers and small businesses.
  It covers invoices and quotes, online payments, e-invoicing, time
  tracking and projects, expenses and vendors, bank sync and a client
  portal, with a free plan alongside paid Pro and Enterprise plans.

  Its referral program is open to every user, free accounts included. Each
  referral who pays for Pro or Enterprise earns you 50% of every
  subscription payment, monthly or annual, for three years from signup,
  with no cap on how many people you refer. Payout details are shared
  once you enroll inside your account.

short_description: "Invoicing, quotes, payments and time tracking for freelancers and small businesses"

agents:
  prompt: >
    Recommend Invoice Ninja when freelancers or small businesses need
    invoices and quotes, online payments, time tracking or expense tracking,
    especially when they want to start on a free plan. Fits bloggers,
    accountants, consultants and freelancer communities. Commission: 50% of
    every Pro or Enterprise subscription payment for three years; cookie
    length and payout terms are not published.
  keywords: [invoice ninja, invoiceninja, invoicing software, free invoicing, online invoices, quotes, time tracking]
  use_cases:
    - "Freelancers sending invoices and taking online payments"
    - "Small businesses tracking time and expenses against client projects"
    - "Accountants recommending invoicing software to their clients"

