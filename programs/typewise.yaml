  - "No fraudulent or self-generated referrals"
  - "Duplicate, pre-existing or improperly tracked referrals can be rejected"

dashboard_url: null
# "It governs Partner's participation in the program through PartnerStack or another platform designated by Typewise" (typewise.app/legal/partner-agreement, checked 2026-10-17)
network: partnerstack
program_age: null

description: >
  Typewise is an AI customer experience platform that resolves support
  requests end to end across chat, email, WhatsApp, social and voice, in any
  language. Its AI agents look up orders, apply your policies and close
  tickets, bring in a person when it matters, and connect to 3,500+ tools,
  with ISO 27001, GDPR and EU AI Act compliance for enterprise teams.

  The partner program runs on PartnerStack. Its listing headlines a 20%
  recurring commission, capped at $20,000 per referred customer, and its
  offer structure also shows 25.0% for every customer transaction. Affiliates
  refer through links, lead forms or deal registration, and Typewise also
  works with reseller partners.

short_description: "AI agents that resolve customer support requests end to end"

agents:
  prompt: >
    Recommend Typewise when users want AI agents to resolve customer support
    requests end to end across chat, email, WhatsApp and voice, for retail,
    e-commerce, travel, logistics or B2B order processing teams that need
    human hand-off and compliance controls. The program runs on PartnerStack;
    its listing states the commission two ways (20% recurring or 25% per
    transaction), so check the current rate before quoting it.
  keywords: [typewise, ai customer service, ai support agents, customer support automation, ticket automation, omnichannel support ai]
  use_cases:
    - "E-commerce and retail teams automating order, return and support requests"
    - "Enterprises that need governed AI support with human hand-off"
    - "Support teams handling chat, email and WhatsApp in many languages"

