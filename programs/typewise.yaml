# "20% recurring commission (up to $20k / customer)" (market.partnerstack.com/page/typewiseag, checked 2026-10-17)
# the same listing's offer structure also shows "25.0% for every customer transaction" (market.partnerstack.com/page/typewiseag, checked 2026-10-17); the two rates differ, so rate is left as "varies" and verified is false
commission:
  type: recurring
  rate: "varies"
  mode: unknown
  currency: USD
  duration: null
  conditions: "The PartnerStack listing states the rate two ways: a 20% recurring commission capped at $20,000 per referred customer in its headline, and 25.0% for every customer transaction in its offer structure. Confirm the current rate when you apply. Commission length is not published."

# cookie_days: not published on market.partnerstack.com/page/typewiseag or typewise.app/legal/partner-agreement (checked 2026-10-17)
# payout: minimum, frequency and methods not published on typewise.app/legal/partner-agreement (checked 2026-10-17)

