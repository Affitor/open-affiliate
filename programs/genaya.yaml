    - business operations software
    - all-in-one business platform
    - ai receptionist
    - crm
    - scheduling software
    - invoicing and payments
    - call center software
    - website builder
    - field service software
    - clinic management
    - agency management
  use_cases:
    - "A service business wants scheduling, CRM, invoicing and payments in one platform"
    - "A team needs a call center with an AI receptionist tied to its client records"
    - "A business wants a website with online booking, hosting and a domain next to its operations tools"
    - "A consultant, creator or agency that serves small businesses is looking for a recurring affiliate program"

