# "30% recurring commission, forever" (lunacal.ai/affiliate-program, checked 2026-10-19)
commission:
  type: recurring
  rate: "30%"
  mode: percentage
  value: 30
  duration: "Lifetime of the referred subscription"
  conditions: >
    Applies to eligible paid subscriptions from new customers referred
    through the affiliate link. Self-referrals do not qualify and may be
    reversed.

# "The tracking cookie lasts 90 days." (lunacal.ai/affiliate-program, checked 2026-10-19)
