  booking pages for businesses. Its scheduling tools help organizations
  manage appointments and present booking information to customers.

  Its affiliate program pays 30% recurring commission on eligible referred
  paid subscriptions with no expiry on the commission window. Tracking uses
  a 90-day cookie, and payouts require $100 in accrued commission.

short_description: "Calendar scheduling and booking pages with recurring referral commissions"
