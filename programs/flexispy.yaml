payout:
  minimum: 100
  currency: USD
  frequency: net-30
  conditions: "Each month's commissions are paid in US dollars 20 days after the month ends (the program page says on the 20th), once the balance reaches $100 and you have made at least 5 sales within 365 days. Fees of the transfer are taken from the amount paid. If FlexiSPY ends your participation without cause, earned commission is paid within up to 6 months. The main affiliate page lists PayPal, Bitcoin, WebMoney and bank or wire transfer, while the payment options page lists PayPal, wire transfer, ACH, WebMoney and Payoneer."

