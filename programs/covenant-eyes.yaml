description: >
  Covenant Eyes makes Victory, an accountability and porn-blocking app
  for Christians that combines screen accountability, porn blocking and
  courses with a community. It covers iPhone, iPad, Android and Windows.

  The Covenant Eyes Affiliate Program gives each affiliate a personalized
  link, code and QR code and pays $20 per qualified sale with a 90-day
  cookie window. Affiliates do not need Creator Collective membership to
  take part in the program. Affiliates who meet its membership requirements (see
  restrictions) can join the Creator Collective; after 20 qualified sales
  in a rolling 90-day period they reach Champion and earn $25 per
  qualified sale in the next 90-day tier period.
  Applications go through Impact.

