description: >
  Foreman is construction management software for contractors. Its AI
  reads plan sets to produce takeoffs, turns quantities into priced budget
  lines, and keeps client agreements, purchase orders, change orders,
  invoices and vendor bills tied to the same project, with daily logs and
  field records.

  Its referral program pays $500 for each contractor you refer who becomes
  a paying Foreman customer, with no cap on referrals. It is free to join
  and open to anyone, including contractors; applications are approved
  before you start referring.

short_description: "AI takeoffs, estimating and project management for builders"

