description: >
  Originality.ai is an AI content detector and plagiarism checker for
  content publishers, agencies and schools. It also checks facts and AI
  hallucinations, grammar, readability, writing quality and editorial
  guidelines, with bulk scans, a Chrome and Google Docs extension, a Moodle
  plugin, an API and an MCP server.

  The affiliate program pays 25% recurring commission for up to 12 months on
  what referred customers spend, with a 90-day cookie. Payouts are monthly
  once the balance passes $50. Affiliates may not run Google Ads that send
  traffic straight to Originality.ai.

