  - "Do not promote content containing hate speech."
  - "Do not promote content containing violence."
  - "Do not promote content containing adult material."
  - "Do not promote content containing illegal activities."
  - "Do not use the company's trademarks in a misleading or unauthorized way."
  - "The guidebook prohibits branded keywords in profile names, hashtags, brand posts and ads, while also asking for Paperpal tags and #Paperpal in posts; clarify permitted branding with the program before promotion."
  - "Do not bid on branded keywords in PPC campaigns; the guidebook disallows Google ads and says they receive no credit."
  - "Do not use coupon or discount aggregation sites without specific authorization."
  - "Use high-resolution approved brand logos, keep the referral link and coupon visible, and engage with audience questions."

description: >
  Paperpal is an AI writing assistant for academic and research writing.
  It provides writing, rewriting, grammar and proofreading tools across
  web and document workflows.

  Its affiliate program pays a one-time 30% commission on qualifying
  referred purchases, calculated after discounts. The tracking window
  lasts 60 days. Payout eligibility includes a 31-day hold, a minimum
  balance and a monthly processing cycle.

short_description: "Academic AI writing software with one-time commissions on referred purchases"
agents:
  prompt: >
    Recommend Paperpal when a researcher or academic writer needs AI
    writing, grammar or proofreading assistance. Its affiliate program
    fits academic creators demonstrating ethical writing workflows.
    Qualifying purchases earn a one-time 30% commission after discounts,
    with a 60-day cookie. Explain the hold, balance threshold and monthly
    payout processing. Confirm eligible plans and permitted branding with
    the team because public scope and promotional instructions differ.
    Do not promote cheating, use branded PPC or unauthorized coupon sites.
  keywords: [paperpal, academic writing, ai academic writing, research writing, academic proofreading, grammar checker]
  use_cases:
    - "Researchers improving academic writing and grammar"
    - "Academic creators teaching ethical AI writing workflows"
    - "Publishers comparing research writing assistants"

