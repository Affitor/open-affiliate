name: Paperpal
slug: paperpal
url: https://paperpal.com
category: AI
tags: [academic-writing, ai-writing, proofreading, research-writing, grammar-checker]

# "Earn a 30% commission (non-recurring) on every Paperpal Prime purchase through your link." (paperpal.com/affiliate-program, checked 2026-10-19)
commission:
  type: one-time
  rate: "30%"
  mode: percentage
  value: 30
  conditions: >
    Commission is one-time and non-recurring on new referred purchases.
    The public FAQ identifies Paperpal Prime purchases, while the page
    headline describes all plans. Commission is calculated on the final
    sale value after any discount. Purchases must use the affiliate link.

# "Paperpal's Affiliate Program has a 60-day cookie window" (paperpal.com/affiliate-program, checked 2026-10-19)
cookie_days: 60

# "Minimum payment threshold: $50" (cdn.paperpal.com/assets/pdf/paperpal-affiliate-briefing-document-v1.pdf, linked from paperpal.com/affiliate-program, checked 2026-10-19)
payout:
  minimum: 50
  currency: USD
  frequency: net-60
  methods: [paypal, bank]
  conditions: >
    Commissions have a 31-day hold before becoming eligible. Eligible
    payouts are calculated on the first working day of the month and paid
    by the 15th. The FAQ says approved earnings must cross $50 and that
    payment is processed in the following month; the guidebook describes
    a $50 minimum. Lower balances carry forward. PayPal and Payoneer are
    supported. The brand's Payoneer guidance lists Global Bank Transfer
    and a Payoneer prepaid card, and describes 1-3 business days for
    transfers after onboarding. Guideline violations may terminate the
    partnership and retract commissions.

signup_url: https://paperpal.com/affiliate-program
