description: >
  Envato is a creative subscription with more than 26 million assets: video
  templates, stock video, royalty-free music, graphics, design templates,
  photos, 3D, fonts and web templates, plus AI tools for images, video, music
  and voice.

  The affiliate program runs on Impact and pays a flat commission per eligible
  subscriber: $20 to $80 a month for up to three months on monthly plans, or a
  single $120 to $500 on annual plans, depending on the plan. It uses a 90-day
  first-click cookie, and commissions are paid monthly on the 16th, with
  withdrawals from $10 by EFT or PayPal.

short_description: "Creative subscription for stock video, music, graphics and templates"

