description: >
  KreadoAI is an AI video and ad creative platform: text and image to video,
  AI spokesperson and UGC avatar videos, AI images, text to speech, voice
  cloning, background removal and video and image translation for ecommerce
  and marketing teams.

  The affiliate program runs on Rewardful and pays commission on
  subscriptions for 12 months from the first payment, plus one-off purchases,
  with a 30-day cookie and a $50 monthly payout minimum. The page states the
  rate as both 20% and 25%.

