description: >
  Elai is an AI video generator for training and explainer videos: you write
  or paste text and an AI avatar presents it, without a camera or studio.
  Elai is powered by Panopto.

  The affiliate program runs on Rewardful and pays 25% of each payment a
  referred customer makes in their first 12 months, monthly or annual.
  Commission is paid in the first week of each month. Applications are
  reviewed.

