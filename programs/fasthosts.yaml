# "Our Affiliate Programme is free to join and pays out up to £620 per sale on a huge range of hosting products." (fasthosts.co.uk/affiliates, checked 2026-10-26)
commission:
  type: one-time
  rate: "Up to £620 per sale"
  mode: flat
  value: 620
