  conditions: "Commission per sale varies by hosting product, up to £620. A commission can be cancelled if the customer has a negative credit rating, cancels during the trial period, or orders twice with one order cancelled. Affiliates who order Fasthosts products for their own use also earn the commission."

# "if a customer visits Fasthosts via your site and returns to buy a product within 30 days, you’ll still earn commission." (fasthosts.co.uk/affiliates, checked 2026-10-26)
