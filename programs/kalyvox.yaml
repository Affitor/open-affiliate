  Kalyvox is an AI phone receptionist built for small businesses that cannot afford to miss calls or opportunities. It answers calls 24/7, filters and routes callers, captures leads, books appointments through calendar sync, sends instant SMS alerts for urgent calls, and connects with Zapier to automate follow-up workflows.

The platform is self-service, available in English and French, and supports the US, Canada, France, and 10 additional European countries.

Affiliates earn 20% recurring commission for 12 months on plans priced at $95 and $195 per month.

