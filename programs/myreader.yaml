description: >
  Myreader is an AI reading assistant. Users upload PDFs, EPUBs, Word and
  PowerPoint files, web articles or YouTube videos, then ask questions across
  a single document or a whole library and get answers with in-line page
  citations. It can also turn documents into audiobooks in 50+ voices and
  30+ languages, with an iPhone app.

  The affiliate program pays 30% of the revenue from each referred customer
  for 12 months. Payments go to PayPal on the 2nd of every month.

