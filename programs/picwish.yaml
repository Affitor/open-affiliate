description: >
  PicWish is an AI photo editor for product and personal images. It
  removes backgrounds in one click, generates AI backgrounds for product
  photos, retouches product details and unblurs images, on the web and in
  mobile and desktop apps.

  The affiliate program runs on impact.com and pays 30% to 40% per sale by
  partner tier, plus monthly performance bonuses. Sales are confirmed after the
  month in which they are tracked and paid out the following month, and affiliates get
  banners, product images and logos to promote with.

short_description: "AI photo editor for backgrounds and product images"

