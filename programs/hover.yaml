description: >
  Hover is a domain name registrar based in Toronto, Canada, operating since
  2008. It sells domain names and email for individuals and small businesses,
  with tools for domain registration, transfer and management.

  The affiliate program runs on Impact and pays a one-time 20% commission on
  each referred sale, with a 30-day cookie and no minimum sales requirement.
  Payouts are made on the 15th of the month after the sale. Tiered and premium
  domains do not earn commission.

short_description: "Domain name registrar with email for individuals and small businesses"

