description: >
  PixVerse is an AI video generation platform for turning text prompts and
  images into video. It offers its own PixVerse video models alongside other
  video and image models, plus AI tools for ads, sound effects and video
  extension, a Canvas for planning video workflows, mobile apps and an API.

  The affiliate program runs on Impact and pays 30% recurring commission on
  every subscription payment for 12 months, rising to 35% once referred
  revenue passes $5,000 in a month. The cookie lasts 90 days, payouts are
  monthly on net-30 terms by PayPal or bank wire, and most applications are
  approved within 24 hours.

