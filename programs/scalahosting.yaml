  per customer for referrers who recommend ScalaHosting without a content
  site. Commissions are paid monthly after a 45-day refund window, by
  PayPal or Payoneer. Applications are reviewed by hand, and coupon-only
  sites, spam and trademark bidding are not allowed.

short_description: "Managed cloud, VPS and WordPress hosting with SPanel"

