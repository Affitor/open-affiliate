description: >
  Rask AI is a video localization tool that translates, dubs and lip-syncs
  video and audio into more than 135 languages, with voice cloning, automatic
  transcription and subtitles, and an API for teams that localize at scale.

  The affiliate program pays $500 for each Marketing Qualified Lead for the
  Enterprise plan and a 25% commission on every referred Business plan user.
  The cookie lasts 60 days, and commissions are paid by PayPal in the month
  after the sale. Affiliates get a product overview, brand book, creatives and
  support from the affiliate team.

short_description: "AI video translation, dubbing and lip sync in 135+ languages"

