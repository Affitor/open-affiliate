description: >
  Setmore is an online appointment scheduling app for small businesses and
  teams. It includes a booking page, a website booking widget, class booking,
  staff scheduling, reminders, calendar sync, payments and a live receptionist
  service, with integrations for Google Calendar, Zoom, Square, Stripe,
  Facebook and WordPress. A free plan covers up to 4 users; Pro is paid per
  user.

  The affiliate program pays a one-time commission when a referral upgrades to
  a Pro or Team plan, from $3.60 for one user on a monthly plan up to $108 for
  six users on a yearly plan. The cookie lasts 90 days, and commission is paid
  once the referred account completes its first month or year.

short_description: "Online appointment scheduling and booking for small businesses"

