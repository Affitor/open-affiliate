description: >
  Hushmail is an encrypted email service with secure, e-signable forms and
  secure messaging, built mainly for therapists and healthcare practitioners
  who need HIPAA-compliant email and client intake. It also serves Canadian
  healthcare providers, small businesses, legal practices and personal users.

  The affiliate program is for content creators with an audience of
  healthcare and therapy professionals. Approved affiliates earn a one-time
  commission of 20% of the first year's value of the Hushmail for Healthcare
  plan a referral signs up for, once that referral has been a paying customer
  for 60 days. Referred users get a 28-day free trial.

short_description: "Encrypted, HIPAA-compliant email and forms for practices"

