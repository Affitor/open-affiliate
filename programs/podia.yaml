description: >
  Podia is an all-in-one platform for creators to sell online courses,
  digital downloads, coaching and events, run a free or paid community, and
  send email marketing, all from their own Podia website.

  The affiliate program pays 30% commission on all sales made through your
  link, for up to 12 months. The cookie lasts 90 days, commissions are paid
  out after 30 days, and the minimum payout is $50. Podia reviews applications
  and does not work with coupon sites; reviews, tutorials and comparisons are
  welcome.

short_description: "All-in-one platform for courses, community, coaching and email"

