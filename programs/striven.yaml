# commission.type: not published; "a $200 reward for every business you refer that becomes a Striven customer" does not say whether renewals pay, so one-time is the schema's required placeholder (striven.com/refer, checked 2026-11-04)
commission:
  type: one-time
  rate: "$200"
  mode: flat
  value: 200
  currency: USD
  duration: null
  conditions: "A $200 reward for each business you refer that becomes a Striven customer. After you tell a business owner or leader about Striven, Striven's team reaches out to offer a free consultation. The reward is a $200 Amazon gift card, or a $200 donation to a charity of your choice if your organization has a policy against employees receiving gifts, paid once the referred business officially becomes a customer."

# cookie_days: not published on striven.com/refer (checked 2026-11-04)
# payout: minimum, frequency and methods not published on striven.com/refer (checked 2026-11-04); the reward is an Amazon gift card or a charity donation, described in commission.conditions

