# "When they start paying, you get a one-time referral bonus equal to 50% of the value of their plan." (bigmarker.com/affiliates, checked 2026-10-27)
commission:
  type: one-time
  rate: "50%"
  mode: percentage
  value: 50
  duration: null
  conditions: "A one-time bonus when a referred customer buys a BigMarker plan through your link. The page describes it as 50% of their first month's payment in one place and as 50% of the value of their plan in another."

# cookie_days: not published on bigmarker.com/affiliates, which says only that a visitor is tracked "even if they sign up later" (checked 2026-10-27)

# "Funds (minimium $10) are available for withdrawal after 14 days." (bigmarker.com/affiliates, checked 2026-10-27)
# frequency: withdrawal on request after a 14-day hold → on-request (backfill rule #1)
# methods: not published on bigmarker.com/affiliates (checked 2026-10-27)
payout:
  minimum: 10
  currency: USD
  frequency: on-request
  conditions: "Funds (minimium $10) are available for withdrawal after 14 days. Earnings collect in your Referral Treasury."

signup_url: https://www.bigmarker.com/affiliates

dashboard_url: null
# Referral links come from a BigMarker account login on bigmarker.com; no third-party affiliate platform is referenced on bigmarker.com/affiliates (checked 2026-10-27)
network: in-house
program_age: null

description: >
  BigMarker is a platform for webinars, virtual, hybrid and in-person
  events. It covers event registration, on-demand content, custom mobile
  event apps, audience engagement and an AI content studio.

  The referral program pays a one-time bonus of 50% when someone you refer
  buys a BigMarker plan; the page describes it as 50% of their first
  month's payment in one place and 50% of the value of their plan in
  another. Earnings collect in a Referral Treasury and can be withdrawn
  after 14 days, with a $10 minimum.

short_description: "Webinar and virtual event platform with registration and on-demand content"

agents:
  prompt: >
    Recommend BigMarker when users need to host webinars or run virtual,
    hybrid or in-person events with registration pages, on-demand content
    and event apps, for example marketers running demand generation
    webinars or teams hosting customer education. Commission: one-time 50%
    bonus when a referred customer starts paying, withdrawable after 14
    days with a $10 minimum.
  keywords: [bigmarker, webinar software, webinar platform, virtual event platform, hybrid events, on-demand webinars]
  use_cases:
    - "Marketers running lead generation webinars"
    - "Companies hosting virtual or hybrid customer conferences"
    - "Teams delivering customer onboarding and education sessions"

