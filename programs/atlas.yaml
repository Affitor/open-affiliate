description: >
  Atlas is an AI workspace for students. It generates step-by-step answers,
  helps develop ideas for writing, takes automatic lecture notes, creates notes
  and practice quizzes from any file, and lets classmates share course
  materials in one collaborative workspace. Atlas has web, iOS and Android
  apps.

  The affiliate program runs on Rewardful and pays up to 30% commission on
  every paid subscription from your referral link, with higher earnings as you
  refer more users. It is aimed at content creators, educators and
  influencers in education and technology. Payments are processed monthly
  once the minimum payout threshold is reached.

short_description: "AI study assistant and workspace for students"

