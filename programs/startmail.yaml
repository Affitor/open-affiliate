description: >
  StartMail provides private email for individuals and businesses, with
  encrypted email and email aliases. It is designed for people who want to
  protect their email privacy and use separate addresses for different
  conversations.

  Affiliates earn 100% of net sales value for qualified transactions during
  the first year. This includes yearly subscriptions, additional mailboxes
  and add-ons bought during the first subscription year, and upgrades from
  monthly to yearly plans while the subscription is younger than one year.
  Commissions become available for payment monthly once earnings reach $100.

short_description: "Private email and aliases for individuals and businesses"

