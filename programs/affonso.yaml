description: >
  Affonso is an affiliate and partner program platform for software
  companies. It connects to payment providers such as Stripe, Paddle and
  Polar, tracks clicks, referrals and conversions, manages commission rules
  and affiliate groups, and pays partners in one batch. A partner marketplace
  and an AI agent help companies find affiliates, creators and publishers
  whose audiences fit their product.

  Affonso's own affiliate program pays up to 30% recurring commission for 12
  months across three tiers: Starter pays 30% of the first month and 20%
  recurring after that, Advanced (25+ referrals) 35% then 25%, and Expert
  (100+ referrals) 40% then 30%. The cookie window is 180 days, or 240 days
  at the Advanced tier. Payout timing and minimums also depend on the tier,
  and applications are typically reviewed in under 48 hours.

short_description: "Affiliate tracking and partner growth platform for software companies"

