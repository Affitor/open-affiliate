  rate: "up to 30% recurring"
  mode: tiered
  value: 30
  duration: 12 months
  conditions: "Starter tier (0+ referrals): 30% of the first month, then 20% recurring. Advanced tier (25+ referrals): 35% of the first month, then 25% recurring, plus a 5% commission bonus on all sales. Expert tier (100+ referrals): 40% of the first month, then 30% recurring, plus a 10% commission bonus on all sales. The cookie window is 180 days, extended to 240 days at the Advanced tier. If a customer cancels within the 30-day hold period the commission is reversed, and recurring commissions stop when the subscription ends."

