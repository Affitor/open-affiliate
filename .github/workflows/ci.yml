name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm ci --ignore-scripts --prefix .github/scripts
      - run: node --test .github/scripts/auto-merge-policy.test.cjs
      - run: node --test .github/scripts/supabase-rls-policy.test.cjs
      - run: node --test .github/scripts/daily-audit-safety.test.cjs
      - run: node --test .github/scripts/sift-rankings-agg.test.cjs
      - run: node --test .github/scripts/fork-yaml-ci.test.cjs
      - run: node --test .github/scripts/program-logo-server.test.cjs
      - run: npx tsx --test scripts/saved-programs.test.ts scripts/new-feed.test.ts scripts/created-at.test.ts
      - run: npx tsx --test scripts/posthog-noise.test.ts
      - run: npx tsx --test scripts/apply-cta.test.ts
      - run: npx tsx --test scripts/sync-affitor.test.ts
      - run: npx tsx --test scripts/verify-programs.test.ts
      - run: npx tsx --test scripts/claims.test.ts scripts/claims-apply.test.ts
      - run: npx tsx --test scripts/check-type-scale.test.ts
      - run: npm run check:type-scale
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx tsx --test scripts/agentic-surface.test.ts
      - run: npx tsx --test scripts/agent-skills.test.ts
      - run: npx tsx --test scripts/agent-readiness.test.ts
      - run: npx tsx --test scripts/oas-tier1.test.ts
      - run: npx tsx --test scripts/compare-terms.test.ts
      # After the build: it reads the registry that prebuild regenerates.
      - run: npx tsx --test --test-force-exit scripts/no-program.test.ts
      - run: npx tsx --test --test-force-exit scripts/program-aliases.test.ts
      - run: npx tsx --test --test-force-exit scripts/mcp-route.test.ts
      - run: npx tsx --test --test-force-exit scripts/llms-budget.test.ts
      - run: npx tsx --test scripts/affiliate-score.test.ts
      - run: npx tsx --test scripts/commission-stats.test.ts
      - run: npx tsx --test scripts/commission-order.test.ts
      - run: npx tsx --test scripts/rankings-terms.test.ts
      - run: npx tsx --test scripts/oas.test.ts
      - run: npx tsx --test --test-force-exit scripts/confirmed-terms.test.ts
      - run: npx tsx --test --test-force-exit scripts/freshness.test.ts
      - run: npx tsx --test scripts/affitor-links.test.ts
      - run: npx tsx --test scripts/programs-directory.test.ts
      - run: npx tsx --test --test-force-exit scripts/best-posts.test.ts
      - run: npm run verify:client-registry
      - run: npm run verify:machine-surfaces

  validate-programs:
    name: Validate Programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate immutable creation dates
        run: npx tsx scripts/validate-created-at.ts

      - name: Validate YAML schema
        run: npx tsx scripts/build-registry.ts

      - name: Build registry
        run: npm run registry:build

      - name: Verify program URLs (changed files)
        if: github.event_name == 'pull_request'
        run: npm run verify:changed

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: ignore
