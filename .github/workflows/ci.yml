name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # packages/*/dist is gitignored, so a clean checkout has no type
      # declarations for @openaffiliate/scoring and tsc cannot resolve it.
      - run: npm run build --workspace @openaffiliate/scoring
      - run: npm run lint
      - run: npm ci --ignore-scripts --prefix .github/scripts
      - run: node --test .github/scripts/auto-merge-policy.test.cjs
      - run: node --test .github/scripts/supabase-rls-policy.test.cjs
      - run: node --test .github/scripts/daily-audit-safety.test.cjs
      - run: node --test .github/scripts/sift-rankings-agg.test.cjs
      - run: node --test .github/scripts/fork-yaml-ci.test.cjs
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run verify:client-registry
      - run: npm run verify:machine-surfaces

  validate-programs:
    name: Validate Programs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate YAML schema
        run: npx tsx scripts/build-registry.ts

      - name: Build registry
        run: npm run registry:build

      - name: Verify program URLs (changed files)
        if: github.event_name == 'pull_request'
        run: npm run verify:changed

      - name: Verify all program URLs (weekly)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run verify
        continue-on-error: true

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.json
          if-no-files-found: ignore
