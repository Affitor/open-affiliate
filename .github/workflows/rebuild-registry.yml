name: Rebuild registry

# The full registry, client projection, and lookup index are build artifacts
# committed to the repo. Keep them honest: whenever programs/ changes on main,
# regenerate and commit all of them.
#
# This used to be a step inside pr-programs.yml gated on `can_auto_merge`, so a
# PR merged by hand silently skipped it. That is how the committed registry came
# to claim 750 programs while programs/ held 755 — invisible on the site, since
# `prebuild` regenerates at build time, but wrong for anyone reading the file.
#
# main is protected (pull request plus required checks), so a direct push
# from this job is rejected and the run goes red. Push the generated
# files to bot/rebuild-registry and open or update one pull request.
# That branch is not main, and this workflow only listens to programs/**
# on main, so the bot push does not schedule another rebuild.

on:
  push:
    branches: [main]
    paths:
      - "programs/**"
  workflow_dispatch:

concurrency:
  group: rebuild-registry
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    name: Rebuild registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Adding a program YAML already produces the HTML page, the .md twin, the
      # sitemap entry, the JSON-LD, the API record and the category and network
      # listings. The logo was the one thing that did not appear on its own, so
      # a new program showed a grey tile with a letter while everything around
      # it had a brand mark. Never fails the run: a program with no logo falls
      # back to its initial, which is fine.
      - name: Fetch missing logos
        run: npx tsx scripts/fetch-logos.ts || true

      - name: Rebuild
        run: npx tsx scripts/build-registry.ts

      - name: Open a pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/registry.json src/lib/client-registry.json src/lib/registry-index.json src/lib/logo-files.json public/logos
          if git diff --cached --quiet; then
            echo "registry already up to date"
            exit 0
          fi
          git commit -m "chore: rebuild registry

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git fetch origin bot/rebuild-registry || true
          if git rev-parse --verify --quiet refs/remotes/origin/bot/rebuild-registry >/dev/null; then
            git push --force-with-lease=refs/heads/bot/rebuild-registry:refs/remotes/origin/bot/rebuild-registry \
              origin HEAD:bot/rebuild-registry
          else
            git push origin HEAD:bot/rebuild-registry
          fi
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head bot/rebuild-registry --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            # The Affitor org forbids Actions from creating pull requests.
            # The branch push above is the update. Do not fail the run for that.
            if ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head bot/rebuild-registry \
              --title "chore: rebuild registry" \
              --body "Generated from programs/ on main. Registry JSON only. Merge when CI is green."; then
              echo "bot/rebuild-registry is updated. Actions cannot open the pull request under org policy."
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...bot/rebuild-registry?expand=1"
            fi
          else
            echo "updated pull request #$existing"
          fi
